<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MedAcademy — Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f8fb; --card:#fff; --ink:#0f172a; --ink2:#475569; --muted:#94a3b8; --line:#e5e9f0;
  --blue:#1565d8; --blue-50:#eaf2ff; --green:#0e9f6e; --green-50:#e7f8f1; --red:#dc2626; --red-50:#fdecec;
  --amber:#d97706; --amber-50:#fff5e6; --violet:#7c3aed; --radius:14px; --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.05);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--font)}
a{color:var(--blue);text-decoration:none}
button{font:inherit;cursor:pointer}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.25;letter-spacing:-.01em}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px}
.muted{color:var(--ink2)} .small{font-size:12.5px} .tiny{font-size:11.5px;color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between} .grow{flex:1}
.grid{display:grid;gap:16px} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h3{margin-bottom:10px}
.stat .v{font-size:28px;font-weight:700;letter-spacing:-.02em} .stat .l{color:var(--ink2);font-size:13px}
.stat .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:var(--blue-50);float:right}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:10px;font-weight:600;font-size:13.5px}
.btn:hover{border-color:#cbd5e1;background:#f8fafc}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff} .btn.primary:hover{background:#0f56bd}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{border-color:transparent;background:transparent} .btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:#eef2f7;color:var(--ink2);white-space:nowrap}
.b-green{background:var(--green-50);color:#047857} .b-red{background:var(--red-50);color:#b91c1c} .b-amber{background:var(--amber-50);color:#b45309} .b-blue{background:var(--blue-50);color:#1d4ed8} .b-violet{background:#f1eafe;color:#6d28d9}
.bar{height:8px;background:#edf1f6;border-radius:99px;overflow:hidden} .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#22b8cf);border-radius:99px}
.bar.g>i{background:linear-gradient(90deg,var(--green),#34d399)} .bar.r>i{background:var(--red)} .bar.a>i{background:var(--amber)}
input,select,textarea{font:inherit;width:100%;padding:9px 12px;border:1px solid #d6dde7;border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #bcd6ff;border-color:var(--blue)}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 5px}
table.t{width:100%;border-collapse:collapse} .t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.t td{padding:10px;border-bottom:1px solid #f0f3f7;vertical-align:middle} .t tr:hover td{background:#fafcff}
.tbl{border-collapse:collapse;margin:8px 0} .tbl td,.tbl th{border:1px solid var(--line);padding:6px 10px;text-align:left}
.tablewrap{overflow-x:auto}

/* layout */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--green));display:grid;place-items:center;color:#fff;font-weight:800}
.brand b{display:block;font-size:15px} .brand span{font-size:11.5px;color:var(--muted)}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink2);font-weight:500;margin:1px 0}
.nav a:hover{background:#f3f6fa;color:var(--ink)} .nav a.on{background:var(--blue-50);color:var(--blue);font-weight:600}
.nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 10px 6px;font-weight:700}
.nav .cnt{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:0 7px}
.main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .who{margin-left:auto;display:flex;gap:10px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--blue-50);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.content{padding:24px;max-width:1280px}
.burger{display:none}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:fixed;left:-270px;width:260px;z-index:20;transition:left .2s;box-shadow:0 0 40px rgba(0,0,0,.15)}.side.open{left:0}.burger{display:inline-flex}.content{padding:16px}.top{padding:10px 14px}}
.demo-banner{background:#fff7e6;border-bottom:1px solid #fde2b3;color:#92400e;font-size:12.5px;padding:6px 24px}

/* landing */
.land{min-height:100vh;background:radial-gradient(1200px 500px at 80% -10%,#dcebff 0,transparent 60%),radial-gradient(900px 400px at -10% 10%,#dcf7ec 0,transparent 55%),#fff}
.land header{display:flex;align-items:center;padding:18px 40px;gap:12px}
.hero{max-width:1100px;margin:30px auto 0;padding:0 24px;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
.hero .k{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--blue);background:var(--blue-50);padding:5px 12px;border-radius:99px}
.hero h1{font-size:44px;margin:16px 0 8px;letter-spacing:-.03em}
.hero .tag{font-size:22px;font-weight:600;background:linear-gradient(90deg,var(--blue),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
@media(max-width:860px){.hero{grid-template-columns:1fr}.hero h1{font-size:32px}.land header{padding:14px 18px}}
.pillars{max-width:1100px;margin:50px auto;padding:0 24px;display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
@media(max-width:1000px){.pillars{grid-template-columns:repeat(2,1fr)}}
.pillar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;box-shadow:var(--shadow)} .pillar .e{font-size:26px} .pillar b{display:block;margin-top:6px;font-size:13px}
.authcard{max-width:440px}
.demo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px} .demo-grid button{text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff} .demo-grid button:hover{border-color:var(--blue);background:var(--blue-50)}
.demo-grid b{display:block;font-size:13px} .demo-grid span{font-size:11.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:#f1f4f8;padding:4px;border-radius:10px;margin-bottom:12px} .tabs button{flex:1;border:0;background:transparent;padding:7px;border-radius:8px;font-weight:600;color:var(--ink2)} .tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}

/* course */
.ccard{display:flex;flex-direction:column;gap:10px} .ccard .hd{display:flex;gap:12px;align-items:flex-start}
.cic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none}
.lesson{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#fff} .lesson .lh{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.lesson .lb{padding:4px 18px 16px;border-top:1px solid #f0f3f7} .lesson .lb ul,.lesson .lb ol{padding-left:20px}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid #cbd5e1;display:grid;place-items:center;font-size:12px;flex:none} .chk.on{background:var(--green);border-color:var(--green);color:#fff}
.note{background:#f0f7ff;border-left:3px solid var(--blue);padding:10px 12px;border-radius:8px;margin:10px 0}
.visual{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0} .visual>div{background:#f4f7fb;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600}

/* exam */
.qcard{max-width:820px} .qnum{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.05em}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;background:#fff}
.opt:hover{border-color:#b8cdf0} .opt.sel{border-color:var(--blue);background:var(--blue-50)} .opt.ok{border-color:var(--green);background:var(--green-50)} .opt.bad{border-color:var(--red);background:var(--red-50)}
.opt .mk{width:22px;height:22px;border-radius:6px;border:2px solid #cbd5e1;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700}
.opt.sel .mk{background:var(--blue);border-color:var(--blue);color:#fff}
.qnav{display:flex;flex-wrap:wrap;gap:6px} .qnav button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600}
.qnav button.ans{background:var(--blue-50);border-color:#b8cdf0} .qnav button.cur{outline:2px solid var(--blue)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px} .timer.low{color:var(--red)}
.vignette{background:#fbfaf5;border:1px solid #efe8cf;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.result-hero{text-align:center;padding:30px} .result-hero .big{font-size:56px;font-weight:800;letter-spacing:-.03em}
.expl{background:#f8fafc;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:13.5px}

/* certificate */
.cert{background:#fff;border:10px solid #eef4ff;outline:1px solid #c9dafc;border-radius:6px;padding:36px 40px;max-width:880px;margin:0 auto;position:relative}
.cert h1{font-size:30px;text-align:center;letter-spacing:.06em;color:#0b3a82} .cert .nm{font-size:30px;font-weight:700;text-align:center;margin:10px 0;color:var(--ink)}
.cert .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:24px;font-size:13px} .cert .meta b{display:block;font-size:14px}
.cert .qr{position:absolute;right:30px;bottom:28px;text-align:center;font-size:10px;color:var(--muted)} .cert .qr img,.cert .qr canvas{width:96px!important;height:96px!important}

/* misc */
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:360px}
.toast.err{background:var(--red)} .toast.ok{background:var(--green)}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:16px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.empty{text-align:center;color:var(--muted);padding:30px}
.kv{display:grid;grid-template-columns:160px 1fr;gap:6px 12px;font-size:13.5px} .kv div:nth-child(odd){color:var(--ink2)}
.lvl{font-weight:700}
.list-item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #f0f3f7} .list-item:last-child{border:0}
.hbar{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.steps{display:flex;gap:6px;margin-bottom:16px} .steps div{flex:1;height:5px;border-radius:99px;background:#e5e9f0} .steps div.on{background:var(--blue)}
.ai-box{background:linear-gradient(135deg,#f5f3ff,#eef6ff);border:1px solid #e0dafc}
pre.code{background:#0f172a;color:#e2e8f0;padding:12px;border-radius:10px;overflow:auto;font-size:12px}

/* MedAcademy Admin Panel — app.css tokenlari ustiga */
.adm-boot{display:grid;place-items:center;height:100vh;color:var(--muted)}
.adm{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.adm-side{background:#0f172a;color:#cbd5e1;padding:14px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
.adm-brand{display:flex;align-items:center;gap:10px;padding:6px 10px 14px;color:#fff;font-weight:700;font-size:15px}
.adm-brand i{width:30px;height:30px;border-radius:8px;background:var(--blue);display:grid;place-items:center;font-style:normal}
.adm-grp{margin:10px 0 4px;padding:0 10px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#64748b;font-weight:700}
.adm-nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:#cbd5e1;font-size:13.5px}
.adm-nav a:hover{background:#1e293b;color:#fff}
.adm-nav a.on{background:#1e3a8a;color:#fff}
.adm-nav a .cnt{margin-left:auto;font-size:11px;background:#334155;border-radius:99px;padding:0 7px}
.adm-main{min-width:0}
.adm-top{display:flex;align-items:center;gap:12px;padding:12px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.adm-top .who{margin-left:auto;text-align:right;line-height:1.2}
.adm-burger{display:none}
.adm-body{padding:22px;max-width:1320px}
.adm-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.adm-h h1{font-size:22px;margin:0}
.adm-h .sub{color:var(--ink2);font-size:13px}
.adm-h .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em}
.kpi .l{color:var(--ink2);font-size:12.5px}
.kpi.warn{border-color:#fcd9a8;background:#fffaf2} .kpi.ok{border-color:#b7ebd6;background:#f5fdf9} .kpi.bad{border-color:#f7c3c3;background:#fff7f7}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters input,.filters select{width:auto;min-width:150px;padding:7px 10px;font-size:13px}
.filters input[type=search]{min-width:240px;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .n{opacity:.7;margin-left:4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs a{padding:9px 14px;color:var(--ink2);font-weight:600;font-size:13.5px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--blue);border-color:var(--blue)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:13px;color:var(--ink2)}
.state{padding:34px 16px;text-align:center;color:var(--ink2)}
.state .ic{font-size:26px;margin-bottom:6px}
.state.err{color:#b91c1c}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,#eef2f7,#f8fafc,#eef2f7);background-size:200% 100%;animation:sk 1.2s infinite;margin:9px 0}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.kv{display:grid;grid-template-columns:200px 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--ink2)} .kv dd{margin:0;word-break:break-word}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow-y:auto}
.modal h3{margin-bottom:6px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;bottom:18px;right:18px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast div{background:#0f172a;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;max-width:380px;box-shadow:var(--shadow)}
.toast div.err{background:#b91c1c}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 14px}
.steps span{font-size:12px;padding:4px 10px;border-radius:99px;background:#eef2f7;color:var(--ink2);font-weight:600}
.steps span.done{background:var(--green-50);color:#047857} .steps span.cur{background:var(--blue);color:#fff}
.note{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink2)}
.note.warn{background:#fffaf2;border-color:#fcd9a8;color:#92400e}
.qtext{font-size:15px;line-height:1.6;white-space:pre-wrap}
.opt{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:13.5px}
.opt.ok{border-color:#86efac;background:#f0fdf4}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.t td .sub{font-size:12px;color:var(--muted)}
.t tr.click{cursor:pointer}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
.check{display:flex;gap:8px;align-items:flex-start;font-weight:500;margin:6px 0}
.check input{width:auto;margin-top:3px}
@media(max-width:900px){
  .adm{grid-template-columns:1fr}
  .adm-side{position:fixed;left:-260px;width:248px;z-index:40;transition:left .2s}
  .adm-side.open{left:0}
  .adm-burger{display:inline-flex}
  .adm-body{padding:14px}
  .kv{grid-template-columns:1fr}
  .filters input[type=search]{min-width:100%}
}
/* Phase 3 (007a–007e) */
.badge.b-green{background:#dcfce7;color:#166534}.badge.b-red{background:#fee2e2;color:#991b1b}.badge.b-amber{background:#fef3c7;color:#92400e}.badge.b-blue{background:#dbeafe;color:#1e40af}
.kpi.green .v{color:#15803d}.kpi.red .v{color:#b91c1c}.kpi.amber .v{color:#b45309}
.bar{height:8px;border-radius:6px;background:#eef2f7;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue,#2563eb);border-radius:6px}
.notif.unread{background:#f0f7ff}.notif.unread b{color:var(--blue,#1d4ed8)}
[data-bell]{position:relative;margin-right:6px}[data-bell] .badge{padding:0 6px;font-size:11px}
@media (max-width:900px){.adm-top{gap:8px;padding:10px 12px}.adm-top [data-title]{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.adm-top .who{min-width:0;overflow:hidden}.adm-top .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}}

</style>

<body>

  const fmtDT = v => { if (!v) return '—'; const d = new Date(v); return isNaN(d) ? esc(v) : d.toLocaleString('uz-UZ', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }); };
  const debounce = (fn, ms = 300) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

  // Holat belgilari — bir xil rang tizimi
  const LABELS = {
    workflow: { draft: ['Draft', ''], evidence_review: ['Evidence Review', 'b-amber'], instructor_review: ['Medical/Instructor Review', 'b-violet'], approved: ['Approved', 'b-blue'],
      published: ['Published', 'b-green'], review_required: ['Review Required', 'b-red'], deprecated: ['Deprecated', ''], archived: ['Archived', ''] },
    evidence: { current: ['Current', 'b-green'], review_due: ['Review Due', 'b-amber'], outdated: ['Outdated', 'b-red'], superseded: ['Superseded', 'b-red'],
      conflicting: ['Conflicting', 'b-red'], unknown: ['Unknown', 'b-amber'] },
    verification: { verified: ['Verified', 'b-green'], unverified: ['Unverified', 'b-amber'], failed: ['Failed', 'b-red'], not_applicable: ['N/A', ''] },
    source: { draft: ['Draft', ''], active: ['Active', 'b-green'], superseded: ['Superseded', 'b-red'], retracted: ['Retracted', 'b-red'], withdrawn: ['Withdrawn', 'b-red'], archived: ['Archived', ''] },
    course: { draft: ['Draft', ''], under_review: ['Under Review', 'b-amber'], approved: ['Approved', 'b-blue'], published: ['Published', 'b-green'], archived: ['Archived', ''] },
    employment: { active: ['Faol', 'b-green'], on_leave: ['Ta\'tilda', 'b-amber'], inactive: ['Nofaol', 'b-amber'], terminated: ['Ishdan ketgan', 'b-red'] },
    account: { active: ['Akkaunt faol', 'b-green'], pending: ['Tasdiq kutilmoqda', 'b-amber'], inactive: ['Inactive', 'b-amber'], deactivated: ['Deactivated', 'b-red'], rejected: ['Rad etilgan', 'b-red'] },
    reason: { evidence_rejected: ['Evidence rad etilgan', 'b-red'], evidence_changes_requested: ['Evidence: o\'zgartirish so\'ralgan', 'b-amber'],
      medical_rejected: ['Medical review rad etgan', 'b-red'], medical_changes_requested: ['Medical: o\'zgartirish so\'ralgan', 'b-amber'],
      mark_outdated: ['Manba eskirgan', 'b-red'], mark_conflicting: ['Ziddiyatli dalil', 'b-red'] },
    decision: { approved: ['Approved', 'b-green'], changes_requested: ['Changes requested', 'b-amber'], rejected: ['Rejected', 'b-red'], mark_outdated: ['Marked outdated', 'b-red'],
      mark_conflicting: ['Marked conflicting', 'b-red'], deprecate_recommended: ['Deprecate tavsiya', ''] },
    generic: { active: ['Active', 'b-green'], inactive: ['Inactive', ''], published: ['Published', 'b-green'], draft: ['Draft', ''], archived: ['Archived', ''],
      assigned: ['Tayinlangan', 'b-blue'], in_progress: ['Jarayonda', 'b-amber'], completed: ['Tugallangan', 'b-green'], overdue: ['Muddati o\'tgan', 'b-red'], cancelled: ['Bekor', ''],
      open: ['Ochiq', 'b-amber'] },
  };
  const badge = (kind, v) => { if (v === null || v === undefined || v === '') return '<span class="badge">—</span>'; const m = (LABELS[kind] || {})[v] || [v, '']; return `<span class="badge ${m[1]}" data-status="${esc(v)}">${esc(m[0])}</span>`; };

  const skeleton = (n = 6) => '<div class="card">' + Array.from({ length: n }, (_, i) => `<div class="skel" style="width:${60 + (i * 7) % 40}%"></div>`).join('') + '</div>';
  const empty = (msg, sub = '') => `<div class="state" data-state="empty"><div class="ic">∅</div><div><b>${esc(msg)}</b></div>${sub ? `<div class="small">${esc(sub)}</div>` : ''}</div>`;
  const errorBox = (e) => `<div class="state err" data-state="error"><div class="ic">!</div><div><b>Xatolik</b></div><div class="small">${esc(e && e.message ? e.message : e)}</div></div>`;
  const denied = (what = 'Bu bo\'lim') => `<div class="card"><div class="state" data-state="denied"><div class="ic">🔒</div><div><b>${esc(what)} uchun ruxsat yo'q</b></div><div class="small">Rolingizda kerakli ruxsat mavjud emas. Server ham bu ma'lumotni qaytarmaydi.</div></div></div>`;

  // Jadval: columns [{h, r: row => html, cls}]
  function table(rows, columns, opt = {}) {
    if (!rows.length) return empty(opt.empty || 'Ma\'lumot topilmadi', opt.emptySub || '');
    return `<div class="tablewrap"><table class="t" data-table="${esc(opt.id || '')}"><thead><tr>${columns.map(c => `<th>${esc(c.h)}</th>`).join('')}</tr></thead><tbody>` +
      rows.map(r => `<tr${opt.href ? ` class="click" data-href="${esc(opt.href(r))}"` : ''}>${columns.map(c => `<td class="${c.cls || ''}">${c.r(r)}</td>`).join('')}</tr>`).join('') +
      `</tbody></table></div>`;
  }
  function pager(page, size, total) {
    const pages = Math.max(1, Math.ceil((total || 0) / size));
    return `<div class="pager" data-pager><span>${total ? (page * size + 1) + '–' + Math.min(total, (page + 1) * size) + ' / ' + total : '0'}</span>
      <button class="btn sm" data-page="${page - 1}" ${page <= 0 ? 'disabled' : ''}>‹ Oldingi</button>
      <span>${page + 1} / ${pages}</span>
      <button class="btn sm" data-page="${page + 1}" ${page + 1 >= pages ? 'disabled' : ''}>Keyingi ›</button></div>`;
  }

  // Toast
  function toast(msg, isErr) {
    let box = document.querySelector('.toast'); if (!box) { box = document.createElement('div'); box.className = 'toast'; document.body.appendChild(box); }
    const d = document.createElement('div'); d.textContent = msg; if (isErr) d.className = 'err'; d.setAttribute('data-toast', isErr ? 'error' : 'ok'); box.appendChild(d);
    setTimeout(() => d.remove(), isErr ? 7000 : 3500);
  }

  // Dialog: kritik amallar uchun tasdiq. fields: [{name,label,type:'text'|'textarea'|'select'|'check',options,required}]
  function dialog({ title, body = '', fields = [], okText = 'Tasdiqlash', danger = false }) {
    return new Promise(resolve => {
      const bg = document.createElement('div'); bg.className = 'modal-bg';
      bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" data-dialog><h3>${esc(title)}</h3>${body ? `<div class="muted small">${body}</div>` : ''}
        <form>${fields.map(f => f.type === 'check' ? `<label class="check"><input type="checkbox" name="${esc(f.name)}" ${f.required ? 'required' : ''}> <span>${esc(f.label)}</span></label>`
          : `<label>${esc(f.label)}${f.required ? ' *' : ''}</label>` + (f.type === 'textarea' ? `<textarea name="${esc(f.name)}" rows="3" ${f.required ? 'required' : ''}>${esc(f.value || '')}</textarea>`
          : f.type === 'select' ? `<select name="${esc(f.name)}" ${f.required ? 'required' : ''}>${(f.options || []).map(o => `<option value="${esc(o[0])}" ${o[0] === f.value ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`
          : `<input name="${esc(f.name)}" type="${f.type || 'text'}" value="${esc(f.value || '')}" ${f.required ? 'required' : ''} ${f.pattern ? `pattern="${esc(f.pattern)}"` : ''} placeholder="${esc(f.placeholder || '')}">`)).join('')}
        <div class="small" data-err style="color:#b91c1c;margin-top:8px"></div>
        <div class="foot"><button type="button" class="btn" data-cancel>Bekor qilish</button><button type="submit" class="btn ${danger ? 'red' : 'primary'}" data-ok>${esc(okText)}</button></div></form></div>`;
      document.body.appendChild(bg);
      const form = bg.querySelector('form');
      const close = v => { bg.remove(); resolve(v); };
      bg.querySelector('[data-cancel]').onclick = () => close(null);
      bg.addEventListener('keydown', e => { if (e.key === 'Escape') close(null); });
      form.onsubmit = e => { e.preventDefault(); if (!form.reportValidity()) return; const out = {};
        fields.forEach(f => { const el = form.elements[f.name]; out[f.name] = f.type === 'check' ? el.checked : el.value.trim(); });
        const bad = fields.find(f => f.required && f.type !== 'check' && !out[f.name]); if (bad) { bg.querySelector('[data-err]').textContent = bad.label + ' majburiy'; return; }
        close(out); };
      const first = form.querySelector('input,textarea,select'); first && first.focus();
    });
  }

  // Sahifa registri (pages_*.js shu yerga yozadi; main.js ishga tushiradi)
  const routes = [];
  window.ADMIN = { routes, gen: 0, route(pattern, section, render) { routes.push({ re: new RegExp('^' + pattern.replace(/:(\w+)/g, '(?<$1>[^/]+)') + '$'), section, render }); }, go(h) { location.hash = h; } };
  window.UI = { esc, fmtDate, fmtDT, debounce, badge, LABELS, skeleton, empty, errorBox, denied, table, pager, toast, dialog };
})();

</script>
<script>/* js/admin/api.js */
/* Admin API qatlami: supabase-js (publishable key) + RLS. Service role kaliti frontend'da HECH QACHON yo'q.
   Barcha ruxsat tekshiruvlari serverda (RLS, trigger guard'lar, RPC). UI tekshiruvi faqat qulaylik uchun. */
(function () {
  const cfg = window.MEDACADEMY_CONFIG || {};
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) { window.API = { configured: false }; return; }
  if (/service_role|sb_secr[e]t_/i.test(cfg.supabaseAnonKey)) throw new Error('Xavfsizlik: frontend konfiguratsiyasida maxfiy kalit bo\'lmasligi kerak');
  const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'medacademy-admin-auth' } });
  let onExpired = () => {};

  const friendly = e => {
    if (!e) return new Error('Noma\'lum xato');
    const m = e.message || String(e);
    if (e.code === 'PGRST301' || /JWT expired/i.test(m)) { setTimeout(() => onExpired(), 0); return Object.assign(new Error('Sessiya muddati tugadi. Qayta kiring.'), { code: 'expired' }); }
    if (e.code === '42501' || /permission denied|row-level security/i.test(m)) return Object.assign(new Error('Ruxsat yo\'q (server rad etdi): ' + m), { code: 'denied' });
    if (e.code === '23503') return Object.assign(new Error('Bog\'liq yozuvlar mavjud — o\'chirib/uzib bo\'lmaydi: ' + m), { code: e.code });
    return Object.assign(new Error(m), { code: e.code });
  };
  const unwrap = async p => { const r = await p; if (r.error) throw friendly(r.error); return r; };

  // list(table, {select, eq:{}, in:{}, ilike:{col:q}, search:{cols:[],q}, or:'', gte:{}, lte:{}, is:{}, neq:{}, order:[col,asc], page, size})
  function applyFilters(q, o) {
    Object.entries(o.eq || {}).forEach(([k, v]) => { if (v !== '' && v !== undefined && v !== null) q = q.eq(k, v); });
    Object.entries(o.neq || {}).forEach(([k, v]) => { q = q.neq(k, v); });
    Object.entries(o.in || {}).forEach(([k, v]) => { q = q.in(k, v.length ? v : ['__none__']); });
    Object.entries(o.gte || {}).forEach(([k, v]) => { q = q.gte(k, v); });
    Object.entries(o.lte || {}).forEach(([k, v]) => { q = q.lte(k, v); });
    Object.entries(o.is || {}).forEach(([k, v]) => { q = q.is(k, v); });
    if (o.search && o.search.q) { const s = o.search.q.replace(/[(),*%]/g, ' ').trim(); if (s) q = q.or(o.search.cols.map(c => `${c}.ilike.*${s}*`).join(',')); }
    if (o.or) q = q.or(o.or);
    return q;
  }
  async function list(table, o = {}) {
    const size = o.size || 25, page = o.page || 0;
    let q = sb.from(table).select(o.select || '*', { count: o.count === false ? undefined : 'exact' });
    q = applyFilters(q, o);
    if (o.order) q = q.order(o.order[0], { ascending: o.order[1] !== false });
    if (o.all) q = q.range(0, (o.max || 999)); else q = q.range(page * size, page * size + size - 1);
    const r = await unwrap(q);
    return { rows: r.data || [], count: r.count ?? (r.data || []).length };
  }
  async function count(table, o = {}) { let q = sb.from(table).select('*', { count: 'exact', head: true }); q = applyFilters(q, o); const r = await unwrap(q); return r.count || 0; }
  async function get(table, col, val, select = '*') { const r = await unwrap(sb.from(table).select(select).eq(col, val).limit(1)); return (r.data || [])[0] || null; }
  async function insert(table, row) { const r = await unwrap(sb.from(table).insert(row).select()); return (r.data || [])[0]; }
  async function update(table, col, val, patch) { const r = await unwrap(sb.from(table).update(patch).eq(col, val).select()); if (!r.data || !r.data.length) throw new Error('Yozuv yangilanmadi (ruxsat yo\'q yoki topilmadi)'); return r.data[0]; }
  async function remove(table, col, val) { await unwrap(sb.from(table).delete().eq(col, val)); }
  async function rpc(fn, args) { const r = await unwrap(sb.rpc(fn, args || {})); return r.data; }

  window.API = { configured: true, sb, list, count, get, insert, update, remove, rpc, friendly, setOnExpired: f => { onExpired = f; } };
})();

</script>
<script>/* js/admin/perms.js */
/* Ruxsatlar: role_permissions jadvalidan o'z rolining ruxsatlari (RLS: role = my_role()). super_admin — hammasi.
   UI faqat ko'rsatish/yashirish uchun; har bir amal serverda RLS + trigger + RPC orqali qayta tekshiriladi. */
(function () {
  const ADMIN_ROLES = ['super_admin', 'hr', 'education_manager', 'instructor', 'department_head', 'medical_reviewer', 'content_author'];
  const ROLE_LABEL = { super_admin: 'Super Admin', hr: 'HR', education_manager: 'Education Manager', instructor: 'Instructor', department_head: 'Department Head',
    medical_reviewer: 'Medical Reviewer', content_author: 'Content Author', employee: 'Employee' };
  const state = { profile: null, perms: new Set() };
  async function load(uid) {
    const p = await API.get('profiles', 'id', uid, 'id,email,full_name,role,status,org_id,department');
    state.profile = p; state.perms = new Set();
    if (p && p.status === 'active' && p.role !== 'super_admin') {
      const r = await API.list('role_permissions', { select: 'permission_key', eq: { role: p.role, org_id: p.org_id }, all: true, count: false });
      r.rows.forEach(x => state.perms.add(x.permission_key));
    }
    return p;
  }
  const role = () => state.profile && state.profile.role;
  const can = k => !!state.profile && state.profile.status === 'active' && (state.profile.role === 'super_admin' || state.perms.has(k));
  const any = (...ks) => ks.some(can);
  const isAdminUser = () => !!state.profile && state.profile.status === 'active' && ADMIN_ROLES.includes(state.profile.role);
  // 005e: server qoidalari bilan bir xil (UX uchun; haqiqiy tekshiruv — guard_question_review / question_workflow trigger'lari)
  const MEDICAL_REVIEW_ROLES = ['super_admin', 'medical_reviewer'];
  const PUBLISH_ROLES = ['super_admin', 'education_manager'];
  const canMedicalReview = () => can('medical.review') && MEDICAL_REVIEW_ROLES.includes(role());
  const canPublish = () => can('question.publish') && PUBLISH_ROLES.includes(role());
  const canAssignReview = () => PUBLISH_ROLES.includes(role()) && !!state.profile && state.profile.status === 'active';

  // Bo'limlar → kerakli ruxsat (server ham shu ruxsatlarni tekshiradi)
  const SECTIONS = {
    dashboard: () => isAdminUser(),
    questions: () => can('question.view'),
    evidence_queue: () => any('evidence.review', 'question.review', 'medical.review'),
    evidence_library: () => can('evidence.view'),
    employees: () => can('employee.view') || role() === 'department_head',
    organization: () => any('department.view', 'department.manage', 'position.manage', 'specialty.manage') && role() !== 'instructor' && role() !== 'content_author' && role() !== 'medical_reviewer',
    education: () => any('course.edit', 'assignment.view', 'instructor.assign') || role() === 'instructor',
    exams: () => can('exam.view'),
    audit: () => can('audit.view'),
    // Phase 3 (007a–007e). UX uchun — haqiqiy himoya serverda (RLS + RPC).
    learning_paths: () => any('learning_path.manage', 'assignment.view'),
    progress: () => can('progress.view'),
    skills: () => can('skill.view'),
    compliance: () => (can('progress.view') && can('skill.view')) && ['super_admin', 'education_manager', 'hr', 'department_head'].includes(role()),
    notifications: () => isAdminUser(),
  };
  const section = s => !!(SECTIONS[s] && SECTIONS[s]());
  window.PERMS = { load, can, any, role, section, isAdminUser, state, ROLE_LABEL, ADMIN_ROLES, canMedicalReview, canPublish, canAssignReview };
})();

</script>
<script>/* js/admin/pages_core.js */
/* Umumiy ro'yxat sahifasi (filtr + qidiruv debounce + server-side pagination) va Dashboard / Audit. */
(function () {
  const { esc, badge, table, pager, empty, errorBox, skeleton, debounce, fmtDT } = UI;

  // cfg: {title, sub, actions, filters:[{key,type,label,options}], chips:{key,items,counts}, load(q)=>{rows,count}, columns, href, empty, size, onReady(el)}
  async function listPage(el, ctx, cfg) {
    const q = { page: +(ctx.query.page || 0), ...ctx.query };
    ctx.setTitle(cfg.title);
    el.innerHTML = `<div class="adm-h"><div><h1>${esc(cfg.title)}</h1>${cfg.sub ? `<div class="sub">${cfg.sub}</div>` : ''}</div><div class="act">${cfg.actions || ''}</div></div>
      ${cfg.top || ''}<div data-chips></div>
      <div class="filters">${(cfg.filters || []).map(f => f.type === 'search'
        ? `<input type="search" data-f="${esc(f.key)}" placeholder="${esc(f.label)}" value="${esc(q[f.key] || '')}">`
        : `<select data-f="${esc(f.key)}"><option value="">${esc(f.label)}: barchasi</option>${(f.options || []).map(o => `<option value="${esc(o[0])}" ${String(q[f.key] || '') === String(o[0]) ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`).join('')}</div>
      <div class="card" style="padding:6px 8px" data-list>${skeleton()}</div>`;
    const listEl = el.querySelector('[data-list]');
    const chipsEl = el.querySelector('[data-chips]');
    const drawChips = (counts) => { if (!cfg.chips) return; const cur = q[cfg.chips.key] || '';
      chipsEl.innerHTML = `<div class="chips">${cfg.chips.items.map(([v, l]) => `<button class="chip ${cur === v ? 'on' : ''}" data-chip="${esc(v)}">${esc(l)}${counts && counts[v] !== undefined ? `<span class="n">${counts[v]}</span>` : ''}</button>`).join('')}</div>`; };
    drawChips();
    if (cfg.chips && cfg.chips.counts) cfg.chips.counts().then(c => { if (ctx.alive()) drawChips(c); }).catch(() => {});
    let seq = 0;
    const load = async () => {
      const my = ++seq; listEl.innerHTML = skeleton(4);
      try {
        const size = cfg.size || 25; const r = await cfg.load({ ...q, page: +q.page || 0, size });
        if (!ctx.alive() || my !== seq) return;
        listEl.innerHTML = table(r.rows, cfg.columns, { href: cfg.href, empty: cfg.empty, emptySub: cfg.emptySub, id: cfg.id }) + (r.count > size || (+q.page || 0) > 0 ? pager(+q.page || 0, size, r.count) : `<div class="pager">${r.count} ta</div>`);
        cfg.onReady && cfg.onReady(listEl, r);
      } catch (e) { if (ctx.alive() && my === seq) listEl.innerHTML = errorBox(API.friendly(e)); }
    };
    const setQ = patch => { Object.assign(q, patch); ctx.setQuery(patch); load(); };
    el.querySelectorAll('[data-f]').forEach(inp => {
      const k = inp.getAttribute('data-f');
      if (inp.tagName === 'INPUT') inp.addEventListener('input', debounce(() => setQ({ [k]: inp.value.trim(), page: 0 }), 300));
      else inp.addEventListener('change', () => setQ({ [k]: inp.value, page: 0 }));
    });
    chipsEl.addEventListener('click', e => { const b = e.target.closest('[data-chip]'); if (!b) return; setQ({ [cfg.chips.key]: b.getAttribute('data-chip'), page: 0 }); drawChips(); cfg.chips.counts && cfg.chips.counts().then(c => ctx.alive() && drawChips(c)).catch(() => {}); });
    listEl.addEventListener('click', e => { const b = e.target.closest('[data-page]'); if (b && !b.disabled) setQ({ page: +b.getAttribute('data-page') }); });
    await load();
    return { reload: load, q };
  }

  // Lookups (bo'lim/lavozim/mutaxassislik/kurs) — RLS doirasida, keshlanadi
  const cache = {};
  async function lookup(table, label = 'name', extra = {}) {
    const key = table + label; if (cache[key]) return cache[key];
    const r = await API.list(table, { select: 'id,' + label, all: true, count: false, order: [label, true], ...extra });
    cache[key] = Object.fromEntries(r.rows.map(x => [x.id, x[label]])); return cache[key];
  }
  const clearCache = () => Object.keys(cache).forEach(k => delete cache[k]);

  // ---------------- Dashboard ----------------
  ADMIN.route('/', 'dashboard', async (el, ctx) => {
    ctx.setTitle('Dashboard');
    const p = PERMS.state.profile;
    el.innerHTML = `<div class="adm-h"><div><h1>Dashboard</h1><div class="sub">Ko'rsatkichlar sizning ruxsat doirangiz bo'yicha (server RLS) hisoblanadi.</div></div></div>
      <div class="kpis" data-kpis>${Array.from({ length: 10 }, () => '<div class="kpi"><div class="skel"></div><div class="skel" style="width:60%"></div></div>').join('')}</div>
      <div class="grid g2"><div class="card"><h3>Evidence lifecycle</h3><div class="small muted">Education → Evidence → Review → Medical Validation → Publication → Monitoring → Update</div><div data-ev style="margin-top:10px"></div></div>
      <div class="card"><h3>Eslatma</h3><div class="note">Klinik savollar faqat <b>Evidence Review + Medical Review</b>dan keyin imtihonga kiradi. Yaroqlilikni server (<span class="mono">question_meta</span>) hisoblaydi — Admin Panel uni o'zgartira olmaydi.</div></div></div>`;
    const safe = async f => { try { return await f(); } catch (e) { return null; } };
    const K = [
      ['Employees', () => PERMS.section('employees') ? API.count('employees') : null, ''],
      ['Active Employees', () => PERMS.section('employees') ? API.count('employees', { eq: { employment_status: 'active' } }) : null, 'ok'],
      ['Courses', () => API.count('courses'), ''],
      ['Questions', () => PERMS.can('question.view') ? API.count('questions') : null, ''],
      ['Evidence Pending', () => PERMS.can('question.view') ? API.count('questions', { in: { evidence_status: ['unknown', 'review_due', 'outdated', 'superseded', 'conflicting'] } }) : null, 'warn'],
      ['Evidence Reviewed', () => PERMS.can('question.view') ? API.count('questions', { eq: { evidence_status: 'current' } }) : null, 'ok'],
      ['Review Due', () => PERMS.can('question.view') ? API.count('questions', { or: `evidence_status.eq.review_due,evidence_review_due_at.lte.${new Date().toISOString()}` }) : null, 'warn'],
      ['Eligible Questions', async () => { const m = await API.rpc('question_meta'); return Array.isArray(m) ? m.length : 0; }, ''],
      ['Exams', () => PERMS.can('exam.view') ? API.count('exam_configs') : null, ''],
      ['Certificates', () => API.count('certificates'), ''],
    ];
    const vals = await Promise.all(K.map(k => safe(k[1])));
    if (!ctx.alive()) return;
    el.querySelector('[data-kpis]').innerHTML = K.map((k, i) => `<div class="kpi ${vals[i] === 0 && k[0] === 'Eligible Questions' ? 'bad' : k[2]}" data-kpi="${esc(k[0])}"><div class="v">${vals[i] === null ? '—' : vals[i]}</div><div class="l">${esc(k[0])}${vals[i] === null ? ' <span class="tiny">(ruxsat yo\'q)</span>' : ''}</div></div>`).join('');
    if (PERMS.can('question.view')) {
      const st = ['unknown', 'review_due', 'outdated', 'superseded', 'conflicting', 'current'];
      const c = await Promise.all(st.map(s => safe(() => API.count('questions', { eq: { evidence_status: s } }))));
      if (ctx.alive()) el.querySelector('[data-ev]').innerHTML = st.map((s, i) => `<div class="row between" style="padding:4px 0">${badge('evidence', s)}<b>${c[i] ?? '—'}</b></div>`).join('') +
        (vals[7] === 0 ? `<div class="note warn" style="margin-top:8px">Hozir imtihonga yaroqli savol yo'q. Birinchi navbat: klinik bo'lmagan kurslar (Ethics → Communication → Reception → Sales) evidence review'i.</div>` : '');
    } else el.querySelector('[data-ev]').innerHTML = '<div class="small muted">Savollar banki sizning rolingizga ochiq emas.</div>';
  });

  // ---------------- Audit Logs ----------------
  ADMIN.route('/audit', 'audit', (el, ctx) => listPage(el, ctx, {
    title: 'Audit Logs', id: 'audit', sub: 'Faqat server yozgan jurnal (audit_logs). Klient tomonidagi faollik tarixi bu yerda ko\'rsatilmaydi.',
    filters: [{ key: 's', type: 'search', label: 'Amal yoki obyekt ID bo\'yicha qidirish' },
      { key: 'entity', type: 'select', label: 'Obyekt', options: ['employee', 'department', 'position', 'specialty', 'permission', 'question_evidence', 'question_reviews', 'evidence_sources', 'course_assignments', 'lessons', 'course_modules'].map(x => [x, x]) }],
    load: q => API.list('audit_logs', { select: 'id,actor_id,actor_role,action,entity,entity_id,created_at,new_value', eq: { entity: q.entity }, search: { cols: ['action', 'entity_id'], q: q.s }, order: ['created_at', false], page: q.page, size: q.size }),
    columns: [{ h: 'Vaqt', r: x => fmtDT(x.created_at) }, { h: 'Amal', r: x => `<b>${esc(x.action)}</b>` }, { h: 'Obyekt', r: x => `${esc(x.entity)} <div class="sub mono">${esc(x.entity_id || '')}</div>` },
      { h: 'Kim', r: x => `${esc(PERMS.ROLE_LABEL[x.actor_role] || x.actor_role || 'tizim')}<div class="sub mono">${esc((x.actor_id || '').slice(0, 8))}</div>` },
      { h: 'Izoh', r: x => esc(x.new_value && x.new_value.reason ? x.new_value.reason : '') }],
    empty: 'Audit yozuvlari yo\'q',
  }));

  window.ADMINLIB = { listPage, lookup, clearCache };
})();

</script>
<script>/* js/admin/pages_questions.js */
/* Savollar banki: ro'yxat, filtrlar, savol kartasi (Question / Options / Correct Answer / Explanation / Evidence / Review / Version History) va workflow amallari. */
(function () {
  const { esc, badge, table, empty, errorBox, skeleton, fmtDT, fmtDate, toast, dialog } = UI;
  const { listPage, lookup } = ADMINLIB;
  const Q_COLS = 'id,code,course_id,module_id,type,topic,specialty,difficulty,stem,workflow_status,evidence_status,draft_status,current_version,published_version,evidence_review_due_at,updated_at';
  const STATUS_TABS = [['', 'All'], ['draft', 'Draft'], ['evidence_review', 'Evidence Review'], ['medical_review', 'Medical Review'], ['approved', 'Approved'],
    ['published', 'Published'], ['review_required', 'Review Required'], ['deprecated', 'Deprecated'], ['archived', 'Archived']];
  const EV = [['unknown', 'Unknown'], ['current', 'Current'], ['review_due', 'Review Due'], ['outdated', 'Outdated'], ['superseded', 'Superseded'], ['conflicting', 'Conflicting']];
  const TYPES = { single: 'Bitta javob', multiple: 'Ko\'p javob', tf: 'To\'g\'ri/Noto\'g\'ri', match: 'Moslashtirish', case: 'Klinik holat', short: 'Qisqa javob', image: 'Rasm', ecg: 'EKG', lab: 'Lab' };
  const trunc = (s, n = 110) => { s = String(s || ''); return s.length > n ? s.slice(0, n) + '…' : s; };

  function qFilter(q) {
    const o = { eq: { course_id: q.course, difficulty: q.difficulty, evidence_status: q.ev, specialty: q.specialty }, search: { cols: ['stem', 'code', 'topic', 'id'], q: q.s } };
    if (q.topic) o.search2 = q.topic;
    if (q.st === 'medical_review') { o.eq.evidence_status = 'current'; o.in = { workflow_status: ['draft', 'evidence_review', 'instructor_review', 'approved'] }; }
    else if (q.st) o.eq.workflow_status = q.st;
    if (q.rv === 'needs_evidence') o.in = { ...(o.in || {}), evidence_status: ['unknown', 'review_due', 'outdated', 'superseded', 'conflicting'] };
    if (q.rv === 'needs_medical') { o.eq.evidence_status = 'current'; o.neq = { workflow_status: 'published' }; }
    if (q.rv === 'reviewed') { o.eq.evidence_status = 'current'; o.eq.workflow_status = 'published'; }
    if (q.topic) o.or = `topic.ilike.*${q.topic.replace(/[(),*%]/g, ' ')}*,subtopic.ilike.*${q.topic.replace(/[(),*%]/g, ' ')}*`;
    return o;
  }

  ADMIN.route('/questions', 'questions', async (el, ctx) => {
    const courses = await lookup('courses', 'title');
    const specs = await API.list('specialties', { select: 'code,name', all: true, count: false, order: ['name', true] }).catch(() => ({ rows: [] }));
    await listPage(el, ctx, {
      title: 'Savollar banki', id: 'questions', sub: 'Ro\'yxatda javob kalitlari yuklanmaydi. Savol kartasida "Correct Answer" faqat ruxsatli rollarga ochiladi (RLS).',
      actions: PERMS.can('question.create') ? `<a class="btn primary" href="#/questions/new" data-act="new-question">+ Yangi savol</a>` : '',
      chips: { key: 'st', items: STATUS_TABS, counts: async () => { const out = {}; await Promise.all(STATUS_TABS.map(async ([v]) => { const o = qFilter({ st: v }); out[v] = await API.count('questions', o).catch(() => '—'); })); return out; } },
      filters: [{ key: 's', type: 'search', label: 'Qidirish: matn, kod, mavzu…' },
        { key: 'course', type: 'select', label: 'Kurs', options: Object.entries(courses) },
        { key: 'specialty', type: 'select', label: 'Mutaxassislik', options: specs.rows.map(s => [s.code, s.name]) },
        { key: 'topic', type: 'search', label: 'Mavzu' },
        { key: 'difficulty', type: 'select', label: 'Qiyinlik', options: [['easy', 'Oson'], ['medium', 'O\'rta'], ['hard', 'Qiyin'], ['expert', 'Ekspert']] },
        { key: 'ev', type: 'select', label: 'Evidence status', options: EV },
        { key: 'rv', type: 'select', label: 'Review status', options: [['needs_evidence', 'Evidence review kerak'], ['needs_medical', 'Medical review / publish kutmoqda'], ['reviewed', 'Review\'dan o\'tgan, nashr qilingan']] }],
      load: q => API.list('questions', { select: Q_COLS, ...qFilter(q), order: ['updated_at', false], page: q.page, size: q.size }),
      href: x => '#/questions/' + encodeURIComponent(x.id),
      columns: [{ h: 'Savol', r: x => `<div>${esc(trunc(x.stem))}</div><div class="sub mono">${esc(x.code || x.id)} · v${x.current_version}${x.published_version ? ' (nashr: v' + x.published_version + ')' : ''}</div>` },
        { h: 'Kurs / mavzu', r: x => `${esc(courses[x.course_id] || x.course_id)}<div class="sub">${esc(x.topic || '')}</div>` },
        { h: 'Tur', r: x => `${esc(TYPES[x.type] || x.type)}<div class="sub">${esc(x.difficulty)}</div>` },
        { h: 'Workflow', r: x => badge('workflow', x.workflow_status) + (x.draft_status ? `<div class="sub">ishchi versiya: ${esc(x.draft_status)}</div>` : '') },
        { h: 'Evidence', r: x => badge('evidence', x.evidence_status) + (x.evidence_review_due_at ? `<div class="sub">muddat: ${fmtDate(x.evidence_review_due_at)}</div>` : '') }],
      empty: 'Savol topilmadi', emptySub: 'Filtrlarni o\'zgartiring yoki rolingiz bu savollarni ko\'ra olmaydi.',
    });
  });

  // ---------- Yangi savol (Draft; server majburan draft + unknown evidence qiladi) ----------
  ADMIN.route('/questions/new', 'questions', async (el, ctx) => {
    ctx.setTitle('Yangi savol');
    if (!PERMS.can('question.create')) { el.innerHTML = UI.denied('Savol yaratish'); return; }
    const courses = await lookup('courses', 'title');
    el.innerHTML = `<div class="adm-h"><div><h1>Yangi savol</h1><div class="sub">Yangi savol har doim <b>Draft</b> va <b>Unknown evidence</b> holatida yaratiladi (server qoidasi). Imtihonga faqat review'dan keyin kiradi.</div></div></div>
      <form class="card" data-qform><div class="grid g2"><div><label>Kurs *</label><select name="course_id" required>${Object.entries(courses).map(([k, v]) => `<option value="${esc(k)}">${esc(v)}</option>`).join('')}</select></div>
      <div><label>Tur *</label><select name="type"><option value="single">Bitta javob</option><option value="multiple">Ko'p javob</option><option value="tf">To'g'ri / Noto'g'ri</option></select></div>
      <div><label>Mavzu</label><input name="topic"></div><div><label>Qiyinlik</label><select name="difficulty"><option value="easy">Oson</option><option value="medium" selected>O'rta</option><option value="hard">Qiyin</option><option value="expert">Ekspert</option></select></div></div>
      <label>Savol matni *</label><textarea name="stem" rows="3" required></textarea>
      <label>Variantlar (har biri yangi qatorda) *</label><textarea name="options" rows="4" placeholder="A variant&#10;B variant&#10;C variant&#10;D variant"></textarea>
      <label>To'g'ri javob(lar) raqami (1 dan; ko'p javobda vergul bilan: 1,3) *</label><input name="answer" required placeholder="1">
      <label>Izoh (explanation)</label><textarea name="explanation" rows="2"></textarea>
      <div class="small" data-err style="color:#b91c1c;margin-top:8px"></div><div class="row" style="margin-top:12px"><button class="btn primary">Draft sifatida saqlash</button><a class="btn" href="#/questions">Bekor qilish</a></div></form>`;
    const f = el.querySelector('[data-qform]');
    f.onsubmit = async e => { e.preventDefault();
      const type = f.type.value; let options = type === 'tf' ? ['To\'g\'ri', 'Noto\'g\'ri'] : f.options.value.split('\n').map(s => s.trim()).filter(Boolean);
      const idx = f.answer.value.split(',').map(s => parseInt(s, 10) - 1).filter(n => !isNaN(n));
      const err = !f.stem.value.trim() ? 'Savol matni kerak' : options.length < 2 ? 'Kamida 2 variant' : !idx.length || idx.some(i => i < 0 || i >= options.length) ? 'To\'g\'ri javob raqami noto\'g\'ri' : type !== 'multiple' && idx.length > 1 ? 'Bitta javobli savolda bitta raqam' : '';
      if (err) { f.querySelector('[data-err]').textContent = err; return; }
      const id = 'Q' + Date.now().toString(36).toUpperCase();
      try {
        await API.insert('questions', { id, org_id: PERMS.state.profile.org_id, course_id: f.course_id.value, type, topic: f.topic.value.trim() || null, difficulty: f.difficulty.value,
          stem: f.stem.value.trim(), options, answer: type === 'multiple' ? idx : idx[0], explanation: f.explanation.value.trim() || null, status: 'draft', workflow_status: 'draft' });
        toast('Savol Draft sifatida saqlandi'); ADMIN.go('#/questions/' + encodeURIComponent(id));
      } catch (e2) { f.querySelector('[data-err]').textContent = API.friendly(e2).message; }
    };
  });

  // ---------- Savol kartasi ----------
  const TABS = [['question', 'Question'], ['options', 'Options'], ['answer', 'Correct Answer'], ['explanation', 'Explanation'], ['evidence', 'Evidence'], ['review', 'Review'], ['versions', 'Version History']];
  const canSeeAnswer = () => PERMS.any('question.edit', 'question.review', 'question.approve', 'question.publish');

  async function gateInfo(q) {
    // Faqat ma'lumot uchun (UI); haqiqiy tekshiruv — server trigger'i (question_workflow) va _q_exam_eligible
    const ev = await API.list('question_evidence', { select: 'evidence_source_id,relationship_type', eq: { question_id: q.id }, all: true, count: false }).catch(() => ({ rows: [] }));
    const srcIds = ev.rows.map(r => r.evidence_source_id);
    const srcs = srcIds.length ? (await API.list('evidence_sources', { select: 'id,status,verification_status', in: { id: srcIds }, all: true, count: false }).catch(() => ({ rows: [] }))).rows : [];
    const primaryVerified = ev.rows.some(r => r.relationship_type === 'primary_support' && srcs.find(s => s.id === r.evidence_source_id && s.verification_status === 'verified' && s.status === 'active'));
    const conflicts = ev.rows.some(r => r.relationship_type === 'conflicting_evidence') || srcs.some(s => ['superseded', 'retracted', 'withdrawn'].includes(s.status));
    // 005e: oxirgi qaror semantikasi (review_seq), faqat joriy versiya, faqat SA/MR medical qarori; klinik emas kurs — medical talab qilinmaydi
    const st = await window.EVIDENCE.reviewStatus(q);
    const medOk = !st.medRequired || (st.latestMedical && st.latestMedical.decision === 'approved');
    return [['Evidence holati = Current', q.evidence_status === 'current' || q.evidence_exempt], ['Tasdiqlangan (verified) asosiy manba', primaryVerified || q.evidence_exempt],
      ['Ziddiyatli / eskirgan manba yo\'q', !conflicts], ['Oxirgi evidence qarori rejected / changes_requested emas', !st.evBlocked],
      [st.medRequired ? 'Joriy versiya uchun oxirgi Medical Review = Approved (klinik savol)' : 'Medical Review talab qilinmaydi (klinik emas kurs)', medOk]];
  }

  ADMIN.route('/questions/:id', 'questions', async (el, ctx) => {
    const id = decodeURIComponent(ctx.params.id); const tab = ctx.query.tab || 'question';
    const q = await API.get('questions', 'id', id, 'id,code,org_id,course_id,module_id,type,topic,subtopic,specialty,difficulty,stem,options,image_url,workflow_status,evidence_status,draft_status,current_version,published_version,review_reason,last_evidence_reviewed_at,evidence_review_due_at,evidence_exempt,evidence_exempt_reason,ai_generated,clinical_setting,target_roles,target_level,learning_objective,guideline_topic,created_at,updated_at');
    if (!ctx.alive()) return;
    if (!q) { el.innerHTML = `<div class="card">${empty('Savol topilmadi yoki ko\'rish uchun ruxsat yo\'q', id)}</div>`; return; }
    ctx.setTitle('Savol ' + (q.code || q.id));
    const acts = [];
    if (PERMS.any('evidence.review', 'question.review', 'medical.review')) acts.push(`<a class="btn primary" href="#/evidence/review/${encodeURIComponent(q.id)}" data-act="open-review">Review ochish</a>`);
    if (PERMS.can('question.edit') && q.workflow_status === 'draft') acts.push(`<button class="btn" data-act="to-evidence-review">Evidence review'ga yuborish</button>`);
    if (PERMS.canPublish() && (q.workflow_status !== 'published' || q.draft_status) && !['deprecated', 'archived'].includes(q.workflow_status)) acts.push(`<button class="btn green" data-act="publish">${q.draft_status ? 'Yangi versiyani nashr qilish' : 'Publish'}</button>`);
    if (PERMS.can('question.deprecate') && !['deprecated', 'archived'].includes(q.workflow_status)) acts.push(`<button class="btn red" data-act="deprecate">Deprecate</button>`);
    el.innerHTML = `<div class="adm-h"><div><div class="sub"><a href="#/questions">← Savollar banki</a></div><h1>${esc(q.code || q.id)}</h1>
      <div class="row" style="margin-top:6px">${badge('workflow', q.workflow_status)} ${badge('evidence', q.evidence_status)} <span class="badge">v${q.current_version}${q.published_version ? ' · nashr v' + q.published_version : ''}</span>${q.ai_generated ? ' <span class="badge b-violet">AI</span>' : ''}${q.review_reason ? ` <span class="small muted">sabab: ${esc(q.review_reason)}</span>` : ''}</div></div>
      <div class="act">${acts.join('')}</div></div>
      <div class="tabs">${TABS.map(([k, l]) => `<a href="#/questions/${encodeURIComponent(q.id)}?tab=${k}" class="${tab === k ? 'on' : ''}" data-tab="${k}">${l}${(k === 'answer' || k === 'explanation') && !canSeeAnswer() ? ' 🔒' : ''}</a>`).join('')}</div><div data-tab-body>${skeleton(3)}</div>`;
    const body = el.querySelector('[data-tab-body]');
    el.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', e => { const a = b.getAttribute('data-act'); if (a === 'open-review') return; e.preventDefault(); doAction(a, q, ctx); }));
    try { await renderTab(tab, q, body, ctx); } catch (e) { if (ctx.alive()) body.innerHTML = errorBox(API.friendly(e)); }
  });

  async function renderTab(tab, q, body, ctx) {
    if (tab === 'question') {
      body.innerHTML = `<div class="grid g2"><div class="card"><h3>Savol</h3><div class="qtext" data-stem>${esc(q.stem)}</div>${q.image_url ? `<div class="small muted">Rasm: ${esc(q.image_url)}</div>` : ''}</div>
        <div class="card"><h3>Metadata</h3><dl class="kv"><dt>Kurs</dt><dd>${esc(q.course_id)}</dd><dt>Modul</dt><dd>${esc(q.module_id || '—')}</dd><dt>Tur</dt><dd>${esc(TYPES[q.type] || q.type)}</dd>
        <dt>Mutaxassislik</dt><dd>${esc(q.specialty || '—')}</dd><dt>Mavzu / submavzu</dt><dd>${esc(q.topic || '—')} / ${esc(q.subtopic || '—')}</dd><dt>Qiyinlik</dt><dd>${esc(q.difficulty)}</dd>
        <dt>Klinik muhit</dt><dd>${esc(q.clinical_setting || '—')}</dd><dt>Target rol / daraja</dt><dd>${esc((q.target_roles || []).join(', ') || '—')} / ${esc(q.target_level || '—')}</dd>
        <dt>Learning objective</dt><dd>${esc(q.learning_objective || '—')}</dd><dt>Guideline mavzusi</dt><dd>${esc(q.guideline_topic || '—')}</dd>
        <dt>Oxirgi evidence review</dt><dd>${fmtDT(q.last_evidence_reviewed_at)}</dd><dt>Keyingi review muddati</dt><dd>${fmtDate(q.evidence_review_due_at)}</dd>
        <dt>Evidence'dan ozod</dt><dd>${q.evidence_exempt ? 'Ha — ' + esc(q.evidence_exempt_reason) : 'Yo\'q'}</dd><dt>Yangilangan</dt><dd>${fmtDT(q.updated_at)}</dd></dl></div></div>
        ${PERMS.any('evidence.review', 'medical.review', 'question.publish') ? `<div style="margin-top:14px" data-status></div>` : ''}
        ${PERMS.canPublish() ? `<div class="card" style="margin-top:14px"><h3>Nashr shartlari (ma'lumot uchun — server baribir tekshiradi)</h3><div data-gates>${skeleton(2)}</div></div>` : ''}`;
      if (PERMS.any('evidence.review', 'medical.review', 'question.publish')) { const st = await window.EVIDENCE.reviewStatus(q); const html = await window.EVIDENCE.statusPanel(q, st); if (ctx.alive()) body.querySelector('[data-status]').innerHTML = html; }
      if (PERMS.canPublish()) { const g = await gateInfo(q); if (ctx.alive()) body.querySelector('[data-gates]').innerHTML = g.map(([l, ok]) => `<div class="row" style="padding:3px 0" data-gate="${ok ? 'ok' : 'no'}">${ok ? '✅' : '⬜'} ${esc(l)}</div>`).join(''); }
    } else if (tab === 'options') {
      const opts = Array.isArray(q.options) ? q.options : [];
      body.innerHTML = `<div class="card"><h3>Variantlar</h3>${opts.length ? opts.map((o, i) => `<div class="opt">${String.fromCharCode(65 + i)}. ${esc(Array.isArray(o) ? o.join(' ↔ ') : (typeof o === 'object' ? JSON.stringify(o) : o))}</div>`).join('') : empty('Variantlar yo\'q (qisqa javob turi)')}
        <div class="tiny">To'g'ri javob bu yerda belgilanmaydi — "Correct Answer" tabida (faqat ruxsatli rollar).</div></div>`;
    } else if (tab === 'answer' || tab === 'explanation') {
      if (!canSeeAnswer()) { body.innerHTML = UI.denied('To\'g\'ri javob / izoh'); return; }
      const a = await API.get('questions', 'id', q.id, 'answer,explanation,evidence,reading');
      if (!ctx.alive()) return;
      if (!a) { body.innerHTML = UI.denied('To\'g\'ri javob'); return; }
      const opts = Array.isArray(q.options) ? q.options : [];
      if (tab === 'answer') {
        const ans = a.answer; const idx = Array.isArray(ans) && q.type !== 'match' && q.type !== 'short' ? ans : typeof ans === 'number' ? [ans] : null;
        body.innerHTML = `<div class="card" data-answer><h3>To'g'ri javob</h3>${idx ? opts.map((o, i) => `<div class="opt ${idx.includes(i) ? 'ok' : ''}">${idx.includes(i) ? '✔ ' : ''}${String.fromCharCode(65 + i)}. ${esc(Array.isArray(o) ? o.join(' ↔ ') : o)}</div>`).join('')
          : `<pre class="mono">${esc(JSON.stringify(ans, null, 1))}</pre>`}<div class="tiny">Bu ma'lumot faqat ruxsatli admin/reviewer'ga serverdan yuklandi; xodim ilovasiga hech qachon yuborilmaydi.</div></div>`;
      } else body.innerHTML = `<div class="card"><h3>Izoh (explanation)</h3><div class="qtext">${esc(a.explanation || '—')}</div>${a.reading ? `<h3 style="margin-top:12px">O'qish uchun</h3><div class="qtext">${esc(a.reading)}</div>` : ''}${a.evidence ? `<h3 style="margin-top:12px">Eski matnli dalil (legacy)</h3><div class="qtext small">${esc(a.evidence)}</div><div class="tiny">Legacy matn — tasdiqlangan manba hisoblanmaydi.</div>` : ''}</div>`;
    } else if (tab === 'evidence') {
      await window.EVIDENCE.renderQuestionEvidence(q, body, ctx, false);
    } else if (tab === 'review') {
      const [rv, as] = await Promise.all([API.list('question_reviews', { select: 'id,version_no,review_type,reviewer_id,reviewer_role_at_creation,review_seq,decision,internal_notes,created_at', eq: { question_id: q.id }, order: ['review_seq', false], all: true, count: false }),
        API.list('question_review_assignments', { select: 'id,reviewer_id,review_type,status,due_at,created_at', eq: { question_id: q.id }, order: ['created_at', false], all: true, count: false }).catch(() => ({ rows: [] }))]);
      const ids = [...new Set([...rv.rows.map(r => r.reviewer_id), ...as.rows.map(r => r.reviewer_id)])];
      const ppl = ids.length ? Object.fromEntries((await API.list('profiles', { select: 'id,full_name,email,role', in: { id: ids }, all: true, count: false }).catch(() => ({ rows: [] }))).rows.map(p => [p.id, p])) : {};
      const who = id => ppl[id] ? esc(ppl[id].full_name || ppl[id].email) + `<div class="sub">${esc(PERMS.ROLE_LABEL[ppl[id].role] || '')}</div>` : `<span class="mono">${esc((id || '').slice(0, 8))}</span>`;
      body.innerHTML = `<div class="card"><h3>Review tarixi (o'zgarmas)</h3>${table(rv.rows, [{ h: 'Vaqt', r: x => fmtDT(x.created_at) }, { h: 'Tur', r: x => esc(x.review_type) }, { h: 'Versiya', r: x => 'v' + x.version_no },
        { h: 'Reviewer', r: x => who(x.reviewer_id) }, { h: 'Rol (yozilgan paytda)', r: x => esc(PERMS.ROLE_LABEL[x.reviewer_role_at_creation] || x.reviewer_role_at_creation || '—') }, { h: 'Qaror', r: x => badge('decision', x.decision) }, { h: 'Ichki izoh', r: x => esc(x.internal_notes || '') }], { empty: 'Hali review qilinmagan', id: 'reviews' })}</div>
        <div class="card" style="margin-top:14px"><h3>Review tayinlovlari</h3>${table(as.rows, [{ h: 'Tur', r: x => esc(x.review_type) }, { h: 'Reviewer', r: x => who(x.reviewer_id) }, { h: 'Holat', r: x => badge('generic', x.status) }, { h: 'Muddat', r: x => fmtDate(x.due_at) }], { empty: 'Tayinlov yo\'q' })}</div>`;
    } else if (tab === 'versions') {
      const [v, p] = await Promise.all([API.list('question_versions', { select: 'id,version_no,change_reason,created_at,created_by', eq: { question_id: q.id }, order: ['version_no', false], all: true, count: false }),
        API.list('question_publications', { select: 'version_no,evidence_status,published_at', eq: { question_id: q.id }, order: ['published_at', true], all: true, count: false }).catch(() => ({ rows: [] }))]);
      const pubs = p.rows; const pubOf = n => pubs.find(x => x.version_no === n);
      const supersededAt = n => { const i = pubs.findIndex(x => x.version_no === n); return i >= 0 && pubs[i + 1] ? pubs[i + 1].published_at : null; };
      body.innerHTML = `<div class="card"><h3>Versiyalar (o'zgarmas snapshot'lar)</h3><div class="note" style="margin-bottom:10px">Tarixiy urinishlar o'zlari topshirilgan versiyani ko'rsatadi. Joriy versiya: v${q.current_version}; imtihonda xizmat qilayotgan: ${q.published_version ? 'v' + q.published_version : 'yo\'q'}.</div>
        ${table(v.rows, [{ h: 'Versiya', r: x => `<b>v${x.version_no}</b>${x.version_no === q.published_version ? ' ' + badge('workflow', 'published') : ''}${x.version_no === q.current_version && x.version_no !== q.published_version ? ' <span class="badge">ishchi</span>' : ''}` },
          { h: 'Yaratilgan', r: x => fmtDT(x.created_at) }, { h: 'Nashr qilingan', r: x => pubOf(x.version_no) ? fmtDT(pubOf(x.version_no).published_at) : '—' },
          { h: 'Nashrdagi evidence', r: x => pubOf(x.version_no) ? badge('evidence', pubOf(x.version_no).evidence_status) : '—' }, { h: 'Almashtirilgan', r: x => fmtDT(supersededAt(x.version_no)) }, { h: 'Sabab', r: x => esc(x.change_reason || '') }], { empty: 'Versiya yo\'q', id: 'versions' })}</div>`;
    }
  }

  async function doAction(a, q, ctx) {
    try {
      if (a === 'to-evidence-review') {
        if (!await dialog({ title: 'Evidence review\'ga yuborish', body: 'Savol "Evidence Review" bosqichiga o\'tadi. Imtihon yaroqliligi o\'zgarmaydi.', okText: 'Yuborish' })) return;
        await API.update('questions', 'id', q.id, { workflow_status: 'evidence_review' }); toast('Evidence review\'ga yuborildi');
      } else if (a === 'publish') {
        const r = await dialog({ title: 'Nashr qilish', body: 'Server nashr shartlarini tekshiradi: evidence current, tasdiqlangan asosiy manba, klinik savol uchun medical review. Shart bajarilmasa nashr rad etiladi.', fields: [{ name: 'ok', type: 'check', label: 'Savol mazmuni va manbalarini tekshirdim', required: true }], okText: 'Publish' });
        if (!r) return;
        await API.update('questions', 'id', q.id, q.published_version && q.draft_status ? { draft_status: 'publish' } : { workflow_status: 'published' }); toast('Nashr qilindi');
      } else if (a === 'deprecate') {
        const r = await dialog({ title: 'Deprecate', body: 'Savol yangi imtihonlardan chiqariladi. Tarixiy urinishlar va versiyalar o\'zgarmaydi.', danger: true, okText: 'Deprecate', fields: [{ name: 'ok', type: 'check', label: 'Tushunaman: bu savol yangi imtihonlarda ishlatilmaydi', required: true }] });
        if (!r) return;
        await API.update('questions', 'id', q.id, { workflow_status: 'deprecated' }); toast('Deprecated');
      }
      ADMIN.render();
    } catch (e) { toast(API.friendly(e).message, true); }
  }
  window.QBANK = { TYPES, trunc };
})();

</script>
<script>/* js/admin/pages_evidence.js */
/* Evidence: Review Queue, Review workspace (Question → Evidence → Claim → Review → Decision), Evidence Library, manba kartasi.
   Soxta ma'lumot yo'q: yangi manba har doim "Unverified"; "Verified" faqat evidence.verify ruxsati bilan, inson tasdig'i orqali. */
(function () {
  const { esc, badge, table, empty, errorBox, skeleton, fmtDT, fmtDate, toast, dialog } = UI;
  const { listPage, lookup } = ADMINLIB;
  const SRC_TYPES = ['guideline', 'systematic_review', 'meta_analysis', 'randomized_controlled_trial', 'cohort_study', 'case_control_study', 'observational_study', 'narrative_review',
    'textbook', 'hospital_sop', 'local_protocol', 'institutional_policy', 'professional_standard', 'expert_consensus', 'other'];
  const REL = [['primary_support', 'Asosiy dalil (primary support)'], ['additional_support', 'Qo\'shimcha dalil'], ['background', 'Fon ma\'lumot'], ['conflicting_evidence', 'Ziddiyatli dalil']];
  const QUEUE = [['unknown', 'Unknown'], ['review_required', 'Review Required'], ['current', 'Current'], ['review_due', 'Review Due'], ['outdated', 'Outdated'],
    ['superseded', 'Superseded'], ['conflicting', 'Conflicting'], ['retracted', 'Retracted'], ['unverified', 'Unverified']];

  // Navbat filtri → savollar so'rovi (retracted/unverified — bog'langan manba holati bo'yicha)
  async function queueFilter(f) {
    if (!f || f === 'unknown') return { eq: { evidence_status: 'unknown' } };
    if (f === 'review_required') return { eq: { workflow_status: 'review_required' } };
    if (['current', 'review_due', 'outdated', 'superseded', 'conflicting'].includes(f)) return { eq: { evidence_status: f } };
    const src = await API.list('evidence_sources', { select: 'id', ...(f === 'retracted' ? { in: { status: ['retracted', 'withdrawn'] } } : { eq: { verification_status: 'unverified' } }), all: true, count: false });
    if (!src.rows.length) return { in: { id: [] } };
    const qe = await API.list('question_evidence', { select: 'question_id', in: { evidence_source_id: src.rows.map(s => s.id) }, all: true, count: false });
    return { in: { id: [...new Set(qe.rows.map(r => r.question_id))] } };
  }

  ADMIN.route('/evidence/queue', 'evidence_queue', async (el, ctx) => {
    const courses = await lookup('courses', 'title');
    const kpi = async () => { const out = {}; await Promise.all(QUEUE.map(async ([v]) => { out[v] = await API.count('questions', await queueFilter(v)).catch(() => '—'); })); return out; };
    const counts = await kpi(); if (!ctx.alive()) return;
    const top = `<div class="kpis">${[['unknown', 'Unknown evidence', 'warn'], ['review_required', 'Review Required', 'bad'], ['review_due', 'Review Due', 'warn'], ['current', 'Current', 'ok'], ['conflicting', 'Conflicting', 'bad'], ['unverified', 'Unverified manbali', 'warn']]
      .map(([k, l, c]) => `<div class="kpi ${c}" data-kpi="${k}"><div class="v">${counts[k]}</div><div class="l">${esc(l)}</div></div>`).join('')}</div>`;
    if (!ctx.query.f) ctx.query.f = 'unknown';
    await listPage(el, ctx, {
      title: 'Evidence Review Queue', id: 'queue', top,
      sub: 'Oddiy oqim: <b>Question → Evidence → Claim → Review → Decision</b>. Qatorni oching.',
      chips: { key: 'f', items: QUEUE, counts: async () => counts },
      filters: [{ key: 's', type: 'search', label: 'Savol matni yoki kodi' }, { key: 'course', type: 'select', label: 'Kurs', options: Object.entries(courses) },
        { key: 'sort', type: 'select', label: 'Tartib', options: [['due', 'Review muddati (yaqini oldin)'], ['updated', 'Oxirgi o\'zgarish'], ['reviewed', 'Oxirgi review (eskisi oldin)']] }],
      load: async q => { const o = await queueFilter(q.f); o.eq = { ...(o.eq || {}), course_id: q.course }; o.search = { cols: ['stem', 'code', 'id'], q: q.s };
        const order = q.sort === 'updated' ? ['updated_at', false] : q.sort === 'reviewed' ? ['last_evidence_reviewed_at', true] : ['evidence_review_due_at', true];
        return API.list('questions', { select: 'id,code,course_id,topic,stem,workflow_status,evidence_status,last_evidence_reviewed_at,evidence_review_due_at,review_reason,updated_at', ...o, order, page: q.page, size: q.size }); },
      href: x => '#/evidence/review/' + encodeURIComponent(x.id),
      columns: [{ h: 'Savol', r: x => `${esc(QBANK.trunc(x.stem, 90))}<div class="sub mono">${esc(x.code || x.id)}</div>` }, { h: 'Kurs', r: x => esc(courses[x.course_id] || x.course_id) },
        { h: 'Evidence', r: x => badge('evidence', x.evidence_status) + (x.review_reason ? `<div class="sub">${esc(x.review_reason)}</div>` : '') }, { h: 'Workflow', r: x => badge('workflow', x.workflow_status) },
        { h: 'Oxirgi review', r: x => fmtDate(x.last_evidence_reviewed_at) }, { h: 'Muddat', r: x => fmtDate(x.evidence_review_due_at) },
        { h: '', r: x => `<a class="btn sm" href="#/evidence/review/${encodeURIComponent(x.id)}" data-act="open">Ochish</a>` }],
      empty: 'Bu navbatda savol yo\'q',
    });
  });

  // ---------- Savolga bog'langan dalillar (savol kartasi va review workspace) ----------
  async function renderQuestionEvidence(q, box, ctx, editable) {
    const ev = await API.list('question_evidence', { select: 'id,evidence_source_id,relationship_type,citation_text,supporting_claim,section_reference,recommendation_class,level_of_evidence,created_at', eq: { question_id: q.id }, all: true, count: false });
    const ids = ev.rows.map(r => r.evidence_source_id);
    const src = ids.length ? Object.fromEntries((await API.list('evidence_sources', { select: 'id,title,source_type,organization,guideline_name,guideline_version,publication_year,publication_date,doi,pmid,url,status,verification_status,evidence_level,scope_type', in: { id: ids }, all: true, count: false })).rows.map(s => [s.id, s])) : {};
    if (!ctx.alive()) return;
    const canDetach = editable && PERMS.can('evidence.review');
    box.innerHTML = `<div class="card" data-evidence-list><h3>Bog'langan dalillar</h3>${ev.rows.length ? ev.rows.map(r => { const s = src[r.evidence_source_id] || {};
      return `<div class="opt" data-ev-row="${esc(r.id)}"><div class="row between"><b>${esc(s.title || 'Manba (ko\'rish uchun ruxsat yo\'q)')}</b><span>${badge('verification', s.verification_status)} ${badge('source', s.status)}</span></div>
        <div class="small muted">${esc(REL.find(x => x[0] === r.relationship_type)?.[1] || r.relationship_type)} · ${esc(s.source_type || '')}${s.organization ? ' · ' + esc(s.organization) : ''}${s.guideline_version ? ' · versiya ' + esc(s.guideline_version) : ''}${s.publication_year ? ' · ' + s.publication_year : ''}</div>
        <div class="small">${s.doi ? 'DOI: <span class="mono">' + esc(s.doi) + '</span> ' : ''}${s.pmid ? 'PMID: <span class="mono">' + esc(s.pmid) + '</span> ' : ''}${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">havola</a>` : ''}${!s.doi && !s.pmid && !s.url ? '<span class="tiny">Identifikator yo\'q</span>' : ''}</div>
        ${r.supporting_claim ? `<div style="margin-top:6px"><span class="tiny">Da'vo (claim):</span> ${esc(r.supporting_claim)}</div>` : ''}${r.citation_text ? `<div class="small muted">Iqtibos: ${esc(r.citation_text)}</div>` : ''}
        ${canDetach ? `<button class="btn sm" data-detach="${esc(r.id)}" style="margin-top:6px">Uzish</button>` : ''}</div>`; }).join('') : empty('Dalil bog\'lanmagan', 'Klinik savol uchun kamida bitta tasdiqlangan asosiy manba kerak.')}</div>`;
    box.querySelectorAll('[data-detach]').forEach(b => b.onclick = async () => {
      if (!await dialog({ title: 'Dalilni uzish', body: 'Bog\'lanish o\'chiriladi (manbaning o\'zi kutubxonada qoladi). Savol evidence holati server tomonidan qayta hisoblanadi.', danger: true, okText: 'Uzish' })) return;
      try { await API.remove('question_evidence', 'id', b.getAttribute('data-detach')); toast('Uzildi'); ADMIN.render(); } catch (e) { toast(API.friendly(e).message, true); }
    });
  }

  // ---------- 005e: savol holati (oxirgi qaror semantikasi; yaroqlilik — server javobi) ----------
  const DEFAULT_CLINICAL = ['medical', 'public_health', 'safety'];
  const MED_ROLES = ['medical_reviewer', 'super_admin'];
  async function reviewStatus(q) {
    const [course, pol, rv, elig] = await Promise.all([
      API.get('courses', 'id', q.course_id, 'id,domain').catch(() => null),
      API.list('content_policies', { select: 'clinical_domains,clinical_requires_medical_review', size: 1, count: false }).catch(() => ({ rows: [] })),
      API.list('question_reviews', { select: 'id,review_type,version_no,decision,reviewer_id,reviewer_role_at_creation,review_seq,created_at,internal_notes', eq: { question_id: q.id }, order: ['review_seq', false], all: true, count: false }).catch(() => ({ rows: [] })),
      // 006a: bitta savol uchun server RPC (question_eligibility); mavjud bo'lmasa (006a'gacha) — question_meta
      API.rpc('question_eligibility', { p_question: q.id }).catch(() => null)]);
    const meta = elig ? null : await API.rpc('question_meta').catch(() => null);
    const p = pol.rows[0] || {};
    const domains = Array.isArray(p.clinical_domains) && p.clinical_domains.length ? p.clinical_domains : DEFAULT_CLINICAL;
    const clinical = !!(course && domains.includes(course.domain));
    const medRequired = elig ? !!elig.medical_review_required : clinical && p.clinical_requires_medical_review !== false;
    const rows = rv.rows;   // review_seq bo'yicha kamayish tartibida (oxirgisi birinchi)
    const latestEvidence = rows.find(r => r.review_type === 'evidence') || null;
    const validMed = v => rows.find(r => r.review_type === 'medical' && r.version_no === v && MED_ROLES.includes(r.reviewer_role_at_creation)) || null;
    const latestMedical = validMed(q.current_version);
    const latestMedicalPublished = q.published_version ? validMed(q.published_version) : null;
    const eligible = elig ? !!elig.eligible : Array.isArray(meta) ? meta.some(m => m.id === q.id) : null;   // serverning _q_exam_eligible natijasi
    const evBlocked = latestEvidence && ['rejected', 'changes_requested'].includes(latestEvidence.decision);
    let reason = q.review_reason || null;
    if (!reason && evBlocked) reason = 'evidence_' + latestEvidence.decision;
    if (!reason && medRequired && latestMedical && latestMedical.decision !== 'approved') reason = 'medical_' + latestMedical.decision;
    return { course, clinical: elig ? !!elig.clinical : clinical, medRequired, source: elig ? 'question_eligibility' : 'question_meta', rows, latestEvidence, latestMedical, latestMedicalPublished, eligible, evBlocked, reason };
  }
  const decisionBadge = r => r ? badge('decision', r.decision) : '<span class="badge">—</span>';
  async function statusPanel(q, st) {
    const last = st.rows[0] || null;
    const ppl = last ? await API.list('profiles', { select: 'id,full_name,email', in: { id: [last.reviewer_id] }, all: true, count: false }).catch(() => ({ rows: [] })) : { rows: [] };
    const who = last ? (ppl.rows[0] ? esc(ppl.rows[0].full_name || ppl.rows[0].email) : `<span class="mono">${esc((last.reviewer_id || '').slice(0, 8))}</span>`) : '—';
    const medCell = !st.medRequired ? `<span class="badge" data-med="not_required">Not required</span> <span class="small muted">klinik emas kurs${st.course ? ' (' + esc(st.course.domain) + ')' : ''}</span>`
      : st.latestMedical ? decisionBadge(st.latestMedical) + ` <span class="small muted">v${st.latestMedical.version_no}</span>` : '<span class="badge b-amber" data-med="pending">Kutilmoqda</span>';
    const elig = st.eligible === null ? '<span class="badge">Noma\'lum</span>' : st.eligible ? '<span class="badge b-green" data-eligible="true">✓ ELIGIBLE</span>' : '<span class="badge b-red" data-eligible="false">✕ INELIGIBLE</span>';
    return `<div class="card" data-status-panel><h3>Question status</h3><dl class="kv">
      <dt>Evidence</dt><dd>${badge('evidence', q.evidence_status)} ${st.latestEvidence ? '· oxirgi qaror: ' + decisionBadge(st.latestEvidence) : ''}</dd>
      <dt>Medical Review</dt><dd data-med-cell>${medCell}</dd>
      <dt>Exam eligibility (yangi imtihonlar)</dt><dd>${elig} <span class="tiny" data-elig-src="${esc(st.source)}">server: ${esc(st.source)}</span></dd>
      <dt>Sabab</dt><dd>${st.reason ? badge('reason', st.reason) : '—'}</dd>
      <dt>Oxirgi qaror</dt><dd>${last ? esc(last.review_type) + ' · ' + decisionBadge(last) + ' · v' + last.version_no : '—'}</dd>
      <dt>Reviewer</dt><dd>${who}</dd>
      <dt>Reviewer roli (yozilgan paytda)</dt><dd>${last ? esc(PERMS.ROLE_LABEL[last.reviewer_role_at_creation] || last.reviewer_role_at_creation || 'qayd etilmagan (005e oldi)') : '—'}</dd>
