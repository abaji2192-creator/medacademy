      <dt>Oxirgi o'zgarish</dt><dd>${last ? fmtDT(last.created_at) : '—'}</dd></dl>
      <div class="tiny">Faqat joriy versiya (v${q.current_version}) uchun oxirgi qaror hisobga olinadi; eski versiya tasdig'i yangi versiyaga o'tmaydi. Server baribir qayta tekshiradi.</div></div>`;
  }

  // ---------- Review workspace ----------
  ADMIN.route('/evidence/review/:id', 'evidence_queue', async (el, ctx) => {
    const id = decodeURIComponent(ctx.params.id);
    const q = await API.get('questions', 'id', id, 'id,code,course_id,type,topic,stem,options,workflow_status,evidence_status,current_version,published_version,draft_status,evidence_review_due_at,last_evidence_reviewed_at,review_reason');
    if (!ctx.alive()) return;
    if (!q) { el.innerHTML = `<div class="card">${empty('Savol topilmadi yoki ruxsat yo\'q', id)}</div>`; return; }
    ctx.setTitle('Review: ' + (q.code || q.id));
    const stage = q.workflow_status === 'published' && !q.draft_status ? 4 : q.evidence_status === 'current' ? 3 : 1;
    const st = await reviewStatus(q); if (!ctx.alive()) return;
    const canEv = PERMS.can('evidence.review'), canMed = PERMS.canMedicalReview() && st.medRequired;
    el.innerHTML = `<div class="adm-h"><div><div class="sub"><a href="#/evidence/queue">← Review Queue</a> · <a href="#/questions/${encodeURIComponent(q.id)}">Savol kartasi</a></div><h1>Review: ${esc(q.code || q.id)}</h1>
      <div class="steps">${['1. Question', '2. Evidence', '3. Claim', '4. Review', '5. Decision'].map((s, i) => `<span class="${i < stage ? 'done' : i === stage ? 'cur' : ''}">${s}</span>`).join('')}</div>
      <div class="row">${badge('workflow', q.workflow_status)} ${badge('evidence', q.evidence_status)} <span class="badge">v${q.current_version}</span></div></div></div>
      <div class="grid g2"><div><div class="card"><h3>1. Savol</h3><div class="qtext">${esc(q.stem)}</div>${(Array.isArray(q.options) ? q.options : []).map((o, i) => `<div class="opt">${String.fromCharCode(65 + i)}. ${esc(Array.isArray(o) ? o.join(' ↔ ') : o)}</div>`).join('')}
        <div class="small"><a href="#/questions/${encodeURIComponent(q.id)}?tab=answer">To'g'ri javobni ko'rish →</a></div></div>
        <div style="margin-top:14px" data-ev></div>
        ${PERMS.can('evidence.manage') ? `<div class="card" style="margin-top:14px"><h3>2–3. Dalil va da'vo (claim) bog'lash</h3>
          <form data-attach><label>Manba (Evidence Library'dan qidirish)</label><input type="search" data-src-q placeholder="Sarlavha, tashkilot, DOI…"><select name="source" required data-src-sel><option value="">— manba tanlang —</option></select>
          <div class="tiny">Kerakli manba yo'qmi? <a href="#/evidence/library/new">Kutubxonaga qo'shing</a> (Unverified holatda yaratiladi).</div>
          <label>Bog'lanish turi</label><select name="rel">${REL.map(r => `<option value="${r[0]}">${esc(r[1])}</option>`).join('')}</select>
          <label>Qo'llab-quvvatlanadigan da'vo (supporting claim) *</label><textarea name="claim" rows="2" required placeholder="Manbada aynan nima deyilgani (o'z so'zlaringiz bilan)"></textarea>
          <label>Bo'lim / sahifa (section reference)</label><input name="section"><div class="small" data-err style="color:#b91c1c"></div>
          <button class="btn primary" style="margin-top:10px">Bog'lash</button></form></div>` : ''}</div>
      <div><div data-status>${await statusPanel(q, st)}</div>
        <div class="card" style="margin-top:14px"><h3>4–5. Review va qaror</h3>${!st.medRequired ? `<div class="note" data-med-not-required>Medical Review talab qilinmaydi (klinik emas kurs).</div>` : ''}${canEv || canMed ? `<form data-review>
          <label>Review turi</label><select name="type">${canEv ? '<option value="evidence">Evidence review</option>' : ''}${canMed ? '<option value="medical">Medical review (klinik tasdiq)</option>' : ''}</select>
          <label>Qaror</label><select name="decision"></select>
          <label class="check"><input type="checkbox" name="c1"> <span>Manba(lar)ni asl nusxada tekshirdim (DOI/PMID/guideline versiyasi)</span></label>
          <label class="check"><input type="checkbox" name="c2"> <span>Savol va to'g'ri javob manbadagi tavsiyaga mos</span></label>
          <label class="check"><input type="checkbox" name="c3"> <span>Manba joriy (superseded / retracted emas)</span></label>
          <label data-notes-label>Ichki izoh (faqat reviewer'lar ko'radi)</label><textarea name="notes" rows="3"></textarea>
          <div class="small" data-err style="color:#b91c1c"></div><button class="btn primary" style="margin-top:10px">Qarorni yuborish</button>
          <div class="tiny" style="margin-top:6px">Evidence holati faqat server tomonidan review natijasiga qarab o'zgaradi (to'g'ridan-to'g'ri o'zgartirib bo'lmaydi).</div></form>`
        : `<div class="note">Sizda review qilish ruxsati yo'q.</div>`}</div>
        ${PERMS.canAssignReview() && st.medRequired ? `<div class="card" style="margin-top:14px"><h3>Medical review'ga yuborish</h3><form data-assign><label>Medical reviewer</label><select name="rev" data-rev-sel><option value="">yuklanmoqda…</option></select>
          <label>Muddat</label><input type="date" name="due"><button class="btn" style="margin-top:10px">Tayinlash</button></form></div>` : ''}
        <div class="card" style="margin-top:14px"><h3>Review tarixi</h3><div data-hist>${skeleton(2)}</div></div></div></div>`;
    await renderQuestionEvidence(q, el.querySelector('[data-ev]'), ctx, true);
    // review tarixi
    el.querySelector('[data-hist]').innerHTML = st.rows.length ? st.rows.map(x => `<div class="row between small" style="padding:4px 0" data-hist-row><span>${esc(x.review_type)} · v${x.version_no} · ${fmtDT(x.created_at)} · <span class="muted">${esc(PERMS.ROLE_LABEL[x.reviewer_role_at_creation] || x.reviewer_role_at_creation || '—')}</span></span>${badge('decision', x.decision)}</div>`).join('') : empty('Hali review yo\'q');
    // manba qidiruvi
    const af = el.querySelector('[data-attach]');
    if (af) {
      const sel = af.querySelector('[data-src-sel]');
      const search = UI.debounce(async s => { try { const r = await API.list('evidence_sources', { select: 'id,title,organization,guideline_version,verification_status,status', search: { cols: ['title', 'organization', 'doi', 'guideline_name'], q: s }, in: { status: ['active', 'draft'] }, order: ['title', true], size: 30, count: false });
        sel.innerHTML = '<option value="">— manba tanlang —</option>' + r.rows.map(x => `<option value="${esc(x.id)}">${esc(x.title)}${x.guideline_version ? ' (' + esc(x.guideline_version) + ')' : ''} — ${esc(UI.LABELS.verification[x.verification_status]?.[0] || x.verification_status)}</option>`).join('');
        if (!r.rows.length) sel.innerHTML = '<option value="">Manba topilmadi — kutubxonaga qo\'shing</option>'; } catch (e) { sel.innerHTML = '<option value="">' + esc(API.friendly(e).message) + '</option>'; } }, 300);
      af.querySelector('[data-src-q]').addEventListener('input', e => search(e.target.value)); search('');
      af.onsubmit = async e => { e.preventDefault(); const err = af.querySelector('[data-err]'); err.textContent = '';
        if (!af.source.value) { err.textContent = 'Manba tanlang'; return; } if (!af.claim.value.trim()) { err.textContent = 'Da\'vo (claim) majburiy'; return; }
        try { await API.insert('question_evidence', { org_id: PERMS.state.profile.org_id, question_id: q.id, evidence_source_id: af.source.value, relationship_type: af.rel.value,
          supporting_claim: af.claim.value.trim(), section_reference: af.section.value.trim() || null }); toast('Dalil bog\'landi'); ADMIN.render(); } catch (e2) { err.textContent = API.friendly(e2).message; } };
    }
    const rf = el.querySelector('[data-review]');
    // 005e: qaror turlari review turiga bog'liq (mark_* faqat evidence; medical — approved / rejected / changes_requested)
    const DEC = { evidence: ['approved', 'changes_requested', 'rejected', 'mark_outdated', 'mark_conflicting'], medical: ['approved', 'rejected', 'changes_requested'] };
    const DEC_LABEL = { approved: 'Approve', changes_requested: 'Request changes', rejected: 'Reject', mark_outdated: 'Mark outdated (manba eskirgan)', mark_conflicting: 'Mark conflicting (ziddiyatli dalil)' };
    const syncDec = () => { const t = rf.type.value; rf.decision.innerHTML = (DEC[t] || []).map(d => `<option value="${d}">${esc(DEC_LABEL[d])}</option>`).join('');
      rf.querySelector('[data-notes-label]').textContent = t === 'medical' ? 'Sabab (majburiy)' : 'Ichki izoh (faqat reviewer\'lar ko\'radi)'; };
    if (rf) { syncDec(); rf.type.addEventListener('change', syncDec); }
    if (rf) rf.onsubmit = async e => { e.preventDefault(); const err = rf.querySelector('[data-err]'); err.textContent = '';
      const dec = rf.decision.value, type = rf.type.value;
      if (!(DEC[type] || []).includes(dec)) { err.textContent = 'Bu review turi uchun qaror mavjud emas'; return; }
      if (dec === 'approved' && !(rf.c1.checked && rf.c2.checked && rf.c3.checked)) { err.textContent = 'Approve uchun uchala tekshiruv belgilanishi shart'; return; }
      if ((type === 'medical' || dec !== 'approved') && !rf.notes.value.trim()) { err.textContent = type === 'medical' ? 'Medical review uchun sabab majburiy' : 'Bu qaror uchun ichki izoh (sabab) majburiy'; return; }
      const medNote = type === 'medical' ? '<div class="note warn" style="margin-top:8px">Bu medical review qarori klinik savolning <b>yangi imtihonlarga</b> yaroqliligiga ta\'sir qiladi (This medical review decision affects eligibility for future clinical exams).</div>' : '';
      if (!await dialog({ title: 'Qarorni tasdiqlash', body: `${esc(type === 'medical' ? 'Medical' : 'Evidence')} review: <b>${esc(UI.LABELS.decision[dec][0])}</b> (v${q.current_version}). Review yozuvlari o'zgarmas.${medNote}`, okText: 'Yuborish', danger: dec !== 'approved' })) return;
      try { await API.insert('question_reviews', { org_id: PERMS.state.profile.org_id, question_id: q.id, version_no: q.current_version, review_type: type, reviewer_id: PERMS.state.profile.id, decision: dec,
        internal_notes: rf.notes.value.trim() || null, checklist: { source_checked: rf.c1.checked, answer_matches: rf.c2.checked, source_current: rf.c3.checked } });
        toast('Review saqlandi'); ADMIN.render(); } catch (e2) { err.textContent = API.friendly(e2).message; } };
    const asf = el.querySelector('[data-assign]');
    if (asf) {
      API.list('profiles', { select: 'id,full_name,email', eq: { role: 'medical_reviewer', status: 'active' }, all: true, count: false })
        .then(r => { asf.querySelector('[data-rev-sel]').innerHTML = r.rows.length ? r.rows.map(p => `<option value="${esc(p.id)}">${esc(p.full_name || p.email)}</option>`).join('') : '<option value="">Medical reviewer yo\'q</option>'; })
        .catch(() => { asf.querySelector('[data-rev-sel]').innerHTML = '<option value="">ro\'yxat mavjud emas</option>'; });
      asf.onsubmit = async e => { e.preventDefault(); if (!asf.rev.value) return toast('Reviewer tanlang', true);
        try { await API.insert('question_review_assignments', { org_id: PERMS.state.profile.org_id, question_id: q.id, reviewer_id: asf.rev.value, review_type: 'medical', due_at: asf.due.value || null });
          toast('Medical review tayinlandi'); ADMIN.render(); } catch (e2) { toast(API.friendly(e2).message, true); } };
    }
  });

  // ---------- Evidence Library ----------
  const SRC_COLS = 'id,title,source_type,organization,authors,publication_year,journal,doi,pmid,url,guideline_name,guideline_version,publication_date,evidence_level,status,verification_status,scope_type,origin';
  ADMIN.route('/evidence/library', 'evidence_library', (el, ctx) => listPage(el, ctx, {
    title: 'Evidence Library', id: 'library', sub: 'Global (platforma) va tashkilot manbalari. Tekshirilmagan manba har doim <b>Unverified</b> deb ko\'rsatiladi.',
    actions: PERMS.can('evidence.manage') ? `<a class="btn primary" href="#/evidence/library/new" data-act="new-source">+ Manba qo'shish</a>` : '',
    filters: [{ key: 's', type: 'search', label: 'Sarlavha, tashkilot, jurnal, DOI, PMID' }, { key: 'type', type: 'select', label: 'Turi', options: SRC_TYPES.map(t => [t, t]) },
      { key: 'status', type: 'select', label: 'Holat', options: Object.entries(UI.LABELS.source).map(([k, v]) => [k, v[0]]) },
      { key: 'ver', type: 'select', label: 'Tekshiruv', options: Object.entries(UI.LABELS.verification).map(([k, v]) => [k, v[0]]) },
      { key: 'scope', type: 'select', label: 'Doira', options: [['global', 'Global'], ['organization', 'Tashkilot']] }],
    load: q => API.list('evidence_sources', { select: SRC_COLS, eq: { source_type: q.type, status: q.status, verification_status: q.ver, scope_type: q.scope }, search: { cols: ['title', 'organization', 'journal', 'doi', 'pmid', 'guideline_name'], q: q.s }, order: ['title', true], page: q.page, size: q.size }),
    href: x => '#/evidence/library/' + x.id,
    columns: [{ h: 'Manba', r: x => `<b>${esc(x.title)}</b><div class="sub">${esc(x.organization || (x.authors || []).slice(0, 3).join(', ') || '—')}${x.journal ? ' · ' + esc(x.journal) : ''}</div>` },
      { h: 'Turi', r: x => esc(x.source_type) + `<div class="sub">${esc(x.scope_type === 'global' ? 'Global' : 'Tashkilot')}</div>` },
      { h: 'Yil / versiya', r: x => `${esc(x.publication_year || '—')}${x.guideline_version ? `<div class="sub">v ${esc(x.guideline_version)}</div>` : ''}` },
      { h: 'Identifikator', r: x => `${x.doi ? '<div class="mono">DOI ' + esc(x.doi) + '</div>' : ''}${x.pmid ? '<div class="mono">PMID ' + esc(x.pmid) + '</div>' : ''}${!x.doi && !x.pmid ? (x.url ? 'URL' : '—') : ''}` },
      { h: 'Evidence level', r: x => esc(x.evidence_level || 'Unknown') }, { h: 'Holat', r: x => badge('source', x.status) + ' ' + badge('verification', x.verification_status) }],
    empty: 'Manbalar hali qo\'shilmagan', emptySub: 'Platforma hech qanday manbani o\'ylab topmaydi — manbalarni faqat haqiqiy nashr asosida qo\'shing.',
  }));

  ADMIN.route('/evidence/library/new', 'evidence_library', async (el, ctx) => {
    ctx.setTitle('Yangi manba');
    if (!PERMS.can('evidence.manage')) { el.innerHTML = UI.denied('Manba qo\'shish'); return; }
    el.innerHTML = `<div class="adm-h"><div><div class="sub"><a href="#/evidence/library">← Evidence Library</a></div><h1>Yangi manba</h1><div class="sub">Manba <b>Unverified</b> holatda yaratiladi. Faqat haqiqatda mavjud nashr ma'lumotlarini kiriting — taxminiy DOI/PMID kiritmang.</div></div></div>
      <form class="card" data-sform><div class="grid g2">
      <div><label>Sarlavha *</label><input name="title" required minlength="4"></div><div><label>Turi *</label><select name="source_type">${SRC_TYPES.map(t => `<option value="${t}">${t}</option>`).join('')}</select></div>
      <div><label>Tashkilot (guideline uchun majburiy)</label><input name="organization" placeholder="masalan, guideline chiqargan jamiyat"></div><div><label>Mualliflar (vergul bilan)</label><input name="authors"></div>
      <div><label>Nashr yili</label><input name="publication_year" type="number" min="1800" max="2100"></div><div><label>Jurnal</label><input name="journal"></div>
      <div><label>DOI</label><input name="doi" placeholder="10.xxxx/…" pattern="10\\.[0-9]{4,9}/\\S+"></div><div><label>PMID</label><input name="pmid" pattern="[0-9]{1,9}"></div>
      <div><label>URL</label><input name="url" type="url" placeholder="https://…"></div><div><label>Guideline nomi</label><input name="guideline_name"></div>
      <div><label>Guideline versiyasi (guideline uchun majburiy)</label><input name="guideline_version"></div><div><label>Nashr sanasi</label><input name="publication_date" type="date"></div>
      <div><label>Evidence level (manbada ko'rsatilgan bo'lsa)</label><input name="evidence_level" placeholder="bo'sh qoldirilsa: Unknown"></div>
      <div><label>Yurisdiksiya</label><select name="jurisdiction"><option value="international">Xalqaro</option><option value="regional">Mintaqaviy</option><option value="national">Milliy</option><option value="local">Mahalliy</option><option value="institutional">Muassasa</option></select></div></div>
      <div class="small" data-err style="color:#b91c1c;margin-top:8px"></div><div class="row" style="margin-top:12px"><button class="btn primary">Saqlash (Unverified)</button><a class="btn" href="#/evidence/library">Bekor qilish</a></div></form>`;
    const f = el.querySelector('[data-sform]');
    f.onsubmit = async e => { e.preventDefault(); if (!f.reportValidity()) return;
      const v = n => f[n].value.trim() || null;
      const row = { org_id: PERMS.state.profile.org_id, scope_type: 'organization', title: v('title'), source_type: f.source_type.value, organization: v('organization'),
        authors: (f.authors.value || '').split(',').map(s => s.trim()).filter(Boolean), publication_year: f.publication_year.value ? +f.publication_year.value : null, journal: v('journal'),
        doi: v('doi'), pmid: v('pmid'), url: v('url'), guideline_name: v('guideline_name'), guideline_version: v('guideline_version'), publication_date: v('publication_date'),
        evidence_level: v('evidence_level'), jurisdiction: f.jurisdiction.value, status: 'active', verification_status: 'unverified', origin: 'manual' };
      try { const s = await API.insert('evidence_sources', row); toast('Manba qo\'shildi (Unverified)'); ADMIN.go('#/evidence/library/' + s.id); }
      catch (e2) { f.querySelector('[data-err]').textContent = API.friendly(e2).message; } };
  });

  ADMIN.route('/evidence/library/:id', 'evidence_library', async (el, ctx) => {
    const s = await API.get('evidence_sources', 'id', ctx.params.id, '*');
    if (!ctx.alive()) return;
    if (!s) { el.innerHTML = `<div class="card">${empty('Manba topilmadi yoki ruxsat yo\'q')}</div>`; return; }
    ctx.setTitle(s.title);
    const own = s.scope_type === 'organization';
    const acts = [];
    if (own && PERMS.can('evidence.verify') && s.verification_status !== 'verified') acts.push(`<button class="btn green" data-act="verify">Verify (tekshirildi)</button>`);
    if (own && PERMS.can('evidence.manage') && PERMS.can('evidence.review') && s.status === 'active') acts.push(`<button class="btn" data-act="superseded">Superseded deb belgilash</button><button class="btn red" data-act="retracted">Retracted deb belgilash</button>`);
    const links = await API.list('question_evidence', { select: 'question_id,relationship_type', eq: { evidence_source_id: s.id }, all: true, count: false }).catch(() => ({ rows: [] }));
    if (!ctx.alive()) return;
    el.innerHTML = `<div class="adm-h"><div><div class="sub"><a href="#/evidence/library">← Evidence Library</a></div><h1>${esc(s.title)}</h1><div class="row">${badge('source', s.status)} ${badge('verification', s.verification_status)} <span class="badge">${esc(s.scope_type === 'global' ? 'Global' : 'Tashkilot')}</span></div></div><div class="act">${acts.join('')}</div></div>
      ${!own ? '<div class="note" style="margin-bottom:12px">Global manba — faqat platforma kutubxonasi orqali o\'zgaradi (API orqali yozib bo\'lmaydi).</div>' : ''}
      <div class="grid g2"><div class="card"><h3>Ma'lumotlar</h3><dl class="kv"><dt>Turi</dt><dd>${esc(s.source_type)}</dd><dt>Tashkilot</dt><dd>${esc(s.organization || '—')}</dd><dt>Mualliflar</dt><dd>${esc((s.authors || []).join(', ') || '—')}</dd>
        <dt>Nashr yili / sanasi</dt><dd>${esc(s.publication_year || '—')} / ${fmtDate(s.publication_date)}</dd><dt>Jurnal</dt><dd>${esc(s.journal || '—')}</dd><dt>DOI</dt><dd class="mono">${esc(s.doi || '—')}</dd><dt>PMID</dt><dd class="mono">${esc(s.pmid || '—')}</dd>
        <dt>URL</dt><dd>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a>` : '—'}</dd><dt>Guideline</dt><dd>${esc(s.guideline_name || '—')} ${s.guideline_version ? '(versiya ' + esc(s.guideline_version) + ')' : ''}</dd>
        <dt>Evidence level</dt><dd>${esc(s.evidence_level || 'Unknown')}${s.evidence_level_basis ? ' · ' + esc(s.evidence_level_basis) : ''}</dd><dt>Tier</dt><dd>${esc(s.evidence_tier || '—')}</dd>
        <dt>Kelib chiqishi</dt><dd>${esc(s.origin)}</dd><dt>Tekshiruv</dt><dd>${s.verification_status === 'verified' ? esc(s.verification_source) + ' · ' + fmtDT(s.verified_at) : 'Not verified'}</dd></dl></div>
        <div class="card"><h3>Bog'langan savollar (${links.rows.length})</h3>${links.rows.length ? links.rows.map(r => `<div class="row between small" style="padding:3px 0"><a href="#/questions/${encodeURIComponent(r.question_id)}" class="mono">${esc(r.question_id)}</a><span>${esc(r.relationship_type)}</span></div>`).join('') : empty('Hech qaysi savolga bog\'lanmagan')}</div></div>`;
    el.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => { const a = b.getAttribute('data-act');
      try {
        if (a === 'verify') {
          const r = await dialog({ title: 'Manbani tasdiqlash (Verify)', body: 'Faqat identifikatorni (DOI / PMID / guideline versiyasi / URL) asl manbada shaxsan tekshirgan bo\'lsangiz tasdiqlang. Kim va qachon tasdiqlagani server tomonidan yoziladi.',
            fields: [{ name: 'ok', type: 'check', label: 'Asl manbani ochib, ma\'lumotlar mosligini tekshirdim', required: true }], okText: 'Verify' });
          if (!r) return; await API.update('evidence_sources', 'id', s.id, { verification_status: 'verified', verification_source: 'manual' });
        } else {
          const r = await dialog({ title: a === 'retracted' ? 'Retracted' : 'Superseded', danger: true, body: 'Bu manbaga tayangan savollar avtomatik <b>Review Required</b> holatiga o\'tadi va yangi imtihonlardan chiqadi. Tarixiy urinishlar o\'zgarmaydi.',
            fields: [{ name: 'ok', type: 'check', label: 'Tushunaman', required: true }], okText: 'Belgilash' });
          if (!r) return; await API.update('evidence_sources', 'id', s.id, { status: a });
        }
        toast('Saqlandi'); ADMIN.render();
      } catch (e) { toast(API.friendly(e).message, true); } });
  });

  window.EVIDENCE = { renderQuestionEvidence, reviewStatus, statusPanel };
})();

</script>
<script>/* js/admin/pages_org.js */
/* Tashkilot: Xodimlar (ro'yxat + profil, faqat Deactivate — DELETE yo'q) va Bo'limlar / Lavozimlar / Mutaxassisliklar. */
(function () {
  const { esc, badge, table, empty, errorBox, skeleton, fmtDT, fmtDate, toast, dialog } = UI;
  const { listPage, lookup, clearCache } = ADMINLIB;
  const name = e => [e.first_name, e.last_name].filter(Boolean).join(' ') || e.employee_code;

  ADMIN.route('/employees', 'employees', async (el, ctx) => {
    const [dep, pos, spec] = await Promise.all([lookup('departments'), lookup('positions'), lookup('specialties')]);
    await listPage(el, ctx, {
      title: 'Xodimlar', id: 'employees', sub: PERMS.role() === 'department_head' ? 'Faqat o\'z bo\'limingiz (server RLS).' : 'Xodimlar o\'chirilmaydi — faqat faolsizlantiriladi (tarix saqlanadi).',
      filters: [{ key: 's', type: 'search', label: 'Ism, familiya yoki xodim kodi' }, { key: 'dep', type: 'select', label: 'Bo\'lim', options: Object.entries(dep) },
        { key: 'pos', type: 'select', label: 'Lavozim', options: Object.entries(pos) }, { key: 'spec', type: 'select', label: 'Mutaxassislik', options: Object.entries(spec) },
        { key: 'st', type: 'select', label: 'Holat', options: Object.entries(UI.LABELS.employment).map(([k, v]) => [k, v[0]]) }],
      load: async q => { const r = await API.list('employees', { select: 'id,employee_code,first_name,last_name,department_id,position_id,specialty_id,employment_status,profile_id,hire_date',
          eq: { department_id: q.dep, position_id: q.pos, specialty_id: q.spec, employment_status: q.st }, search: { cols: ['first_name', 'last_name', 'employee_code'], q: q.s }, order: ['first_name', true], page: q.page, size: q.size });
        const pids = r.rows.map(x => x.profile_id).filter(Boolean);
        const prof = pids.length ? Object.fromEntries((await API.list('profiles', { select: 'id,status,role,email', in: { id: pids }, all: true, count: false }).catch(() => ({ rows: [] }))).rows.map(p => [p.id, p])) : {};
        r.rows.forEach(x => { x._p = prof[x.profile_id]; }); return r; },
      href: x => '#/employees/' + x.id,
      columns: [{ h: 'Xodim', r: x => `<b>${esc(name(x))}</b><div class="sub mono">${esc(x.employee_code)}</div>` }, { h: 'Bo\'lim', r: x => esc(dep[x.department_id] || '—') },
        { h: 'Lavozim', r: x => esc(pos[x.position_id] || '—') }, { h: 'Mutaxassislik', r: x => esc(spec[x.specialty_id] || '—') },
        { h: 'Holat', r: x => badge('employment', x.employment_status) + (x._p ? ' ' + badge('account', x._p.status) : x.profile_id ? '' : ' <span class="tiny">akkauntsiz</span>') },
        { h: 'Rol', r: x => x._p ? esc(PERMS.ROLE_LABEL[x._p.role] || x._p.role) : '—' }],
      empty: 'Xodim topilmadi',
    });
  });

  const ETABS = [['overview', 'Overview'], ['courses', 'Courses'], ['exams', 'Exams'], ['assessments', 'Assessments'], ['skills', 'Skills'], ['certificates', 'Certificates'], ['activity', 'Activity'], ['performance', 'Performance']];
  ADMIN.route('/employees/:id', 'employees', async (el, ctx) => {
    const e = await API.get('employees', 'id', ctx.params.id, '*');
    if (!ctx.alive()) return;
    if (!e) { el.innerHTML = `<div class="card">${empty('Xodim topilmadi yoki ruxsat yo\'q')}</div>`; return; }
    const [dep, pos, spec] = await Promise.all([lookup('departments'), lookup('positions'), lookup('specialties')]);
    const p = e.profile_id ? await API.get('profiles', 'id', e.profile_id, 'id,email,full_name,role,status').catch(() => null) : null;
    if (!ctx.alive()) return;
    ctx.setTitle(name(e));
    const tab = ctx.query.tab || 'overview';
    const self = e.profile_id && e.profile_id === PERMS.state.profile.id;
    const acc = p ? p.status : null;
    const acts = [];
    if (!self && PERMS.can('employee.deactivate') && (e.employment_status === 'active' || e.employment_status === 'on_leave' || acc === 'active')) acts.push(`<button class="btn red" data-act="deactivate">Deactivate</button>`);
    if (!self && PERMS.can('employee.edit') && (e.employment_status === 'inactive' || ['inactive', 'deactivated'].includes(acc))) acts.push(`<button class="btn green" data-act="reactivate">Qayta faollashtirish</button>`);
    el.innerHTML = `<div class="adm-h"><div><div class="sub"><a href="#/employees">← Xodimlar</a></div><h1>${esc(name(e))}</h1>
      <div class="row">${badge('employment', e.employment_status)} ${p ? badge('account', p.status) : '<span class="badge">akkauntsiz</span>'} ${p ? `<span class="badge">${esc(PERMS.ROLE_LABEL[p.role] || p.role)}</span>` : ''}</div></div>
      <div class="act">${acts.join('')}</div></div>
      <div class="tabs">${ETABS.map(([k, l]) => `<a href="#/employees/${e.id}?tab=${k}" class="${tab === k ? 'on' : ''}">${l}</a>`).join('')}</div><div data-body>${skeleton(3)}</div>`;
    el.querySelectorAll('[data-act]').forEach(b => b.onclick = () => setStatus(e, p, b.getAttribute('data-act')));
    const body = el.querySelector('[data-body]');
    try {
      if (tab === 'overview') body.innerHTML = `<div class="card"><dl class="kv"><dt>Xodim kodi</dt><dd class="mono">${esc(e.employee_code)}</dd><dt>Bo'lim</dt><dd>${esc(dep[e.department_id] || '—')}</dd>
        <dt>Lavozim</dt><dd>${esc(pos[e.position_id] || '—')}</dd><dt>Mutaxassislik</dt><dd>${esc(spec[e.specialty_id] || '—')}</dd><dt>Ishga qabul</dt><dd>${fmtDate(e.hire_date)}</dd>
        <dt>Ishdan ketgan</dt><dd>${fmtDate(e.termination_date)}</dd><dt>Email</dt><dd>${esc(p ? p.email : '—')}</dd><dt>Yangilangan</dt><dd>${fmtDT(e.updated_at)}</dd></dl>
        <div class="note" style="margin-top:12px">Xodim yozuvi o'chirilmaydi. Deactivate qilinganda tizimga kirish va imtihon yopiladi; urinishlar, natijalar va sertifikatlar o'zgarishsiz saqlanadi.</div></div>`;
      else if (tab === 'courses') { const r = await API.list('course_assignments', { select: 'id,course_id,status,assigned_at,due_date,completed_at', eq: { employee_id: e.id }, order: ['assigned_at', false], all: true, count: false });
        const c = await lookup('courses', 'title');
        body.innerHTML = `<div class="card">${table(r.rows, [{ h: 'Kurs', r: x => esc(c[x.course_id] || x.course_id) }, { h: 'Holat', r: x => badge('generic', x.status) }, { h: 'Tayinlangan', r: x => fmtDate(x.assigned_at) }, { h: 'Muddat', r: x => fmtDate(x.due_date) }, { h: 'Tugallangan', r: x => fmtDate(x.completed_at) }], { empty: 'Kurs tayinlanmagan' })}</div>`; }
      else if (tab === 'exams' || tab === 'performance') {
        const r = e.profile_id ? await API.list('exam_attempts', { select: 'id,course_id,kind,score,passed,is_preview,started_at,finished_at', eq: { user_id: e.profile_id }, order: ['started_at', false], all: true, count: false }) : { rows: [] };
        const c = await lookup('courses', 'title'); const fin = r.rows.filter(x => x.finished_at && !x.is_preview);
        if (tab === 'exams') body.innerHTML = `<div class="card">${table(r.rows, [{ h: 'Kurs', r: x => esc(c[x.course_id] || x.course_id) + (x.is_preview ? ' <span class="badge">preview</span>' : '') }, { h: 'Tur', r: x => esc(x.kind) },
          { h: 'Ball', r: x => x.score === null ? '—' : Math.round(x.score) + '%' }, { h: 'Natija', r: x => x.finished_at ? (x.passed ? '<span class="badge b-green">O\'tdi</span>' : '<span class="badge b-red">O\'tmadi</span>') : '<span class="badge b-amber">Jarayonda</span>' },
          { h: 'Sana', r: x => fmtDT(x.finished_at || x.started_at) }], { empty: 'Imtihon urinishlari yo\'q' })}<div class="tiny">Javoblar bu ro'yxatda yuklanmaydi; urinishlar tarixiy yozuv sifatida o'zgarmaydi.</div></div>`;
        else { const avg = fin.length ? Math.round(fin.reduce((s, x) => s + (+x.score || 0), 0) / fin.length) : null; const pass = fin.length ? Math.round(100 * fin.filter(x => x.passed).length / fin.length) : null;
          body.innerHTML = `<div class="kpis"><div class="kpi"><div class="v">${fin.length}</div><div class="l">Yakunlangan imtihonlar</div></div><div class="kpi"><div class="v">${avg === null ? '—' : avg + '%'}</div><div class="l">O'rtacha ball</div></div><div class="kpi"><div class="v">${pass === null ? '—' : pass + '%'}</div><div class="l">O'tish ulushi</div></div></div><div class="note">Ko'rsatkichlar faqat server urinishlari asosida hisoblanadi (preview urinishlari hisobga olinmaydi).</div>`; } }
      else if (tab === 'certificates') { const r = e.profile_id ? await API.list('certificates', { select: 'id,course_title,score,issued_at,expires_at,revoked', eq: { user_id: e.profile_id }, order: ['issued_at', false], all: true, count: false }) : { rows: [] };
        body.innerHTML = `<div class="card">${table(r.rows, [{ h: 'Sertifikat', r: x => `<span class="mono">${esc(x.id)}</span>` }, { h: 'Kurs', r: x => esc(x.course_title) }, { h: 'Ball', r: x => x.score === null ? '—' : Math.round(x.score) + '%' },
          { h: 'Berilgan', r: x => fmtDate(x.issued_at) }, { h: 'Amal qiladi', r: x => fmtDate(x.expires_at) }, { h: 'Holat', r: x => x.revoked ? '<span class="badge b-red">Bekor qilingan</span>' : '<span class="badge b-green">Amalda</span>' }], { empty: 'Sertifikat yo\'q' })}
          <div class="tiny">Sertifikatdagi ism berilgan paytdagi holatda saqlanadi va profil o'zgarishi bilan o'zgarmaydi.</div></div>`; }
      else if (tab === 'activity') { if (!PERMS.can('audit.view')) { body.innerHTML = UI.denied('Audit faolligi'); return; }
        const r = await API.list('audit_logs', { select: 'action,actor_role,created_at,new_value', eq: { entity_id: e.id }, order: ['created_at', false], size: 50, count: false });
        body.innerHTML = `<div class="card">${table(r.rows, [{ h: 'Vaqt', r: x => fmtDT(x.created_at) }, { h: 'Amal', r: x => esc(x.action) }, { h: 'Kim', r: x => esc(PERMS.ROLE_LABEL[x.actor_role] || x.actor_role || 'tizim') }, { h: 'Sabab', r: x => esc(x.new_value && x.new_value.reason || '') }], { empty: 'Faollik yozuvi yo\'q' })}</div>`; }
      else body.innerHTML = `<div class="card"><div class="note warn">${tab === 'skills' ? 'Skills' : 'Assessments (amaliy baholash)'} hozircha xodim ilovasining hujjat (docs) qatlamida saqlanadi. Server jadvallariga o'tkazish 006c migratsiyasida taklif qilingan — shundan keyin bu yerda ko'rsatiladi.</div></div>`;
    } catch (e2) { if (ctx.alive()) body.innerHTML = errorBox(API.friendly(e2)); }
  });

  async function setStatus(e, p, act) {
    const fields = act === 'deactivate'
      ? [{ name: 'status', label: 'Yangi holat', type: 'select', value: 'inactive', options: [['inactive', 'Inactive — vaqtincha (HR qayta faollashtira oladi)'], ['deactivated', 'Deactivated — doimiy (qayta faollashtirish faqat Super Admin)']] },
         { name: 'reason', label: 'Sabab', type: 'textarea', required: true }, { name: 'ok', type: 'check', label: 'Xodim yozuvi, urinishlar va sertifikatlar saqlanadi; tizimga kirish yopiladi', required: true }]
      : [{ name: 'reason', label: 'Izoh', type: 'textarea' }];
    const r = await dialog({ title: act === 'deactivate' ? 'Xodimni faolsizlantirish' : 'Qayta faollashtirish', body: act === 'deactivate' ? 'O\'chirish (DELETE) yo\'q — faqat holat o\'zgaradi. Amal server audit jurnaliga yoziladi.' : 'Akkaunt qayta faollashtiriladi.', fields, danger: act === 'deactivate', okText: act === 'deactivate' ? 'Faolsizlantirish' : 'Faollashtirish' });
    if (!r) return;
    try { await API.rpc('set_employee_status', { p_employee: e.id, p_status: act === 'deactivate' ? r.status : 'active', p_reason: r.reason || null }); toast('Holat yangilandi'); ADMIN.render(); }
    catch (err) { toast(API.friendly(err).message, true); }
  }

  // ---------- Bo'limlar / Lavozimlar / Mutaxassisliklar ----------
  const ORG = { departments: ['Bo\'limlar', 'department.manage', 'department.view'], positions: ['Lavozimlar', 'position.manage', 'position.view'], specialties: ['Mutaxassisliklar', 'specialty.manage', 'specialty.view'] };
  ADMIN.route('/org/:kind', 'organization', async (el, ctx) => {
    const kind = ctx.params.kind; const cfg = ORG[kind]; if (!cfg) { el.innerHTML = `<div class="card">${empty('Bo\'lim topilmadi')}</div>`; return; }
    const tabs = `<div class="tabs">${Object.entries(ORG).map(([k, v]) => `<a href="#/org/${k}" class="${k === kind ? 'on' : ''}">${v[0]}</a>`).join('')}</div>`;
    const canManage = PERMS.can(cfg[1]);
    const h = await listPage(el, ctx, {
      title: cfg[0], id: 'org-' + kind, top: tabs, sub: 'O\'chirish yo\'q — keraksiz yozuv "Inactive" qilinadi (tarixiy bog\'lanishlar saqlanadi).',
      actions: canManage ? `<button class="btn primary" data-act="new">+ Qo'shish</button>` : '',
      filters: [{ key: 's', type: 'search', label: 'Nomi yoki kodi' }, { key: 'st', type: 'select', label: 'Holat', options: [['active', 'Active'], ['inactive', 'Inactive']] }],
      load: q => API.list(kind, { select: '*', eq: { status: q.st }, search: { cols: ['name', 'code'], q: q.s }, order: ['name', true], page: q.page, size: q.size }),
      columns: [{ h: 'Nomi', r: x => `<b>${esc(x.name)}</b>${x.description ? `<div class="sub">${esc(x.description)}</div>` : ''}` }, { h: 'Kod', r: x => `<span class="mono">${esc(x.code)}</span>` },
        ...(kind === 'positions' ? [{ h: 'Oila / akademiya', r: x => esc([x.family, x.academy].filter(Boolean).join(' / ') || '—') }] : []),
        { h: 'Holat', r: x => badge('generic', x.status) }, ...(canManage ? [{ h: '', r: x => `<button class="btn sm" data-edit="${esc(x.id)}">Tahrirlash</button>` }] : [])],
      empty: 'Yozuv yo\'q', onReady: (listEl, r) => listEl.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => edit(kind, r.rows.find(x => x.id === b.getAttribute('data-edit')))),
    });
    const nb = el.querySelector('[data-act="new"]'); if (nb) nb.onclick = () => edit(kind, null);
    async function edit(k, row) {
      const r = await dialog({ title: row ? 'Tahrirlash' : 'Qo\'shish', fields: [{ name: 'name', label: 'Nomi', required: true, value: row && row.name }, { name: 'code', label: 'Kod (A-Z, 0-9, _ -)', required: true, value: row && row.code, pattern: '[A-Z0-9_-]{2,32}' },
        { name: 'description', label: 'Tavsif', type: 'textarea', value: row && row.description }, { name: 'status', label: 'Holat', type: 'select', value: row ? row.status : 'active', options: [['active', 'Active'], ['inactive', 'Inactive']] }], okText: 'Saqlash' });
      if (!r) return;
      try { const patch = { name: r.name, code: r.code, description: r.description || null, status: r.status };
        if (row) await API.update(k, 'id', row.id, patch); else await API.insert(k, { ...patch, org_id: PERMS.state.profile.org_id });
        clearCache(); toast('Saqlandi'); h.reload(); } catch (e) { toast(API.friendly(e).message, true); }
    }
  });
})();

</script>
<script>/* js/admin/pages_edu.js */
/* Ta'lim (kurslar → modullar → darslar, tayinlashlar, instruktorlar) va Imtihonlar (sozlamalar, urinishlar, natijalar). */
(function () {
  const { esc, badge, table, empty, errorBox, skeleton, fmtDT, fmtDate, toast, dialog } = UI;
  const { listPage, lookup, clearCache } = ADMINLIB;
  const COURSE_FLOW = { draft: ['under_review'], under_review: ['approved', 'draft'], approved: ['published', 'draft'], published: ['archived'], archived: ['draft'] };
  const eduTabs = cur => `<div class="tabs">${[['courses', 'Kurslar'], ['assignments', 'Tayinlashlar'], ['instructors', 'Instruktorlar']].map(([k, l]) => `<a href="#/edu/${k}" class="${k === cur ? 'on' : ''}">${l}</a>`).join('')}</div>`;

  async function eligibleByCourse() { const m = await API.rpc('question_meta').catch(() => []); const out = {}; (Array.isArray(m) ? m : []).forEach(x => { out[x.course] = (out[x.course] || 0) + 1; }); return out; }

  ADMIN.route('/edu/courses', 'education', async (el, ctx) => {
    const elig = await eligibleByCourse();
    await listPage(el, ctx, {
      title: 'Kurslar', id: 'courses', top: eduTabs('courses'), sub: 'Kurs → Modul → Dars → Quiz → Klinik holat → Yakuniy imtihon.',
      chips: { key: 'st', items: [['', 'Barchasi'], ['draft', 'Draft'], ['under_review', 'Under Review'], ['approved', 'Approved'], ['published', 'Published'], ['archived', 'Archived']] },
      filters: [{ key: 's', type: 'search', label: 'Kurs nomi yoki kodi' }, { key: 'domain', type: 'select', label: 'Soha', options: [['medical', 'Tibbiy'], ['ethics', 'Etika'], ['communication', 'Kommunikatsiya'], ['safety', 'Xavfsizlik'], ['public_health', 'Jamoat salomatligi'], ['sales', 'Sotuv/servis']] }],
      load: q => API.list('courses', { select: 'id,code,title,domain,status,valid_months,updated_at', eq: { status: q.st, domain: q.domain }, search: { cols: ['title', 'code', 'id'], q: q.s }, order: ['title', true], page: q.page, size: q.size }),
      href: x => '#/edu/courses/' + encodeURIComponent(x.id),
      columns: [{ h: 'Kurs', r: x => `<b>${esc(x.title)}</b><div class="sub mono">${esc(x.code || x.id)}</div>` }, { h: 'Soha', r: x => esc(x.domain) }, { h: 'Holat', r: x => badge('course', x.status) },
        { h: 'Yaroqli savollar', r: x => `<b>${elig[x.id] || 0}</b>` }, { h: 'Amal muddati', r: x => x.valid_months + ' oy' }],
      empty: 'Kurs yo\'q',
    });
  });

  ADMIN.route('/edu/courses/:id', 'education', async (el, ctx) => {
    const id = decodeURIComponent(ctx.params.id);
    const c = await API.get('courses', 'id', id, '*');
    if (!ctx.alive()) return;
    if (!c) { el.innerHTML = `<div class="card">${empty('Kurs topilmadi yoki ruxsat yo\'q')}</div>`; return; }
    ctx.setTitle(c.title);
    const [mods, cfg, elig] = await Promise.all([API.list('course_modules', { select: 'id,title,order_index,status', eq: { course_id: id }, order: ['order_index', true], all: true, count: false }),
      API.get('exam_configs', 'course_id', id, '*').catch(() => null), eligibleByCourse()]);
    const lessons = mods.rows.length ? (await API.list('lessons', { select: 'id,module_id,title,content_type,order_index,status,estimated_minutes', in: { module_id: mods.rows.map(m => m.id) }, order: ['order_index', true], all: true, count: false })).rows : [];
    if (!ctx.alive()) return;
    const canStatus = PERMS.can('course.publish') || PERMS.can('course.edit');
    const next = (COURSE_FLOW[c.status] || []).filter(s => s !== 'published' || PERMS.can('course.publish'));
    el.innerHTML = `<div class="adm-h"><div><div class="sub"><a href="#/edu/courses">← Kurslar</a></div><h1>${esc(c.title)}</h1><div class="row">${badge('course', c.status)} <span class="badge">${esc(c.domain)}</span> <span class="small muted">Yaroqli savollar: <b>${elig[id] || 0}</b>${cfg ? ' / imtihon uchun kerak: ' + cfg.question_count : ''}</span></div></div>
      <div class="act">${canStatus ? next.map(s => `<button class="btn ${s === 'published' ? 'green' : ''}" data-status="${s}">→ ${esc(UI.LABELS.course[s][0])}</button>`).join('') : ''}</div></div>
      <div class="grid g2"><div class="card"><h3>Tuzilma: modullar va darslar</h3>${mods.rows.length ? mods.rows.map(m => `<div class="opt"><div class="row between"><b>${m.order_index}. ${esc(m.title)}</b>${badge('generic', m.status)}</div>
        ${lessons.filter(l => l.module_id === m.id).map(l => `<div class="small row between" style="padding:2px 0 2px 14px"><span>${esc(l.title)} <span class="tiny">${esc(l.content_type)} · ${l.estimated_minutes} daq</span></span>${badge('generic', l.status)}</div>`).join('') || '<div class="tiny" style="padding-left:14px">Dars yo\'q</div>'}</div>`).join('') : empty('Modul yo\'q')}</div>
      <div class="card"><h3>Yakuniy imtihon</h3>${cfg ? `<dl class="kv"><dt>Savollar soni</dt><dd>${cfg.question_count}</dd><dt>Davomiyligi</dt><dd>${cfg.time_min} daqiqa</dd><dt>O'tish bali</dt><dd>${cfg.pass_score}%</dd><dt>Urinishlar</dt><dd>${cfg.max_attempts}</dd><dt>Qayta topshirish</dt><dd>${cfg.retake_days} kundan keyin</dd></dl>
        ${(elig[id] || 0) < cfg.question_count ? `<div class="note warn" style="margin-top:10px">Imtihonga yaroqli savollar yetarli emas (${elig[id] || 0}/${cfg.question_count}). Xodimlar imtihonni boshlay olmaydi — server tekshiradi.</div>` : '<div class="note" style="margin-top:10px">Yaroqli savollar yetarli.</div>'}` : empty('Imtihon sozlamasi yo\'q')}</div></div>`;
    el.querySelectorAll('[data-status]').forEach(b => b.onclick = async () => { const s = b.getAttribute('data-status');
      if (s === 'published' && cfg && (elig[id] || 0) < cfg.question_count) { if (!await dialog({ title: 'Diqqat', body: `Kursda imtihonga yaroqli savollar yetarli emas (${elig[id] || 0}/${cfg.question_count}). Kurs nashr qilinadi, lekin yakuniy imtihon server tomonidan bloklanadi.`, okText: 'Baribir nashr qilish' })) return; }
      else if (!await dialog({ title: 'Kurs holatini o\'zgartirish', body: `${esc(UI.LABELS.course[c.status][0])} → <b>${esc(UI.LABELS.course[s][0])}</b>`, okText: 'Tasdiqlash' })) return;
      try { await API.update('courses', 'id', id, { status: s }); clearCache(); toast('Kurs holati yangilandi'); ADMIN.render(); } catch (e) { toast(API.friendly(e).message, true); } });
  });

  ADMIN.route('/edu/assignments', 'education', async (el, ctx) => {
    const courses = await lookup('courses', 'title');
    const h = await listPage(el, ctx, {
      title: 'Tayinlashlar', id: 'assignments', top: eduTabs('assignments'),
      actions: PERMS.can('assignment.manage') ? `<button class="btn primary" data-act="assign">+ Kurs tayinlash</button>` : '',
      filters: [{ key: 'course', type: 'select', label: 'Kurs', options: Object.entries(courses) }, { key: 'st', type: 'select', label: 'Holat', options: ['assigned', 'in_progress', 'completed', 'overdue', 'cancelled'].map(s => [s, UI.LABELS.generic[s][0]]) }],
      load: async q => { const r = await API.list('course_assignments', { select: 'id,course_id,employee_id,status,assigned_at,due_date,completed_at', eq: { course_id: q.course, status: q.st }, order: ['assigned_at', false], page: q.page, size: q.size });
        const ids = r.rows.map(x => x.employee_id); const em = ids.length ? Object.fromEntries((await API.list('employees', { select: 'id,first_name,last_name,employee_code', in: { id: ids }, all: true, count: false }).catch(() => ({ rows: [] }))).rows.map(e => [e.id, e])) : {};
        r.rows.forEach(x => x._e = em[x.employee_id]); return r; },
      columns: [{ h: 'Xodim', r: x => x._e ? `<a href="#/employees/${x._e.id}">${esc([x._e.first_name, x._e.last_name].filter(Boolean).join(' ') || x._e.employee_code)}</a>` : '<span class="tiny">ko\'rinmaydi</span>' },
        { h: 'Kurs', r: x => esc(courses[x.course_id] || x.course_id) }, { h: 'Holat', r: x => badge('generic', x.status) }, { h: 'Tayinlangan', r: x => fmtDate(x.assigned_at) }, { h: 'Muddat', r: x => fmtDate(x.due_date) }],
      empty: 'Tayinlash yo\'q',
    });
    const b = el.querySelector('[data-act="assign"]');
    if (b) b.onclick = async () => {
      const em = await API.list('employees', { select: 'id,first_name,last_name,employee_code', eq: { employment_status: 'active' }, order: ['first_name', true], all: true, count: false }).catch(() => ({ rows: [] }));
      const r = await dialog({ title: 'Kurs tayinlash', fields: [{ name: 'course', label: 'Kurs', type: 'select', required: true, options: Object.entries(courses) },
        { name: 'emp', label: 'Xodim', type: 'select', required: true, options: em.rows.map(e => [e.id, [e.first_name, e.last_name].filter(Boolean).join(' ') + ' (' + e.employee_code + ')']) }, { name: 'due', label: 'Muddat', type: 'date' }], okText: 'Tayinlash' });
      if (!r) return;
      try { await API.insert('course_assignments', { org_id: PERMS.state.profile.org_id, course_id: r.course, employee_id: r.emp, due_date: r.due || null }); toast('Tayinlandi'); h.reload(); } catch (e) { toast(API.friendly(e).message, true); }
    };
  });

  ADMIN.route('/edu/instructors', 'education', async (el, ctx) => {
    const courses = await lookup('courses', 'title');
    const h = await listPage(el, ctx, {
      title: 'Instruktorlar', id: 'instructors', top: eduTabs('instructors'), sub: 'Instruktor faqat biriktirilgan kurslar kontentini ko\'radi va tahrirlaydi (server RLS).',
      actions: PERMS.can('instructor.assign') ? `<button class="btn primary" data-act="add">+ Instruktor biriktirish</button>` : '',
      filters: [{ key: 'course', type: 'select', label: 'Kurs', options: Object.entries(courses) }],
      load: async q => { const r = await API.list('course_instructors', { select: 'id,course_id,employee_id,status,assigned_at', eq: { course_id: q.course }, order: ['assigned_at', false], page: q.page, size: q.size });
        const ids = r.rows.map(x => x.employee_id); const em = ids.length ? Object.fromEntries((await API.list('employees', { select: 'id,first_name,last_name,employee_code', in: { id: ids }, all: true, count: false }).catch(() => ({ rows: [] }))).rows.map(e => [e.id, e])) : {};
        r.rows.forEach(x => x._e = em[x.employee_id]); return r; },
      columns: [{ h: 'Instruktor', r: x => x._e ? esc([x._e.first_name, x._e.last_name].filter(Boolean).join(' ')) : '<span class="tiny">—</span>' }, { h: 'Kurs', r: x => esc(courses[x.course_id] || x.course_id) },
        { h: 'Holat', r: x => badge('generic', x.status) }, { h: 'Biriktirilgan', r: x => fmtDate(x.assigned_at) }],
      empty: 'Instruktor biriktirilmagan',
    });
    const b = el.querySelector('[data-act="add"]');
    if (b) b.onclick = async () => {
      const em = await API.list('employees', { select: 'id,first_name,last_name,employee_code,profile_id', eq: { employment_status: 'active' }, order: ['first_name', true], all: true, count: false }).catch(() => ({ rows: [] }));
      const r = await dialog({ title: 'Instruktor biriktirish', fields: [{ name: 'course', label: 'Kurs', type: 'select', required: true, options: Object.entries(courses) }, { name: 'emp', label: 'Xodim', type: 'select', required: true, options: em.rows.map(e => [e.id, [e.first_name, e.last_name].filter(Boolean).join(' ') + ' (' + e.employee_code + ')']) }], okText: 'Biriktirish' });
      if (!r) return;
      try { await API.insert('course_instructors', { org_id: PERMS.state.profile.org_id, course_id: r.course, employee_id: r.emp }); toast('Biriktirildi'); h.reload(); } catch (e) { toast(API.friendly(e).message, true); }
    };
  });

  // ---------- Imtihonlar ----------
  const examTabs = cur => `<div class="tabs">${[['configs', 'Imtihon sozlamalari'], ['attempts', 'Urinishlar'], ['results', 'Natijalar']].map(([k, l]) => `<a href="#/exams/${k}" class="${k === cur ? 'on' : ''}">${l}</a>`).join('')}</div>`;
  ADMIN.route('/exams/configs', 'exams', async (el, ctx) => {
    const [courses, elig] = await Promise.all([API.list('courses', { select: 'id,title,status', all: true, count: false }), eligibleByCourse()]);
    const cmap = Object.fromEntries(courses.rows.map(c => [c.id, c]));
    const canEdit = PERMS.can('exam.manage');
    const h = await listPage(el, ctx, {
      title: 'Imtihon sozlamalari', id: 'exam-configs', top: examTabs('configs'),
      sub: 'Imtihon faqat yetarli <b>yaroqli</b> savol bo\'lganda ishlaydi. Yaroqlilikni server hisoblaydi (published + current evidence).',
      filters: [{ key: 's', type: 'search', label: 'Kurs' }],
      load: async q => { const r = await API.list('exam_configs', { select: '*', order: ['course_id', true], page: q.page, size: q.size });
        if (q.s) r.rows = r.rows.filter(x => (cmap[x.course_id]?.title || x.course_id).toLowerCase().includes(q.s.toLowerCase())); return r; },
      columns: [{ h: 'Kurs', r: x => `<b>${esc(cmap[x.course_id]?.title || x.course_id)}</b><div class="sub">${badge('course', cmap[x.course_id]?.status)}</div>` },
        { h: 'Holat', r: x => (elig[x.course_id] || 0) >= x.question_count && cmap[x.course_id]?.status === 'published' ? '<span class="badge b-green" data-exam-state="ready">Tayyor</span>' : `<span class="badge b-red" data-exam-state="blocked">Bloklangan</span><div class="sub">yaroqli ${elig[x.course_id] || 0}/${x.question_count}</div>` },
        { h: 'Savollar', r: x => x.question_count }, { h: 'Davomiylik', r: x => x.time_min + ' daq' }, { h: 'O\'tish bali', r: x => x.pass_score + '%' }, { h: 'Urinishlar', r: x => x.max_attempts },
        ...(canEdit ? [{ h: '', r: x => `<button class="btn sm" data-edit="${esc(x.course_id)}">Tahrirlash</button>` }] : [])],
      empty: 'Imtihon sozlamasi yo\'q',
      onReady: (listEl, r) => listEl.querySelectorAll('[data-edit]').forEach(b => b.onclick = async () => { const x = r.rows.find(y => y.course_id === b.getAttribute('data-edit'));
        const v = await dialog({ title: 'Imtihon sozlamasi: ' + (cmap[x.course_id]?.title || x.course_id), fields: [
          { name: 'question_count', label: 'Savollar soni', type: 'number', value: x.question_count, required: true }, { name: 'time_min', label: 'Davomiylik (daqiqa)', type: 'number', value: x.time_min, required: true },
          { name: 'pass_score', label: 'O\'tish bali (%)', type: 'number', value: x.pass_score, required: true }, { name: 'max_attempts', label: 'Maksimal urinishlar', type: 'number', value: x.max_attempts, required: true },
          { name: 'retake_days', label: 'Qayta topshirish (kun)', type: 'number', value: x.retake_days, required: true }], okText: 'Saqlash' });
        if (!v) return;
        try { await API.update('exam_configs', 'course_id', x.course_id, { question_count: +v.question_count, time_min: +v.time_min, pass_score: +v.pass_score, max_attempts: +v.max_attempts, retake_days: +v.retake_days }); toast('Saqlandi'); h.reload(); }
        catch (e) { toast(API.friendly(e).message, true); } }),
    });
  });

  ADMIN.route('/exams/attempts', 'exams', async (el, ctx) => {
    const courses = await lookup('courses', 'title');
    await listPage(el, ctx, {
      title: 'Imtihon urinishlari', id: 'attempts', top: examTabs('attempts'), sub: 'Tarixiy yozuvlar — o\'zgartirib yoki o\'chirib bo\'lmaydi. Javoblar bu ro\'yxatda yuklanmaydi.',
      filters: [{ key: 'course', type: 'select', label: 'Kurs', options: Object.entries(courses) }, { key: 'kind', type: 'select', label: 'Tur', options: [['final', 'Yakuniy'], ['module', 'Modul'], ['initial', 'Boshlang\'ich']] },
        { key: 'res', type: 'select', label: 'Natija', options: [['true', 'O\'tdi'], ['false', 'O\'tmadi']] }],
      load: async q => { const r = await API.list('exam_attempts', { select: 'id,user_id,course_id,kind,score,passed,is_preview,started_at,finished_at', eq: { course_id: q.course, kind: q.kind, passed: q.res }, order: ['started_at', false], page: q.page, size: q.size });
        const ids = [...new Set(r.rows.map(x => x.user_id))]; const pp = ids.length ? Object.fromEntries((await API.list('profiles', { select: 'id,full_name,email', in: { id: ids }, all: true, count: false }).catch(() => ({ rows: [] }))).rows.map(p => [p.id, p])) : {};
        r.rows.forEach(x => x._p = pp[x.user_id]); return r; },
      columns: [{ h: 'Xodim', r: x => esc(x._p ? x._p.full_name || x._p.email : (x.user_id || '').slice(0, 8)) }, { h: 'Kurs', r: x => esc(courses[x.course_id] || x.course_id) + (x.is_preview ? ' <span class="badge">preview</span>' : '') },
        { h: 'Tur', r: x => esc(x.kind) }, { h: 'Ball', r: x => x.score === null ? '—' : Math.round(x.score) + '%' },
        { h: 'Natija', r: x => x.finished_at ? (x.passed ? '<span class="badge b-green">O\'tdi</span>' : '<span class="badge b-red">O\'tmadi</span>') : '<span class="badge b-amber">Jarayonda</span>' }, { h: 'Sana', r: x => fmtDT(x.finished_at || x.started_at) }],
      empty: 'Urinish yo\'q',
    });
  });

  ADMIN.route('/exams/results', 'exams', async (el, ctx) => {
    ctx.setTitle('Natijalar');
    const [courses, r] = await Promise.all([lookup('courses', 'title'), API.list('exam_attempts', { select: 'course_id,score,passed,finished_at,is_preview,kind', is: { is_preview: false }, all: true, max: 4999, count: false })]);
    if (!ctx.alive()) return;
    const agg = {}; r.rows.filter(x => x.finished_at && x.kind === 'final').forEach(x => { const a = agg[x.course_id] = agg[x.course_id] || { n: 0, p: 0, s: 0 }; a.n++; if (x.passed) a.p++; a.s += +x.score || 0; });
    const rows = Object.entries(agg).map(([c, a]) => ({ c, ...a }));
    el.innerHTML = `<div class="adm-h"><div><h1>Natijalar</h1><div class="sub">Yakuniy imtihonlar bo'yicha (preview urinishlarsiz), sizning ruxsat doirangizda.</div></div></div>${examTabs('results')}
      <div class="card">${table(rows, [{ h: 'Kurs', r: x => esc(courses[x.c] || x.c) }, { h: 'Urinishlar', r: x => x.n }, { h: 'O\'tganlar', r: x => x.p }, { h: 'O\'tish ulushi', r: x => Math.round(100 * x.p / x.n) + '%' }, { h: 'O\'rtacha ball', r: x => Math.round(x.s / x.n) + '%' }], { empty: 'Yakunlangan yakuniy imtihon yo\'q', id: 'results' })}</div>`;
  });
})();

</script>
<script>/* js/admin/pages_learning.js */
/* Phase 3 (007a / 007b): Learning Paths (apply / reapply / cancel — faqat RPC) va Course Progress (course_progress_summary).
   Hisob-kitob (status, progress %) faqat serverda: frontend backend qaytargan qiymatni ko'rsatadi, o'zi hisoblamaydi. */
(function () {
  const { esc, badge, table, empty, errorBox, skeleton, fmtDate, fmtDT, toast, dialog } = UI;
  const { listPage, lookup } = ADMINLIB;
  UI.LABELS.p3 = {
    active: ['Faol', 'b-green'], cancelled: ['Bekor qilingan', ''], not_started: ['Boshlanmagan', ''], in_progress: ['Jarayonda', 'b-blue'],
    completed: ['Tugallangan', 'b-green'], overdue: ['Muddati o\'tgan', 'b-red'], assigned: ['Tayinlangan', ''],
    achieved: ['Bajarilgan', 'b-green'], not_achieved: ['Bajarilmagan', 'b-red'], not_assessed: ['Baholanmagan', 'b-amber'],
    published: ['Published', 'b-green'], draft: ['Draft', ''], archived: ['Arxiv', ''],
  };
  const TARGETS = [['employee', 'Xodim'], ['department', 'Bo\'lim'], ['position', 'Lavozim'], ['specialty', 'Mutaxassislik'], ['role', 'Rol']];
  const TLABEL = Object.fromEntries(TARGETS);
  const ROLES = ['employee', 'department_head', 'instructor', 'hr', 'education_manager', 'medical_reviewer', 'content_author'];
  const learnTabs = cur => `<div class="tabs">${[['paths', 'Learning Paths'], ['progress', 'Course Progress']].filter(([k]) => PERMS.section(k === 'paths' ? 'learning_paths' : 'progress'))
    .map(([k, l]) => `<a href="#/learning/${k}" class="${k === cur ? 'on' : ''}">${l}</a>`).join('')}</div>`;
  const pct = v => `<div class="row" style="gap:8px;align-items:center"><div class="bar" style="flex:1;min-width:60px"><i style="width:${Math.max(0, Math.min(100, +v || 0))}%"></i></div><b>${esc(v)}%</b></div>`;

  // Nishon nomlari (lookup'lar keshlanadi; xodimlar — faqat kerakli ID'lar, bitta so'rov)
  async function targetNames(rows) {
    const [deps, pos, spec] = await Promise.all([lookup('departments', 'name'), lookup('positions', 'name'), lookup('specialties', 'name')]);
    const empIds = [...new Set(rows.filter(r => r.target_type === 'employee' && r.employee_id).map(r => r.employee_id))];
    const em = empIds.length ? Object.fromEntries((await API.list('employees', { select: 'id,first_name,last_name,employee_code', in: { id: empIds }, all: true, count: false })).rows
      .map(e => [e.id, [e.first_name, e.last_name].filter(Boolean).join(' ') || e.employee_code])) : {};
    return r => r.target_type === 'employee' ? (em[r.employee_id] || 'Xodim') : r.target_type === 'department' ? (deps[r.department_id] || '—')
      : r.target_type === 'position' ? (pos[r.position_id] || '—') : r.target_type === 'specialty' ? (spec[r.specialty_id] || '—') : (PERMS.ROLE_LABEL[r.target_role] || r.target_role);
  }

  // ---------------- Learning Paths ro'yxati ----------------
  ADMIN.route('/learning/paths', 'learning_paths', async (el, ctx) => {
    let counts = {};
    await listPage(el, ctx, {
      title: 'Learning Paths', id: 'learning_paths', top: learnTabs('paths'),
      sub: 'O\'quv yo\'nalishlari va ularning tayinlash qoidalari (007b). Tayinlash, qayta qo\'llash va bekor qilish faqat server RPC orqali.',
      filters: [{ key: 's', type: 'search', label: 'Nomi yoki kodi' }, { key: 'st', type: 'select', label: 'Holat', options: [['published', 'Published'], ['draft', 'Draft'], ['archived', 'Arxiv']] }],
      load: async q => {
        const r = await API.list('learning_paths', { select: 'id,code,title,status,updated_at', eq: { status: q.st }, search: { cols: ['title', 'code'], q: q.s }, order: ['title', true], page: q.page, size: q.size });
        const ids = r.rows.map(x => x.id);
        if (ids.length) {
          const [pc, pa] = await Promise.all([API.list('learning_path_courses', { select: 'path_id', in: { path_id: ids }, all: true, count: false }),
            API.list('learning_path_assignments', { select: 'path_id,status', in: { path_id: ids }, all: true, count: false }).catch(() => ({ rows: [] }))]);
          counts = {}; ids.forEach(i => counts[i] = { c: 0, a: 0, x: 0 });
          pc.rows.forEach(x => counts[x.path_id].c++); pa.rows.forEach(x => counts[x.path_id][x.status === 'active' ? 'a' : 'x']++);
        }
        return r;
      },
      href: x => '#/learning/paths/' + x.id,
      columns: [{ h: 'Yo\'nalish', r: x => `<b>${esc(x.title)}</b><div class="sub mono">${esc(x.code)}</div>` }, { h: 'Holat', r: x => badge('p3', x.status) },
        { h: 'Kurslar', r: x => `<b>${(counts[x.id] || {}).c || 0}</b>` }, { h: 'Faol qoidalar', r: x => `<b data-active>${(counts[x.id] || {}).a || 0}</b>` },
        { h: 'Bekor qilingan', r: x => `${(counts[x.id] || {}).x || 0}` }],
      empty: 'Learning path yo\'q',
    });
  });

  // ---------------- Learning Path tafsiloti ----------------
  ADMIN.route('/learning/paths/:id', 'learning_paths', async (el, ctx) => {
    const id = ctx.params.id;
    const p = await API.get('learning_paths', 'id', id, 'id,code,title,description,status');
    if (!ctx.alive()) return;
    if (!p) { el.innerHTML = `<div class="card">${empty('Learning path topilmadi yoki ruxsat yo\'q')}</div>`; return; }
    ctx.setTitle(p.title);
    const [pc, rules, courses] = await Promise.all([
      API.list('learning_path_courses', { select: 'course_id,order_index,is_required', eq: { path_id: id }, order: ['order_index', true], all: true, count: false }),
      API.list('learning_path_assignments', { select: 'id,target_type,employee_id,department_id,position_id,specialty_id,target_role,status,due_date,created_at,updated_at,cancelled_at,cancel_reason', eq: { path_id: id }, order: ['created_at', false], all: true, count: false }),
      lookup('courses', 'title')]);
    if (!ctx.alive()) return;
    const nameOf = await targetNames(rules.rows);
    const canManage = PERMS.can('learning_path.manage');
    el.innerHTML = `<div class="adm-h"><div><div class="sub"><a href="#/learning/paths">← Learning Paths</a></div><h1>${esc(p.title)}</h1><div class="row">${badge('p3', p.status)} <span class="small mono">${esc(p.code)}</span></div></div>
      <div class="act">${canManage && p.status === 'published' ? '<button class="btn primary" data-act="apply">+ Tayinlash</button>' : ''}</div></div>
      ${p.status !== 'published' ? '<div class="note warn">Faqat published yo\'nalishni tayinlash mumkin (server tekshiradi).</div>' : ''}
      <div class="grid g2"><div class="card"><h3>Kurslar (${pc.rows.length})</h3>${pc.rows.length ? pc.rows.map(c => `<div class="small row between" style="padding:3px 0"><span>${c.order_index}. ${esc(courses[c.course_id] || c.course_id)}</span>${c.is_required ? '<span class="badge b-blue">majburiy</span>' : '<span class="badge">ixtiyoriy</span>'}</div>`).join('') : empty('Kurs yo\'q')}</div>
      <div class="card"><h3>Eslatma</h3><div class="small muted">Qoidani bekor qilish allaqachon yaratilgan kurs tayinlashlarini avtomatik bekor qilmaydi (007b semantikasi). Qayta qo'llash faqat yetishmayotgan tayinlashlarni qo'shadi — dublikat yaratilmaydi.</div></div></div>
      <div class="card"><h3>Tayinlash qoidalari</h3>${table(rules.rows, [
        { h: 'Nishon', r: r => `<span class="badge">${esc(TLABEL[r.target_type] || r.target_type)}</span> <b>${esc(nameOf(r))}</b>` },
        { h: 'Holat', r: r => badge('p3', r.status) + (r.cancel_reason ? `<div class="tiny">${esc(r.cancel_reason)}</div>` : '') },
        { h: 'Muddat', r: r => fmtDate(r.due_date) }, { h: 'Yaratilgan', r: r => fmtDT(r.created_at) }, { h: 'Yangilangan', r: r => fmtDT(r.updated_at) },
        { h: '', r: r => canManage && r.status === 'active' ? `<button class="btn sm" data-reapply="${r.id}">Qayta qo'llash</button> <button class="btn sm red" data-cancel="${r.id}">Bekor qilish</button>` : '' }],
        { id: 'lpa_rules', empty: 'Tayinlash qoidasi yo\'q' })}</div>`;
    const run = async (fn, args, okMsg) => { try { const r = await API.rpc(fn, args); toast(okMsg(r || {})); ADMIN.render(); } catch (e) { toast(API.friendly(e).message, true); } };
    const btn = el.querySelector('[data-act=apply]');
    if (btn) btn.onclick = async () => {
      const t = await dialog({ title: 'Learning path tayinlash', body: 'Avval nishon turini tanlang.', fields: [{ name: 'type', label: 'Nishon turi', type: 'select', options: TARGETS, required: true }], okText: 'Davom etish' });
      if (!t) return;
      let options;
      if (t.type === 'role') options = ROLES.map(r => [r, PERMS.ROLE_LABEL[r] || r]);
      else if (t.type === 'employee') options = (await API.list('employees', { select: 'id,first_name,last_name,employee_code', eq: { employment_status: 'active' }, order: ['last_name', true], all: true, count: false })).rows
        .map(e => [e.id, [e.first_name, e.last_name].filter(Boolean).join(' ') + ' · ' + (e.employee_code || '')]);
      else options = Object.entries(await lookup(t.type === 'department' ? 'departments' : t.type === 'position' ? 'positions' : 'specialties', 'name'));
      if (!options.length) { toast('Tanlash uchun ' + TLABEL[t.type].toLowerCase() + ' topilmadi', true); return; }
      const f = await dialog({ title: 'Tayinlash: ' + TLABEL[t.type], body: `<b>${esc(p.title)}</b>`, fields: [{ name: 'target', label: TLABEL[t.type], type: 'select', options, required: true },
        { name: 'due', label: 'Muddat (ixtiyoriy)', type: 'date' }], okText: 'Tayinlash' });
      if (!f) return;
      await run('apply_learning_path', { p_path: id, p_target_type: t.type, p_target_id: f.target, p_due_date: f.due || null },
        r => `Tayinlandi: ${r.course_assignments_created ?? 0} ta yangi kurs tayinlash, ${r.employees_matched ?? 0} xodim` + (r.rule === 'existing' ? ' (qoida allaqachon mavjud edi)' : ''));
    };
    el.querySelectorAll('[data-reapply]').forEach(b => b.onclick = async () => {
      if (!await dialog({ title: 'Qayta qo\'llash', body: 'Qoida joriy xodimlar ro\'yxatiga qayta qo\'llanadi. Yetishmayotgan tayinlashlar qo\'shiladi, mavjudlari o\'zgarmaydi.', okText: 'Qayta qo\'llash' })) return;
      await run('reapply_learning_path_assignment', { p_assignment: b.getAttribute('data-reapply') }, r => `Qayta qo'llandi: ${r.course_assignments_created ?? 0} ta yangi tayinlash`);
    });
    el.querySelectorAll('[data-cancel]').forEach(b => b.onclick = async () => {
      const f = await dialog({ title: 'Qoidani bekor qilish', body: 'Mavjud kurs tayinlashlari bekor qilinmaydi.', fields: [{ name: 'reason', label: 'Sabab', type: 'textarea', required: true }], okText: 'Bekor qilish', danger: true });
      if (!f) return;
      await run('cancel_learning_path_assignment', { p_assignment: b.getAttribute('data-cancel'), p_reason: f.reason }, () => 'Qoida bekor qilindi');
    });
  });

  // ---------------- Course Progress (007a course_progress_summary) ----------------
  ADMIN.route('/learning/progress', 'progress', async (el, ctx) => {
    ctx.setTitle('Course Progress');
    const courses = await lookup('courses', 'title');
    const cur = ctx.query.course || '';
    el.innerHTML = `<div class="adm-h"><div><h1>Course Progress</h1><div class="sub">Kurs tugallanishi = barcha majburiy published darslar tugallangan (007a). Yakuniy imtihon / sertifikat — alohida (Imtihonlar bo'limi).</div></div></div>
      ${learnTabs('progress')}<div class="filters"><select data-f="course"><option value="">Kursni tanlang</option>${Object.entries(courses).map(([k, v]) => `<option value="${esc(k)}" ${k === cur ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></div>
      <div data-sum>${cur ? skeleton(3) : `<div class="card">${empty('Kursni tanlang', 'Server qamrovingiz bo\'yicha umumiy ko\'rsatkichlar ko\'rsatiladi')}</div>`}</div>
      <div class="card" style="padding:6px 8px" data-list ${cur ? '' : 'hidden'}>${skeleton(4)}</div>`;
    el.querySelector('[data-f=course]').onchange = e => { ctx.setQuery({ course: e.target.value }); ADMIN.render(); };
    if (!cur) return;
    const sumEl = el.querySelector('[data-sum]'), listEl = el.querySelector('[data-list]');
    try {
      const [s, rows] = await Promise.all([API.rpc('course_progress_summary', { p_course: cur }),
        API.list('course_assignments', { select: 'id,employee_id,status,due_date,assigned_at,completed_at', eq: { course_id: cur }, order: ['assigned_at', false], page: +(ctx.query.page || 0), size: 25 })]);
      if (!ctx.alive()) return;
      const k = (key, label, cls = '') => `<div class="kpi ${cls}" data-kpi="${key}"><div class="v">${esc(s[key] ?? 0)}</div><div class="l">${label}</div></div>`;
      sumEl.innerHTML = `<div class="card"><div class="row between"><h3>${esc(courses[cur] || cur)}</h3><span class="badge" data-scope>${esc(s.scope === 'organization' ? 'Tashkilot' : s.scope === 'department' ? 'O\'z bo\'limi' : s.scope === 'instructor' ? 'Instruktor kurslari' : s.scope || '')}</span></div>
        <div class="kpis">${k('assigned_count', 'Tayinlangan')}${k('completed_count', 'Tugallangan', 'green')}${k('in_progress_count', 'Jarayonda')}${k('not_started_count', 'Boshlanmagan')}${k('overdue_count', 'Muddati o\'tgan', 'red')}${k('cancelled_count', 'Bekor qilingan')}</div>
        <div class="small muted" style="margin-top:8px">Majburiy darslar: <b>${esc(s.total_required_lessons)}</b> · O'rtacha progress: <b data-avg>${esc(s.average_progress)}%</b> (server hisobi; optional va draft darslar kirmaydi)</div></div>`;
      const ids = rows.rows.map(x => x.employee_id);
      const em = ids.length ? Object.fromEntries((await API.list('employees', { select: 'id,first_name,last_name,employee_code', in: { id: ids }, all: true, count: false })).rows.map(e => [e.id, e])) : {};
      listEl.innerHTML = table(rows.rows, [
        { h: 'Xodim', r: x => em[x.employee_id] ? `<a href="#/compliance/employee/${x.employee_id}">${esc([em[x.employee_id].first_name, em[x.employee_id].last_name].filter(Boolean).join(' ') || em[x.employee_id].employee_code)}</a>` : '<span class="tiny">ko\'rinmaydi</span>' },
        { h: 'Tayinlash holati', r: x => badge('p3', x.status) }, { h: 'Muddat', r: x => fmtDate(x.due_date) }, { h: 'Tugallangan', r: x => fmtDate(x.completed_at) }],
        { id: 'progress_rows', empty: 'Bu kurs bo\'yicha tayinlash yo\'q' }) + (rows.count > 25 ? UI.pager(+(ctx.query.page || 0), 25, rows.count) : `<div class="pager">${rows.count} ta</div>`)
        + '<div class="tiny muted" style="padding:6px">Xodim bo\'yicha batafsil (dars progressi, compliance) — xodim nomini bosing.</div>';
      listEl.addEventListener('click', e => { const b = e.target.closest('[data-page]'); if (b && !b.disabled) { ctx.setQuery({ page: b.getAttribute('data-page') }); ADMIN.render(); } });
    } catch (e) { if (ctx.alive()) { sumEl.innerHTML = `<div class="card">${errorBox(API.friendly(e))}<button class="btn sm" data-retry>Qayta urinish</button></div>`; listEl.hidden = true;
      sumEl.querySelector('[data-retry]').onclick = () => ADMIN.render(); } }
  });
})();

</script>
<script>/* js/admin/pages_skills.js */
/* Phase 3 (007c): Skills, Competency Requirements, Skill Assessments.
   Barcha yozish amallari faqat RPC orqali (upsert_skill / archive_skill / set_competency_requirement / archive_competency_requirement /
   record_skill_assessment). Baholash tarixi — faqat qo'shiladi (insert-only), tahrirlash/o'chirish UI'da yo'q. */
(function () {
  const { esc, badge, table, empty, errorBox, fmtDT, toast, dialog } = UI;
  const { listPage, lookup } = ADMINLIB;
  const TARGETS = [['department', 'Bo\'lim'], ['position', 'Lavozim'], ['specialty', 'Mutaxassislik'], ['role', 'Rol']];
  const TLABEL = Object.fromEntries(TARGETS);
  const ROLES = ['employee', 'department_head', 'instructor', 'hr', 'education_manager', 'medical_reviewer', 'content_author'];
  const tabs = cur => `<div class="tabs">${[['skills', 'Ko\'nikmalar'], ['requirements', 'Talablar'], ['assessments', 'Baholashlar']]
    .map(([k, l]) => `<a href="#/skills/${k}" class="${k === cur ? 'on' : ''}">${l}</a>`).join('')}</div>`;
  const rpc = async (fn, args, msg) => { try { await API.rpc(fn, args); ADMINLIB.clearCache && ADMINLIB.clearCache(); toast(msg); ADMIN.render(); return true; } catch (e) { toast(API.friendly(e).message, true); return false; } };
  const empName = e => [e.first_name, e.last_name].filter(Boolean).join(' ') || e.employee_code || 'Xodim';
  async function empMap(ids) {
    ids = [...new Set(ids.filter(Boolean))];
    if (!ids.length) return {};
    return Object.fromEntries((await API.list('employees', { select: 'id,first_name,last_name,employee_code', in: { id: ids }, all: true, count: false })).rows.map(e => [e.id, empName(e)]));
  }
  async function skillForm(s) {
    const spec = await lookup('specialties', 'name');
    return dialog({ title: s ? 'Ko\'nikmani tahrirlash' : 'Yangi ko\'nikma', fields: [
      { name: 'code', label: 'Kod', required: true, value: s && s.code, pattern: '[A-Za-z0-9_.\\-]{2,64}', placeholder: 'ECG_READING' },
      { name: 'name', label: 'Nomi', required: true, value: s && s.name },
      { name: 'category', label: 'Kategoriya', value: s && s.category },
      { name: 'specialty', label: 'Mutaxassislik', type: 'select', value: (s && s.specialty_id) || '', options: [['', '—'], ...Object.entries(spec)] },
      { name: 'max', label: 'Maksimal daraja (1–10)', type: 'number', required: true, value: String((s && s.max_level) || 5) },
      { name: 'description', label: 'Tavsif', type: 'textarea', value: s && s.description }], okText: 'Saqlash' });
  }
  const saveSkill = (id, f) => rpc('upsert_skill', { p_id: id || null, p_code: f.code, p_name: f.name, p_description: f.description || null, p_category: f.category || null,
    p_specialty: f.specialty || null, p_max_level: +f.max }, 'Ko\'nikma saqlandi');

  // ---------------- Ko'nikmalar ----------------
  ADMIN.route('/skills/skills', 'skills', async (el, ctx) => {
    const spec = await lookup('specialties', 'name');
    const canM = PERMS.can('skill.manage');
    await listPage(el, ctx, {
      title: 'Skills', id: 'skills', top: tabs('skills'), sub: 'Klinik ko\'nikmalar katalogi (007c). Arxivlangan ko\'nikma yangi talab va baholashda ishlatilmaydi.',
      actions: canM ? '<button class="btn primary" data-new-skill>+ Ko\'nikma</button>' : '',
      filters: [{ key: 's', type: 'search', label: 'Kod yoki nomi' }, { key: 'st', type: 'select', label: 'Holat', options: [['active', 'Faol'], ['archived', 'Arxiv']] }],
      load: q => API.list('skills', { select: 'id,code,name,description,category,specialty_id,max_level,status,updated_at', eq: { status: q.st }, search: { cols: ['name', 'code'], q: q.s }, order: ['name', true], page: q.page, size: q.size }),
      columns: [{ h: 'Ko\'nikma', r: x => `<b>${esc(x.name)}</b><div class="sub mono">${esc(x.code)}</div>` }, { h: 'Kategoriya', r: x => esc(x.category || '—') },
        { h: 'Mutaxassislik', r: x => esc(spec[x.specialty_id] || '—') }, { h: 'Maks.', r: x => `<b>${x.max_level}</b>` }, { h: 'Holat', r: x => badge('p3', x.status) },
        { h: '', r: x => canM && x.status === 'active' ? `<button class="btn sm" data-edit-skill="${x.id}">Tahrirlash</button> <button class="btn sm red" data-archive-skill="${x.id}">Arxivlash</button>` : '' }],
      empty: 'Ko\'nikma yo\'q',
    });
    const nb = el.querySelector('[data-new-skill]');
    if (nb) nb.onclick = async () => { const f = await skillForm(null); if (f) await saveSkill(null, f); };
    el.querySelector('[data-list]').addEventListener('click', async e => {
      const ed = e.target.closest('[data-edit-skill]'), ar = e.target.closest('[data-archive-skill]');
      if (ed) { const s = await API.get('skills', 'id', ed.getAttribute('data-edit-skill'), 'id,code,name,description,category,specialty_id,max_level'); const f = s && await skillForm(s); if (f) await saveSkill(s.id, f); }
      if (ar) { const f = await dialog({ title: 'Ko\'nikmani arxivlash', body: 'Mavjud baholash tarixi saqlanadi.', fields: [{ name: 'reason', label: 'Sabab', type: 'textarea', required: true }], okText: 'Arxivlash', danger: true });
        if (f) await rpc('archive_skill', { p_id: ar.getAttribute('data-archive-skill'), p_reason: f.reason }, 'Ko\'nikma arxivlandi'); }
    });
  });

  // ---------------- Competency Requirements ----------------
  ADMIN.route('/skills/requirements', 'skills', async (el, ctx) => {
    const [skills, deps, pos, spec] = await Promise.all([lookup('skills', 'name'), lookup('departments', 'name'), lookup('positions', 'name'), lookup('specialties', 'name')]);
    const canM = PERMS.can('competency.manage');
    const tname = r => r.target_type === 'department' ? deps[r.department_id] : r.target_type === 'position' ? pos[r.position_id] : r.target_type === 'specialty' ? spec[r.specialty_id] : (PERMS.ROLE_LABEL[r.target_role] || r.target_role);
    await listPage(el, ctx, {
      title: 'Competency Requirements', id: 'requirements', top: tabs('requirements'),
      sub: 'Bo\'lim / lavozim / mutaxassislik / rol uchun talab qilinadigan daraja. Bir nechta talab mos kelsa, server eng yuqorisini oladi.',
      actions: canM ? '<button class="btn primary" data-new-req>+ Talab</button>' : '',
      filters: [{ key: 'sk', type: 'select', label: 'Ko\'nikma', options: Object.entries(skills) }, { key: 'st', type: 'select', label: 'Holat', options: [['active', 'Faol'], ['archived', 'Arxiv']] }],
      load: q => API.list('competency_requirements', { select: 'id,skill_id,target_type,department_id,position_id,specialty_id,target_role,required_level,status,updated_at', eq: { skill_id: q.sk, status: q.st }, order: ['updated_at', false], page: q.page, size: q.size }),
      columns: [{ h: 'Ko\'nikma', r: x => `<b>${esc(skills[x.skill_id] || '—')}</b>` }, { h: 'Nishon', r: x => `<span class="badge">${esc(TLABEL[x.target_type])}</span> ${esc(tname(x) || '—')}` },
        { h: 'Talab darajasi', r: x => `<b data-level>${x.required_level}</b>` }, { h: 'Holat', r: x => badge('p3', x.status) }, { h: 'Yangilangan', r: x => fmtDT(x.updated_at) },
        { h: '', r: x => canM && x.status === 'active' ? `<button class="btn sm red" data-archive-req="${x.id}">Arxivlash</button>` : '' }],
      empty: 'Talab yo\'q',
    });
    const nb = el.querySelector('[data-new-req]');
    if (nb) nb.onclick = async () => {
      const active = (await API.list('skills', { select: 'id,name,max_level', eq: { status: 'active' }, order: ['name', true], all: true, count: false })).rows;
      if (!active.length) { toast('Avval faol ko\'nikma yarating', true); return; }
      const t = await dialog({ title: 'Kompetensiya talabi', fields: [{ name: 'skill', label: 'Ko\'nikma', type: 'select', required: true, options: active.map(s => [s.id, `${s.name} (maks. ${s.max_level})`]) },
        { name: 'type', label: 'Nishon turi', type: 'select', required: true, options: TARGETS }], okText: 'Davom etish' });
      if (!t) return;
      const options = t.type === 'role' ? ROLES.map(r => [r, PERMS.ROLE_LABEL[r] || r]) : Object.entries(t.type === 'department' ? deps : t.type === 'position' ? pos : spec);
      if (!options.length) { toast('Tanlash uchun ' + TLABEL[t.type].toLowerCase() + ' topilmadi', true); return; }
      const f = await dialog({ title: 'Talab: ' + TLABEL[t.type], body: 'Agar shu nishon uchun faol talab bo\'lsa, server darajasini yangilaydi.', fields: [{ name: 'target', label: TLABEL[t.type], type: 'select', required: true, options },
        { name: 'level', label: 'Talab darajasi', type: 'number', required: true, value: '3' }], okText: 'Saqlash' });
      if (f) await rpc('set_competency_requirement', { p_skill: t.skill, p_target_type: t.type, p_target_id: f.target, p_required_level: +f.level }, 'Talab saqlandi');
    };
    el.querySelector('[data-list]').addEventListener('click', async e => {
      const ar = e.target.closest('[data-archive-req]'); if (!ar) return;
      const f = await dialog({ title: 'Talabni arxivlash', fields: [{ name: 'reason', label: 'Sabab', type: 'textarea', required: true }], okText: 'Arxivlash', danger: true });
      if (f) await rpc('archive_competency_requirement', { p_id: ar.getAttribute('data-archive-req'), p_reason: f.reason }, 'Talab arxivlandi');
    });
  });

  // ---------------- Skill Assessments (insert-only tarix) ----------------
  ADMIN.route('/skills/assessments', 'skills', async (el, ctx) => {
    const skills = await lookup('skills', 'name');
    const canA = PERMS.can('skill.assess');
    let em = {};
    await listPage(el, ctx, {
      title: 'Skill Assessments', id: 'assessments', top: tabs('assessments'),
      sub: 'Baholash tarixi faqat qo\'shiladi — eski yozuvlar o\'zgartirilmaydi. Joriy daraja = eng so\'nggi baholash (server).',
      actions: canA ? '<button class="btn primary" data-new-asm>+ Baholash</button>' : '',
      filters: [{ key: 'sk', type: 'select', label: 'Ko\'nikma', options: Object.entries(skills) }],
      load: async q => { const r = await API.list('skill_assessments', { select: 'id,skill_id,employee_id,assessor_id,level,notes,assessed_at', eq: { skill_id: q.sk }, order: ['assessed_at', false], page: q.page, size: q.size });
        em = await empMap(r.rows.map(x => x.employee_id)); return r; },
