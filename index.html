    return roleBox + V.profile(id);
  };

  V.departments = function () {
    const o = Analytics.org(Auth.visibleEmployees());
    return `<h1>Bo'limlar</h1><div class="grid g3">${o.depts.map((d) => `<a class="card" href="#dept-${encodeURIComponent(d.name)}" style="color:inherit"><div class="row between"><h3 style="margin:0">${e(d.name)}</h3><span class="badge">${d.n} xodim</span></div>
      <div class="kv small" style="grid-template-columns:1fr auto;margin-top:10px"><div>O'rtacha score</div><div><b>${UI.pct(d.avg)}</b></div><div>Majburiy kurslar</div><div><b>${d.mandatoryPct}%</b></div><div>Failed exams</div><div><b>${d.failed}</b></div><div>Overdue training</div><div><b>${d.overdue}</b></div></div></a>`).join("")}</div>`;
  };

  V.catalog = function () {
    return `<h1>Kurslar katalogi</h1><p class="muted">Kurslar, modullar va imtihon qoidalari. Yangi mutaxassislik (Clinical Academy) kurslari shu tuzilma bo'yicha qo'shiladi.</p>
      <div class="card tablewrap"><table class="t"><tr><th>Kurs</th><th>Kimlar uchun</th><th>Soha</th><th>Modul/Dars</th><th>Savollar banki</th><th>Imtihon</th><th></th></tr>${S.COURSES.map((c) => { const cfg = Content.examCfg(c.id);
        return `<tr><td><div class="row" style="gap:8px"><span class="cic" style="background:${c.color}18;width:34px;height:34px;font-size:17px">${c.icon}</span><div><b>${e(c.title)}</b><div class="tiny">${e(c.subtitle)}</div></div></div></td>
        <td class="small">${c.core ? "Barcha xodimlar" : c.academy ? c.academy.map((a) => e(S.ACADEMIES[a])).join(", ") : "Mutaxassislik: " + e((c.specialty || []).join(", "))}</td><td class="small">${e(S.DOMAINS[c.domain])}</td>
        <td class="small">${c.modules.length} / ${c.modules.reduce((a, m) => a + m.lessons.length, 0)}</td><td class="small">${Content.questions(c.id).length} ta</td><td class="small">${cfg.count} savol · ${cfg.time} daq · ${cfg.pass}%</td>
        <td><div class="row" style="gap:4px"><a class="btn sm" href="#course-${c.id}">Ko'rish</a>${Auth.can("exams.configure") ? `<button class="btn sm" onclick="A.examCfgModal('${c.id}')">⚙ Qoidalar</button>` : ""}</div></td></tr>`; }).join("")}</table></div>`;
  };

  V.questionBank = function () {
    const fc = window.APP.qbCourse || "ETHICS";
    if (Store.mode === "live" && !Content._admin) { setTimeout(() => window.A.loadQB(), 0); return `<h1>Savollar banki</h1><div class="card empty">Yuklanmoqda…</div>`; }
    const qs = Content.questions(fc, null, true);
    return `<div class="row between"><h1>Savollar banki</h1>${Auth.can("courses.manage") ? `<button class="btn primary" onclick="A.addQuestionModal('${fc}')">+ Savol qo'shish</button>` : ""}</div>
      <div class="row" style="margin-bottom:12px"><select style="max-width:340px" onchange="A.setQB(this.value)">${S.COURSES.map((c) => `<option value="${c.id}" ${c.id === fc ? "selected" : ""}>${e(c.title)} (${Content.questions(c.id, null, true).length})</option>`).join("")}</select>
      <span class="tiny">Savol turlari: single, multiple, true/false, matching, clinical case, short answer · Image/ECG/Lab-based — keyingi bosqich (fayl yuklash)</span></div>
      <div class="card tablewrap"><table class="t"><tr><th>ID</th><th>Savol</th><th>Turi</th><th>Mavzu</th><th>Modul</th><th>Holat</th><th></th></tr>${qs.map((q) => `<tr><td class="tiny">${q.id}</td><td class="small" style="max-width:420px">${e(q.q)}</td><td><span class="badge">${q.type}</span></td><td class="small">${e(q.topic)}</td><td class="tiny">${q.module}</td>
        <td>${q.status === "approved" ? `<span class="badge b-green">approved</span>` : `<span class="badge b-amber">${q.status}${q.ai ? " · AI" : ""}</span>`}</td><td>${q.status !== "approved" && Auth.can("questions.approve") ? `<button class="btn green sm" onclick="A.approveQ('${q.id}')">Tasdiqlash</button>` : ""}</td></tr>`).join("")}</table></div>`;
  };

  V.examsAdmin = function () {
    const at = Store.all("attempts").filter((a) => a.kind === "final" && Auth.canSee(Store.find("employees", a.empId))).sort((a, b) => b.finishedAt.localeCompare(a.finishedAt)).slice(0, 80);
    return `<h1>Imtihonlar</h1><p class="muted">Yakuniy imtihon urinishlari. Urinishlar tugagan xodimga urinishlarni tiklash mumkin.</p>
      <div class="card tablewrap"><table class="t"><tr><th>Sana</th><th>Xodim</th><th>Kurs</th><th>Natija</th><th>Holat</th><th></th></tr>${at.map((a) => { const x = Store.find("employees", a.empId); const el = Exam.eligibility(x, a.courseId);
        return `<tr><td class="small">${U.fmtDate(a.finishedAt)}</td><td><a href="#emp-${x.id}">${UI.name(x)}</a></td><td class="small">${e(Content.course(a.courseId).title)}</td><td><b>${a.score}%</b></td><td>${a.passed ? `<span class="badge b-green">PASSED</span>` : `<span class="badge b-red">FAILED</span>`}</td>
        <td>${!a.passed && !el.ok && Auth.can("exams.configure") ? `<button class="btn sm" onclick="A.resetAttempts('${x.id}','${a.courseId}')">Urinishlarni tiklash</button>` : ""}</td></tr>`; }).join("")}</table></div>`;
  };

  V.certsAdmin = function () {
    const l = Store.all("certificates").filter((c) => Auth.canSee(Store.find("employees", c.empId))).sort((a, b) => b.issuedAt.localeCompare(a.issuedAt));
    return `<h1>Sertifikatlar</h1><div class="card tablewrap"><table class="t"><tr><th>ID</th><th>Xodim</th><th>Kurs</th><th>Ball</th><th>Berilgan</th><th>Muddat</th><th>Holat</th><th></th></tr>${l.map((c) => { const st = Cert.status(c); return `<tr><td class="small"><a href="#cert-${c.id}">${e(c.id)}</a></td><td>${e(c.name)}</td><td class="small">${e(c.courseTitle)}</td><td>${c.score}%</td><td class="small">${U.fmtDate(c.issuedAt)}</td><td class="small">${U.fmtDate(c.expiresAt)}</td><td><span class="badge ${st === "Amalda" ? "b-green" : "b-red"}">${st}</span></td><td>${!c.revoked && Auth.can("exams.configure") ? `<button class="btn sm" onclick="A.revoke('${c.id}')">Bekor qilish</button>` : ""}</td></tr>`; }).join("")}</table></div>`;
  };

  V.reports = function () {
    const emps = Auth.visibleEmployees(); const lines = AI.orgReport(emps); const o = Analytics.org(emps);
    const sel = window.APP.aiEmp || "doctor"; const target = Store.find("employees", sel) || emps[0]; const ai = target ? AI.analyze(target, 5) : null;
    return `<h1>Hisobotlar va AI assistant</h1>
      <div class="card ai-box"><h3>🤖 Rahbariyat uchun avtomatik hisobot</h3><ul>${lines.map((l) => `<li>${e(l)}</li>`).join("")}</ul><button class="btn sm" onclick="A.copy(${JSON.stringify(lines.join("\n")).replace(/"/g, "&quot;")})">📋 Nusxalash</button></div>
      <div class="card" style="margin-top:16px"><h3>Xodim bo'yicha tahlil: "oxirgi 5 ta testini tahlil qil"</h3><select style="max-width:360px" onchange="A.setAiEmp(this.value)">${emps.filter((x) => x.status === "active").map((x) => `<option value="${x.id}" ${target && x.id === target.id ? "selected" : ""}>${UI.name(x)} — ${e(x.department)}</option>`).join("")}</select>
        ${ai ? `<div class="ai-box card" style="margin-top:12px"><p><b>${UI.name(target)}:</b> ${e(ai.feedback)}</p>${ai.weak.length ? `<div class="small"><b>Zaif mavzular:</b> ${ai.weak.map((w) => `${e(w.topic)} (${w.pct}%)`).join(", ")}</div>` : ""}${ai.weakDomains.length ? `<div class="small"><b>Zaif sohalar:</b> ${ai.weakDomains.map(e).join(", ")}</div>` : ""}
        ${ai.plan.length ? `<ol class="small">${ai.plan.map((p) => `<li>${e(p.topic)} — ${e(p.course)}: ${e(p.action)}</li>`).join("")}</ol>` : ""}</div>` : ""}</div>
      <div class="card" style="margin-top:16px"><h3>AI kontent siyosati</h3><p class="small muted">AI generatsiya qilgan savol va klinik case'lar <b>draft</b> holatida saqlanadi va Education Manager tasdiqlamaguncha majburiy o'quv materiali sifatida ishlatilmaydi. Joriy MVP'da tahlil qoidaga asoslangan; LLM orqali savol/case generatsiyasi keyingi bosqichda server tomonida ulanadi.</p></div>
      <div class="card tablewrap" style="margin-top:16px"><h3>Bo'limlar kesimida</h3><table class="t"><tr><th>Bo'lim</th><th>Xodimlar</th><th>O'rtacha</th><th>Majburiy %</th><th>Failed</th><th>Overdue</th></tr>${o.depts.map((d) => `<tr><td>${e(d.name)}</td><td>${d.n}</td><td><b>${UI.pct(d.avg)}</b></td><td>${d.mandatoryPct}%</td><td>${d.failed}</td><td>${d.overdue}</td></tr>`).join("")}</table></div>`;
  };

  V.analytics = function () {
    const emps = Auth.visibleEmployees().filter((x) => x.status === "active"); const S2 = emps.map((x) => ({ x, s: Score.overall(x) })).filter((r) => r.s != null);
    const lv = Content.settings().levels; const dist = lv.map((l) => ({ l, n: S2.filter((r) => Score.level(r.s).id === l.id).length }));
    const domAvg = Object.keys(S.DOMAINS).map((d) => { const v = emps.map((x) => Score.domains(x)[d]).filter((v) => v != null); return [d, v.length ? Math.round(U.avg(v)) : null]; });
    const courseStats = S.COURSES.map((c) => { const a = Store.all("attempts").filter((t) => t.kind === "final" && t.courseId === c.id); return { c, n: a.length, pass: a.length ? Math.round((a.filter((t) => t.passed).length / a.length) * 100) : null, avg: a.length ? Math.round(U.avg(a.map((t) => t.score))) : null }; });
    const max = Math.max(1, ...dist.map((d) => d.n));
    return `<h1>Analytics</h1><div class="grid g2"><div class="card"><h3>Level taqsimoti</h3>${dist.map((d) => `<div class="hbar"><span>${d.l.icon} ${d.l.name}</span>${UI.bar((d.n / max) * 100)}<b>${d.n}</b></div>`).join("")}</div>
      <div class="card"><h3>Sohalar bo'yicha o'rtacha</h3>${domAvg.map(([d, v]) => `<div class="hbar"><span class="small">${e(S.DOMAINS[d])}</span>${UI.bar(v, v != null && v < 70 ? "r" : "")}<b>${UI.pct(v)}</b></div>`).join("")}</div></div>
      <div class="card tablewrap" style="margin-top:16px"><h3>Kurslar bo'yicha imtihon natijalari</h3><table class="t"><tr><th>Kurs</th><th>Urinishlar</th><th>Pass rate</th><th>O'rtacha ball</th></tr>${courseStats.map((s) => `<tr><td>${s.c.icon} ${e(s.c.title)}</td><td>${s.n}</td><td style="min-width:140px">${s.pass == null ? "—" : UI.bar(s.pass, s.pass < 70 ? "r" : "g") + `<span class="tiny">${s.pass}%</span>`}</td><td>${UI.pct(s.avg)}</td></tr>`).join("")}</table></div>`;
  };

  V.settings = function () {
    const s = Content.settings();
    return `<h1>Sozlamalar</h1><div class="grid g2"><div class="card"><h3>Employee Score vaznlari</h3><form onsubmit="A.saveWeights(event)">${Object.keys(S.DOMAINS).map((d) => `<div class="row" style="margin:6px 0"><span class="grow small">${e(S.DOMAINS[d])}</span><input name="${d}" type="number" min="0" max="100" value="${s.weights[d]}" style="width:90px" oninput="A.sumW(this.form)"> %</div>`).join("")}
        <div class="row" style="margin-top:10px"><b id="wsum">Jami: ${Object.values(s.weights).reduce((a, b) => a + b, 0)}%</b><div class="grow"></div><button class="btn primary" ${Auth.can("settings.edit") ? "" : "disabled"}>Saqlash</button></div></form></div>
      <div class="card"><h3>Level chegaralari</h3><form onsubmit="A.saveLevels(event)">${s.levels.map((l) => `<div class="row" style="margin:6px 0"><span class="grow">${l.icon} ${l.name}</span>min <input name="${l.id}" type="number" min="0" max="100" value="${l.min}" style="width:90px"></div>`).join("")}
        <div class="row" style="margin-top:10px"><div class="grow"></div><button class="btn primary" ${Auth.can("settings.edit") ? "" : "disabled"}>Saqlash</button></div></form></div>
      <div class="card"><h3>Curriculum qoidalari</h3><form onsubmit="A.saveMisc(event)"><label>Initial assessment: shu baldan past soha → "Recommended training"</label><input name="recommendBelow" type="number" value="${s.recommendBelow}">
        <label>Majburiy kurslar muddati (kun, ish boshlagan sanadan)</label><input name="dueDays" type="number" value="${s.dueDays}"><label>Tashkilot nomi</label><input name="org" value="${e(s.org)}">
        <div class="row" style="margin-top:10px"><div class="grow"></div><button class="btn primary" ${Auth.can("settings.edit") ? "" : "disabled"}>Saqlash</button></div></form></div>
      <div class="card"><h3>Tillar</h3><p class="small">🇺🇿 O'zbek (lotin) — faol<br>🇷🇺 Русский — keyingi bosqich<br>🇬🇧 English — keyingi bosqich</p><p class="tiny">Interfeys matnlari i18n kalitlariga ajratiladi; kurs kontenti har bir til uchun alohida versiya sifatida saqlanadi.</p>
        ${Store.mode === "demo" ? `<button class="btn red sm" onclick="A.resetDemo()">Demo ma'lumotlarni tiklash</button>` : ""}</div></div>
      ${Auth.can("audit.view") ? `<div class="card tablewrap" style="margin-top:16px"><h3>Audit log (oxirgi 30)</h3><table class="t"><tr><th>Vaqt</th><th>Foydalanuvchi</th><th>Harakat</th><th>Tafsilot</th></tr>${Store.all("audit").slice(-30).reverse().map((a) => { const x = Store.find("employees", a.uid); return `<tr><td class="tiny">${new Date(a.at).toLocaleString("uz-UZ")}</td><td class="small">${x ? UI.name(x) : "—"}</td><td><span class="badge">${e(a.action)}</span></td><td class="tiny">${e(JSON.stringify(a.details))}</td></tr>`; }).join("") || `<tr><td colspan="4" class="empty">Hali yozuv yo'q</td></tr>`}</table></div>` : ""}`;
  };
})();

</script>
<script>/* js/app.js */
/* MedAcademy app: router, layout, actions */
(function () {
  const { U, Store, Content, Auth, ROLES, Curriculum, Exam, Cert, Score, Skills, Notify, Initial, SupaAdapter, audit } = window.MA;
  const S = window.SEED; const e = U.esc;
  const APP = window.APP = { liveAvailable: false, exam: null, timer: null, openLesson: null, filter: "", verifyResult: null };
  const root = () => document.getElementById("root");
  const ss = { get(k) { try { return sessionStorage.getItem(k); } catch (x) { return null; } }, set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (x) {} } };

  APP.verifyUrl = (code) => location.origin + location.pathname + "?verify=" + encodeURIComponent(code);

  /* ---------------- navigation ---------------- */
  const NAV_EMP = [["dashboard", "📊", "Dashboard"], ["courses", "📚", "My Courses"], ["exams", "📝", "My Exams"], ["certificates", "🎓", "My Certificates"], ["skills", "🧪", "My Skills"], ["results", "📈", "My Results"], ["leaderboard", "🏆", "Reyting"], ["notifications", "🔔", "Notifications"], ["profile", "👤", "Profile"]];
  const NAV_ADMIN = [["dashboard", "📊", "Dashboard"], ["employees", "👥", "Employees"], ["departments", "🏢", "Departments"], ["catalog", "📚", "Courses"], ["questions", "❓", "Question Bank"], ["exams-admin", "📝", "Exams"], ["certs-admin", "🎓", "Certificates"], ["reports", "🤖", "Reports & AI"], ["analytics", "📈", "Analytics"], ["settings", "⚙️", "Settings"]];
  function navFor(emp) {
    const r = emp.role;
    if (r === "employee") return [["", NAV_EMP]];
    let admin = NAV_ADMIN;
    if (r === "department_head") admin = [["dashboard", "📊", "Bo'lim dashboard"], ["employees", "👥", "Bo'lim xodimlari"], ["reports", "🤖", "Reports & AI"], ["catalog", "📚", "Courses"]];
    if (r === "instructor") admin = [["dashboard", "🧪", "Skill assessment"], ["employees", "👥", "Employees"], ["catalog", "📚", "Courses"], ["questions", "❓", "Question Bank"], ["reports", "🤖", "AI tahlil"]];
    if (r === "hr") admin = NAV_ADMIN.filter(([k]) => !["questions", "settings"].includes(k));
    return [["Boshqaruv", admin], ["Mening o'qishim", NAV_EMP.filter(([k]) => k !== "dashboard")]];
  }

  function layout(inner, route) {
    const me = Auth.current; const unread = Notify.unread(me.id); const pos = Content.position(me.positionId);
    const groups = navFor(me);
    return `${Store.mode === "demo" ? `<div class="demo-banner">🧪 Demo rejim — ma'lumotlar faqat shu brauzerda. <a href="javascript:A.logout()">Rolni almashtirish</a></div>` : ""}
    <div class="app"><aside class="side" id="side"><div class="brand"><div class="logo">M</div><div><b>MedAcademy</b><span>${e(Content.settings().org)}</span></div></div>
      <nav class="nav">${groups.map(([t, items]) => `${t ? `<div class="sec">${t}</div>` : ""}${items.map(([k, i, l]) => `<a href="#${k}" class="${route === k || (route.startsWith("course-") && k === "courses") || (route.startsWith("emp-") && k === "employees") ? "on" : ""}"><span>${i}</span>${l}${k === "notifications" && unread ? `<span class="cnt">${unread}</span>` : ""}</a>`).join("")}`).join("")}
      <div class="sec"></div><a href="javascript:A.logout()"><span>🚪</span>Chiqish</a></nav></aside>
    <main class="main"><div class="top"><button class="btn ghost burger" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <div class="who"><div style="text-align:right"><b class="small">${UI.name(me)}</b><div class="tiny">${e(ROLES[me.role])}${pos ? " · " + e(pos.name) : ""}</div></div>${UI.avatar(me)}</div></div>
      <div class="content">${inner}</div></main></div>`;
  }

  /* ---------------- router ---------------- */
  function route() {
    const r = decodeURIComponent((location.hash || "").replace(/^#\/?/, ""));
    clearInterval(APP.timer);
    const q = new URLSearchParams(location.search).get("verify");
    if (q && !r) { A.verifyCode(q); return; }
    if (r === "verify" || r.startsWith("verify-")) { root().innerHTML = V.verify(r.slice(7)); return; }
    const me = Auth.current;
    if (!me) { root().innerHTML = V.landing(); return; }
    if (me.status === "pending" || me.status === "rejected") { root().innerHTML = V.pending(me); return; }
    if (!me.onboarded) {
      if (APP.exam && APP.exam.att.kind === "initial") { root().innerHTML = `<div class="content" style="max-width:1000px;margin:0 auto">${V.exam()}</div>`; return; }
      if (APP.initialDone) { root().innerHTML = V.initialResult(me, APP.initialDone); return; }
      root().innerHTML = V.onboarding(me, APP.obStep || 1); return;
    }
    if (APP.initialDone && r === "welcome") { root().innerHTML = V.initialResult(me, APP.initialDone); return; }
    let html; const [base, ...rest] = r.split("-"); const arg = rest.join("-");
    const guard = (perm) => Auth.can(perm) || Auth.can("employees.view_dept");
    try {
      switch (base || "dashboard") {
        case "dashboard": APP.initialDone = null; html = V.dashboard(); break;
        case "courses": html = V.myCourses(); break;
        case "course": html = V.course(arg); break;
        case "exam": html = V.exam(); setTimeout(startTimer, 0); break;
        case "result": html = V.examResult(); break;
        case "exams": html = arg === "admin" && Auth.can("exams.configure") ? V.examsAdmin() : V.myExams(); break;
        case "certificates": html = V.myCerts(); break;
        case "certs": html = Auth.isStaffAdmin() ? V.certsAdmin() : V.myCerts(); break;
        case "cert": html = V.cert(arg); break;
        case "skills": html = V.mySkills(); break;
        case "results": html = V.myResults(); break;
        case "leaderboard": html = V.leaderboard(); break;
        case "notifications": html = V.notifications(); break;
        case "profile": html = V.profile(); break;
        case "employees": html = guard("employees.view_all") ? V.employees() : denied(); break;
        case "emp": html = V.empAdmin(arg); break;
        case "departments": html = Auth.can("employees.view_all") ? V.departments() : denied(); break;
        case "dept": html = guard("employees.view_all") ? V.deptDashboard(arg) : denied(); break;
        case "catalog": html = Auth.isStaffAdmin() ? V.catalog() : denied(); break;
        case "questions": html = Auth.can("courses.manage") ? V.questionBank() : denied(); break;
        case "reports": html = Auth.can("ai.use") ? V.reports() : denied(); break;
        case "analytics": html = Auth.can("reports.view") ? V.analytics() : denied(); break;
        case "settings": html = Auth.isStaffAdmin() ? V.settings() : denied(); break;
        default: html = V.dashboard();
      }
    } catch (err) { console.error(err); html = `<div class="card"><b>Xatolik:</b> ${e(err.message)}</div>`; }
    root().innerHTML = layout(html, r || "dashboard");
    window.scrollTo(0, 0);
  }
  const denied = () => `<div class="card empty">🔒 Bu bo'limga ruxsatingiz yo'q</div>`;
  APP.render = route;

  function startTimer() {
    clearInterval(APP.timer); if (!APP.exam || !APP.exam.att.deadline) return;
    const tick = () => { const el = document.getElementById("timer"); const left = Math.max(0, new Date(APP.exam.att.deadline) - Date.now());
      if (el) { const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000); el.textContent = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0"); el.classList.toggle("low", left < 60000); }
      if (left <= 0) { clearInterval(APP.timer); UI.toast("Vaqt tugadi — imtihon avtomatik yakunlandi"); A.finishExam(true); } };

    async addQuestion(ev, cid) {
      ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target)); const lines = f.o.split("\n").map((s) => s.trim()).filter(Boolean);
      const q = { id: U.uid("CQ"), course: cid, module: f.module, type: f.type, topic: f.topic, q: f.q, e: f.e || "", ev: f.ev || "", r: "", status: "draft", createdBy: Auth.current.id, createdAt: U.now() };
      if (["single", "case", "multiple"].includes(f.type)) { q.o = lines.map((l) => l.replace(/^\*\s*/, "")); const idx = lines.map((l, i) => (l.startsWith("*") ? i : -1)).filter((i) => i >= 0); if (!idx.length) return UI.toast("To'g'ri javobni * bilan belgilang", "err"); q.a = f.type === "multiple" ? idx : idx[0]; }
      if (f.type === "tf") { q.o = null; q.a = /^\*\s*to/i.test(lines.find((l) => l.startsWith("*")) || ""); }
      if (f.type === "short") { q.o = null; q.a = lines.map((l) => l.replace(/^\*\s*/, "")); }
      if (Store.mode === "live") {
        const { error } = await SupaAdapter.client.from("questions").insert({ id: q.id, course_id: cid, module_id: q.module, type: q.type, topic: q.topic, stem: q.q,
          options: q.o || null, answer: q.a, explanation: q.e, evidence: q.ev || null, status: "draft" });
        if (error) return UI.toast(error.message, "err");
        await audit("question.create", { id: q.id }); UI.closeModal(); UI.toast("Draft sifatida saqlandi", "ok"); return A.loadQB(true);
      }
      await Store.put("questions_custom", q); await audit("question.create", { id: q.id }); UI.closeModal(); UI.toast("Draft sifatida saqlandi", "ok"); route();
    },
    async approveQ(id) {

        const { error } = await SupaAdapter.client.from("questions").update({ status: "approved" }).eq("id", id);
        if (error) return UI.toast(error.message, "err");
        await audit("question.approve", { id }); UI.toast("Tasdiqlandi", "ok"); return A.loadQB(true);
      }
      const q = Store.find("questions_custom", id); q.status = "approved"; q.approvedBy = Auth.current.id; await Store.put("questions_custom", q); await audit("question.approve", { id }); UI.toast("Tasdiqlandi", "ok"); route();
    },
    async resetAttempts(empId, cid) {
      if (Store.mode === "live") {
        try { await SupaAdapter.rpc("admin_reset_attempts", { p_user: empId, p_course: cid }); } catch (err) { return UI.toast(err.message, "err"); }
        const r = Store.all("resets").find((x) => x.user_id === empId && x.course_id === cid);
        if (r) r.reset_at = U.now(); else Store.all("resets").push({ user_id: empId, course_id: cid, reset_at: U.now() });
        await audit("exam.reset_attempts", { emp: empId, course: cid }); UI.toast("Urinishlar tiklandi", "ok"); return route();
      }
      const id = empId + "_" + cid; const p = Store.find("plans", id) || { id, empId, courseId: cid, reason: "manual", mandatory: true, assignedAt: U.now() }; p.attemptsResetAt = U.now(); p.retakeAfter = null; await Store.put("plans", p); await audit("exam.reset_attempts", { emp: empId, course: cid }); UI.toast("Urinishlar tiklandi", "ok"); route(); },
    async revoke(code) {
      const c = Store.find("certificates", code);
      if (Store.mode === "live") { try { await SupaAdapter.rpc("revoke_certificate", { p_code: code }); } catch (err) { return UI.toast(err.message, "err"); } }
      c.revoked = true; await Store.put("certificates", c); await audit("cert.revoke", { code }); UI.toast("Bekor qilindi"); route(); },
    setAiEmp(v) { APP.aiEmp = v; route(); },

    /* settings */
    sumW(form) { const s = Object.keys(S.DOMAINS).reduce((a, d) => a + Number(form[d].value || 0), 0); document.getElementById("wsum").textContent = "Jami: " + s + "%"; document.getElementById("wsum").style.color = s === 100 ? "" : "var(--red)"; },
    async saveWeights(ev) { ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target)); const w = {}; Object.keys(S.DOMAINS).forEach((d) => (w[d] = Number(f[d] || 0))); const sum = Object.values(w).reduce((a, b) => a + b, 0); if (sum !== 100) return UI.toast("Vaznlar yig'indisi 100% bo'lishi kerak (hozir " + sum + "%)", "err"); await saveSettings({ weights: w }); },
    async saveLevels(ev) { ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target)); const lv = Content.settings().levels.map((l) => Object.assign({}, l, { min: Number(f[l.id]) })); await saveSettings({ levels: lv }); },
    async saveMisc(ev) { ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target)); await saveSettings({ recommendBelow: Number(f.recommendBelow), dueDays: Number(f.dueDays), org: f.org }); },
  };
  async function saveSettings(patch) { const s = Object.assign({ id: "global" }, Store.find("settings", "global") || {}, patch); await Store.put("settings", s); await audit("settings.update", patch); UI.toast("Sozlamalar saqlandi", "ok"); route(); }

  /* ---------------- boot ---------------- */
  async function bootLive(fresh, names) {
    const { data } = await SupaAdapter.client.auth.getSession(); const sess = data && data.session; if (!sess) return false;
    try { await Store.useLive(sess.user.id); } catch (err) { console.error(err); UI.toast("Ma'lumotlar bazasiga ulanishda xato: " + err.message, "err"); return false; }
    let me = Store.find("employees", sess.user.id);
    if (!me) { me = { id: sess.user.id, email: sess.user.email, role: "employee", status: "pending", onboarded: false, points: 0, createdAt: U.now() }; Store.all("employees").push(me); }
    if (names && !me.firstName) Object.assign(me, names);
    if (!me.firstName) { const fn = (sess.user.user_metadata || {}).full_name || ""; const [a, ...b] = fn.split(" "); me.firstName = a || sess.user.email.split("@")[0]; me.lastName = b.join(" "); }
    Auth.current = me; ss.set("ma_mode", "live");
    if (me.positionId && !me.positionName && me.status === "active") { me.positionName = posName(me.positionId); Store.put("employees", me); }
    // tugallanmagan yakuniy imtihonni tiklash (sahifa yangilanganda urinish yo'qolmasin)
    await resumeExam();
    if (fresh) await audit("register", {}); else await audit("login", {});
    route(); return true;
  }
  async function resumeExam() {
    const open = Store.where("attempts", (a) => a.empId === Auth.current.id && !a.finishedAt && a.kind === "final" && !a.preview)[0];
    if (!open) return;
    if (open.deadline && new Date(open.deadline) < new Date()) {
      try { const res = await Exam.submit(open); APP.lastResult = res; UI.toast("Tugallanmagan imtihon vaqti tugagan — saqlangan javoblar bilan baholandi"); route(); } catch (err) { console.warn(err); }
      return;
    }
    if (Store.mode === "live") {
      // server tugallanmagan urinishni (savollar bilan) qaytaradi, yangi urinish ochilmaydi
      try { APP.exam = { att: await Exam.build(Auth.current, open.courseId, null, "final"), i: 0 }; } catch (err) { return UI.toast(err.message, "err"); }
    } else APP.exam = { att: open, i: 0 };
    location.hash = "exam";
  }
  const posName = (id) => { const p = Content.position(id); return p ? p.name : ""; };
  const qFromRow = (r) => ({ id: r.id, course: r.course_id, module: r.module_id, type: r.type, topic: r.topic, difficulty: r.difficulty, q: r.stem, o: r.options,
    a: r.answer, e: r.explanation, ev: r.evidence, r: r.reading, status: r.status, ai: r.ai_generated });

  async function boot() {
    const cfg = window.MEDACADEMY_CONFIG || {};
    APP.liveAvailable = SupaAdapter.init(cfg);
    if (APP.liveAvailable) {
      SupaAdapter.client.auth.onAuthStateChange((evt) => { if (evt === "PASSWORD_RECOVERY") A.newPwModal(); });
      if (ss.get("ma_mode") !== "demo" && (await bootLive())) { window.addEventListener("hashchange", route); return; }
    }
    if (ss.get("ma_mode") === "demo" && ss.get("ma_demo_user")) { Store.useDemo(); Auth.current = Store.find("employees", ss.get("ma_demo_user")); if (Auth.current) resumeExam(); }
    else if (!APP.liveAvailable) Store.useDemo();
    window.addEventListener("hashchange", route); route();
  }
  A.newPwModal = () => UI.modal(`<h3>Yangi parol</h3><form onsubmit="A.setNewPw(event)"><input name="p" type="password" minlength="8" required><div class="row" style="margin-top:12px"><div class="grow"></div><button class="btn primary">Saqlash</button></div></form>`);
  A.setNewPw = async (ev) => { ev.preventDefault(); const { error } = await SupaAdapter.client.auth.updateUser({ password: new FormData(ev.target).get("p") }); UI.closeModal(); UI.toast(error ? error.message : "Parol yangilandi", error ? "err" : "ok"); };
  document.addEventListener("DOMContentLoaded", boot);
})();

</script>
</body>
</html>
