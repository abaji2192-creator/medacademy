<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedAcademy — Medical Staff Training & Assessment Platform</title>
<meta name="description" content="Tibbiyot xodimlarini o'qitish, test qilish, baholash va sertifikatlash platformasi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f8fb; --card:#fff; --ink:#0f172a; --ink2:#475569; --muted:#94a3b8; --line:#e5e9f0;
  --blue:#1565d8; --blue-50:#eaf2ff; --green:#0e9f6e; --green-50:#e7f8f1; --red:#dc2626; --red-50:#fdecec;
  --amber:#d97706; --amber-50:#fff5e6; --violet:#7c3aed; --radius:14px; --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.05);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--font)}
a{color:var(--blue);text-decoration:none}
button{font:inherit;cursor:pointer}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.25;letter-spacing:-.01em}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px}
.muted{color:var(--ink2)} .small{font-size:12.5px} .tiny{font-size:11.5px;color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between} .grow{flex:1}
.grid{display:grid;gap:16px} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h3{margin-bottom:10px}
.stat .v{font-size:28px;font-weight:700;letter-spacing:-.02em} .stat .l{color:var(--ink2);font-size:13px}
.stat .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:var(--blue-50);float:right}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:10px;font-weight:600;font-size:13.5px}
.btn:hover{border-color:#cbd5e1;background:#f8fafc}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff} .btn.primary:hover{background:#0f56bd}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{border-color:transparent;background:transparent} .btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:#eef2f7;color:var(--ink2);white-space:nowrap}
.b-green{background:var(--green-50);color:#047857} .b-red{background:var(--red-50);color:#b91c1c} .b-amber{background:var(--amber-50);color:#b45309} .b-blue{background:var(--blue-50);color:#1d4ed8} .b-violet{background:#f1eafe;color:#6d28d9}
.bar{height:8px;background:#edf1f6;border-radius:99px;overflow:hidden} .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#22b8cf);border-radius:99px}
.bar.g>i{background:linear-gradient(90deg,var(--green),#34d399)} .bar.r>i{background:var(--red)} .bar.a>i{background:var(--amber)}
input,select,textarea{font:inherit;width:100%;padding:9px 12px;border:1px solid #d6dde7;border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #bcd6ff;border-color:var(--blue)}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 5px}
table.t{width:100%;border-collapse:collapse} .t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.t td{padding:10px;border-bottom:1px solid #f0f3f7;vertical-align:middle} .t tr:hover td{background:#fafcff}
.tbl{border-collapse:collapse;margin:8px 0} .tbl td,.tbl th{border:1px solid var(--line);padding:6px 10px;text-align:left}
.tablewrap{overflow-x:auto}

/* layout */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--green));display:grid;place-items:center;color:#fff;font-weight:800}
.brand b{display:block;font-size:15px} .brand span{font-size:11.5px;color:var(--muted)}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink2);font-weight:500;margin:1px 0}
.nav a:hover{background:#f3f6fa;color:var(--ink)} .nav a.on{background:var(--blue-50);color:var(--blue);font-weight:600}
.nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 10px 6px;font-weight:700}
.nav .cnt{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:0 7px}
.main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .who{margin-left:auto;display:flex;gap:10px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--blue-50);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.content{padding:24px;max-width:1280px}
.burger{display:none}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:fixed;left:-270px;width:260px;z-index:20;transition:left .2s;box-shadow:0 0 40px rgba(0,0,0,.15)}.side.open{left:0}.burger{display:inline-flex}.content{padding:16px}.top{padding:10px 14px}}
.demo-banner{background:#fff7e6;border-bottom:1px solid #fde2b3;color:#92400e;font-size:12.5px;padding:6px 24px}

/* landing */
.land{min-height:100vh;background:radial-gradient(1200px 500px at 80% -10%,#dcebff 0,transparent 60%),radial-gradient(900px 400px at -10% 10%,#dcf7ec 0,transparent 55%),#fff}
.land header{display:flex;align-items:center;padding:18px 40px;gap:12px}
.hero{max-width:1100px;margin:30px auto 0;padding:0 24px;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
.hero .k{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--blue);background:var(--blue-50);padding:5px 12px;border-radius:99px}
.hero h1{font-size:44px;margin:16px 0 8px;letter-spacing:-.03em}
.hero .tag{font-size:22px;font-weight:600;background:linear-gradient(90deg,var(--blue),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
@media(max-width:860px){.hero{grid-template-columns:1fr}.hero h1{font-size:32px}.land header{padding:14px 18px}}
.pillars{max-width:1100px;margin:50px auto;padding:0 24px;display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
@media(max-width:1000px){.pillars{grid-template-columns:repeat(2,1fr)}}
.pillar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;box-shadow:var(--shadow)} .pillar .e{font-size:26px} .pillar b{display:block;margin-top:6px;font-size:13px}
.authcard{max-width:440px}
.demo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px} .demo-grid button{text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff} .demo-grid button:hover{border-color:var(--blue);background:var(--blue-50)}
.demo-grid b{display:block;font-size:13px} .demo-grid span{font-size:11.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:#f1f4f8;padding:4px;border-radius:10px;margin-bottom:12px} .tabs button{flex:1;border:0;background:transparent;padding:7px;border-radius:8px;font-weight:600;color:var(--ink2)} .tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}

/* course */
.ccard{display:flex;flex-direction:column;gap:10px} .ccard .hd{display:flex;gap:12px;align-items:flex-start}
.cic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none}
.lesson{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#fff} .lesson .lh{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.lesson .lb{padding:4px 18px 16px;border-top:1px solid #f0f3f7} .lesson .lb ul,.lesson .lb ol{padding-left:20px}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid #cbd5e1;display:grid;place-items:center;font-size:12px;flex:none} .chk.on{background:var(--green);border-color:var(--green);color:#fff}
.note{background:#f0f7ff;border-left:3px solid var(--blue);padding:10px 12px;border-radius:8px;margin:10px 0}
.visual{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0} .visual>div{background:#f4f7fb;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600}

/* exam */
.qcard{max-width:820px} .qnum{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.05em}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;background:#fff}
.opt:hover{border-color:#b8cdf0} .opt.sel{border-color:var(--blue);background:var(--blue-50)} .opt.ok{border-color:var(--green);background:var(--green-50)} .opt.bad{border-color:var(--red);background:var(--red-50)}
.opt .mk{width:22px;height:22px;border-radius:6px;border:2px solid #cbd5e1;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700}
.opt.sel .mk{background:var(--blue);border-color:var(--blue);color:#fff}
.qnav{display:flex;flex-wrap:wrap;gap:6px} .qnav button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600}
.qnav button.ans{background:var(--blue-50);border-color:#b8cdf0} .qnav button.cur{outline:2px solid var(--blue)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px} .timer.low{color:var(--red)}
.vignette{background:#fbfaf5;border:1px solid #efe8cf;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.result-hero{text-align:center;padding:30px} .result-hero .big{font-size:56px;font-weight:800;letter-spacing:-.03em}
.expl{background:#f8fafc;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:13.5px}

/* certificate */
.cert{background:#fff;border:10px solid #eef4ff;outline:1px solid #c9dafc;border-radius:6px;padding:36px 40px;max-width:880px;margin:0 auto;position:relative}
.cert h1{font-size:30px;text-align:center;letter-spacing:.06em;color:#0b3a82} .cert .nm{font-size:30px;font-weight:700;text-align:center;margin:10px 0;color:var(--ink)}
.cert .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:24px;font-size:13px} .cert .meta b{display:block;font-size:14px}
.cert .qr{position:absolute;right:30px;bottom:28px;text-align:center;font-size:10px;color:var(--muted)} .cert .qr img,.cert .qr canvas{width:96px!important;height:96px!important}

/* misc */
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:360px}
.toast.err{background:var(--red)} .toast.ok{background:var(--green)}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:16px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.empty{text-align:center;color:var(--muted);padding:30px}
.kv{display:grid;grid-template-columns:160px 1fr;gap:6px 12px;font-size:13.5px} .kv div:nth-child(odd){color:var(--ink2)}
.lvl{font-weight:700}
.list-item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #f0f3f7} .list-item:last-child{border:0}
.hbar{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.steps{display:flex;gap:6px;margin-bottom:16px} .steps div{flex:1;height:5px;border-radius:99px;background:#e5e9f0} .steps div.on{background:var(--blue)}
.ai-box{background:linear-gradient(135deg,#f5f3ff,#eef6ff);border:1px solid #e0dafc}
pre.code{background:#0f172a;color:#e2e8f0;padding:12px;border-radius:10px;overflow:auto;font-size:12px}

</style>

  const COURSES = [

    {
      id: "ETHICS", title: "Medical Ethics", subtitle: "Tibbiy etika va deontologiya", domain: "ethics",
      core: true, icon: "⚖️", color: "#2563eb", validMonths: 24,
      exam: { count: 10, time: 15, pass: 80, attempts: 3, neg: 0, retakeDays: 2 },
      modules: [
        { id: "ETH1", title: "Etika va deontologiya asoslari", lessons: [
          L("Tibbiy etikaning 4 tamoyili", 8, `<p>Zamonaviy tibbiy etika 4 asosiy tamoyilga tayanadi (Beauchamp & Childress):</p>
<ul><li><b>Avtonomiya</b> — bemor o'z tanasi va davolanishi haqida qaror qabul qilish huquqiga ega. Shifokor ma'lumot beradi, qaror bemorniki.</li>
<li><b>Beneficence (foyda keltirish)</b> — har bir harakat bemor manfaati uchun.</li>
<li><b>Non-maleficence (zarar yetkazmaslik)</b> — "Primum non nocere": foyda xavfdan yuqori bo'lishi kerak.</li>
<li><b>Adolat</b> — resurslar va yordam teng, kamsitishsiz taqsimlanadi.</li></ul>
<div class="note">Deontologiya — tibbiyot xodimining burch va xulq qoidalari majmui: hamkasblar, bemor va jamiyat oldidagi majburiyatlar.</div>`),
          L("Professional xulq", 6, `<ul><li>Bemor bilan munosabat — hurmat, xushmuomalalik, shaxsiy chegaralar.</li>
<li>Hamkasbni bemor oldida tanqid qilmaslik; muammolar — rahbariyat orqali.</li>
<li>Sovg'a va manfaatlar to'qnashuvi: qaror bemor manfaatidan kelib chiqib qabul qilinadi, farmatsevtik kompaniya yoki shaxsiy foydadan emas.</li>
<li>Kiyim, gigiyena, nishon (bejik) — bemor ishonchining birinchi omili.</li></ul>`),
        ]},
        { id: "ETH2", title: "Bemor huquqlari va xabardor rozilik", lessons: [
          L("Xabardor rozilik (informed consent)", 8, `<p>Har qanday tekshiruv yoki muolajadan oldin bemorga tushunarli tilda quyidagilar tushuntiriladi:</p>
<ol><li>Tashxis va muolajaning maqsadi</li><li>Kutilayotgan foyda</li><li>Xavf va asoratlar</li><li>Muqobil usullar (shu jumladan davolanmaslik oqibati)</li></ol>
<p>Rozilik <b>ixtiyoriy</b> bo'lishi, bemor <b>muomalaga layoqatli</b> bo'lishi va istalgan vaqtda <b>qaytarib olinishi</b> mumkin. Voyaga yetmaganlar uchun — ota-ona yoki qonuniy vakil.</p>
<div class="note">Shoshilinch holatda, bemor hushsiz va vakil yo'q bo'lsa, hayotni saqlash uchun zarur yordam roziliksiz ko'rsatiladi va hujjatlashtiriladi.</div>`),
          L("Bemor huquqlari", 5, `<ul><li>Hurmatli munosabat va kamsitilmaslik</li><li>O'z tashxisi haqida to'liq ma'lumot olish</li><li>Shifokorni tanlash, ikkinchi fikr so'rash</li><li>Muolajadan bosh tortish</li><li>Tibbiy sir saqlanishi</li><li>Shikoyat qilish</li></ul>`),
        ]},
        { id: "ETH3", title: "Maxfiylik va tibbiy sir", lessons: [
          L("Tibbiy sir", 7, `<p>Bemorning tashxisi, tekshiruv natijalari, hatto klinikaga murojaat qilgani faktining o'zi ham <b>tibbiy sir</b> hisoblanadi.</p>
<ul><li>Telefonda natijani faqat shaxsini tasdiqlagan bemorning o'ziga yoki u ruxsat bergan shaxsga aytish.</li>
<li>Koridorda, liftda bemor haqida gaplashmaslik.</li>
<li>Kompyuter ekranini qulflash, parolni hech kimga bermaslik.</li>
<li>Bemor rasmini ijtimoiy tarmoqqa uning yozma roziligisiz joylamaslik.</li></ul>
<div class="note">Istisnolar qonun bilan belgilanadi: masalan, tergov organlarining rasmiy so'rovi yoki xavfli yuqumli kasallik haqida xabar berish majburiyati.</div>`),
        ]},
      ],
    },
    {
      id: "COMM", title: "Communication Skills", subtitle: "Bemor bilan samarali muloqot", domain: "communication",
      core: true, icon: "💬", color: "#0891b2", validMonths: 24,
      exam: { count: 10, time: 15, pass: 80, attempts: 3, neg: 0, retakeDays: 2 },
      modules: [
        { id: "COM1", title: "Salomlashish, tinglash va savol berish", lessons: [
          L("Birinchi 30 soniya", 6, `<p>Bemor klinika haqidagi taassurotini birinchi 30 soniyada shakllantiradi.</p>
<ol><li>Ko'z bilan aloqa va tabassum</li><li>Salomlashish va o'zini tanishtirish: <i>"Assalomu alaykum, men hamshira Dilnoza bo'laman"</i></li><li>Bemorni ismi bilan murojaat qilish</li><li>"Sizga qanday yordam bera olaman?"</li></ol>`),
          L("Faol tinglash va savol turlari", 8, `<ul><li><b>Ochiq savollar</b> — suhbat boshida: "Nima sizni bezovta qilyapti?"</li>
<li><b>Yopiq savollar</b> — aniqlashtirish uchun: "Og'riq kechasi kuchayadimi?"</li>
<li><b>Summarizatsiya</b> — "Demak, 3 kundan beri bosh og'rig'i va ko'ngil aynishi bor, to'g'rimi?"</li>
<li>Bemorni gapining o'rtasida bo'lmaslik — tadqiqotlarga ko'ra shifokorlar bemorni o'rtacha 11–20 soniyada to'xtatadi.</li></ul>`),
        ]},
        { id: "COM2", title: "Konflikt va agressiv bemor", lessons: [
          L("Konfliktni boshqarish: LEAP/HEARD", 8, `<p><b>HEARD</b> modeli:</p>
<ul><li><b>H</b>ear — to'liq eshiting, gapini bo'lmang</li><li><b>E</b>mpathize — "Sizni tushunaman, kutish juda charchatadi"</li><li><b>A</b>pologize — vaziyat uchun uzr</li><li><b>R</b>esolve — aniq yechim taklif qiling</li><li><b>D</b>iagnose — sababini tahlil qilib, takrorlanmasligini ta'minlang</li></ul>
<p>Agressiv bemor bilan: ovozni pasaytirish, xavfsiz masofa, chiqish yo'lini ochiq qoldirish, yolg'iz qolmaslik, kerak bo'lsa xavfsizlik xizmatini chaqirish.</p>`),
        ]},
        { id: "COM3", title: "Qarindoshlar va yomon xabar", lessons: [
          L("SPIKES protokoli", 10, `<p>Yomon xabarni yetkazish uchun <b>SPIKES</b>:</p>
<ol><li><b>S</b>etting — alohida xona, o'tirib, telefonni o'chirib</li><li><b>P</b>erception — bemor nimani biladi?</li><li><b>I</b>nvitation — qancha ma'lumot olishni xohlaydi?</li><li><b>K</b>nowledge — oddiy tilda, "ogohlantiruvchi gap" bilan boshlang</li><li><b>E</b>motions — his-tuyg'uga empatiya bilan javob</li><li><b>S</b>trategy & Summary — keyingi reja</li></ol>`),
        ]},
      ],
    },
    {
      id: "SAFETY", title: "Patient Safety", subtitle: "Bemor xavfsizligi (WHO maqsadlari)", domain: "safety",
      core: true, icon: "🛡️", color: "#dc2626", validMonths: 12,
      exam: { count: 10, time: 15, pass: 80, attempts: 3, neg: 0.25, retakeDays: 2 },
      modules: [
        { id: "SAF1", title: "Bemorni identifikatsiya qilish va dori xavfsizligi", lessons: [
          L("Ikki identifikator qoidasi", 6, `<p>Har qanday muolaja, dori berish, qon olishdan oldin bemor <b>kamida 2 ta identifikator</b> bilan tasdiqlanadi: <b>to'liq ism-familiya + tug'ilgan sana</b> (yoki tibbiy karta raqami).</p>
<p>Palata raqami yoki karavot raqami identifikator <b>emas</b>. Bemordan "Siz Aliyevmisiz?" deb emas, "Ism-familiyangiz va tug'ilgan sanangizni ayting" deb so'raladi.</p>`),
          L("Dori xavfsizligi: '5 to'g'ri'", 8, `<ol><li>To'g'ri bemor</li><li>To'g'ri dori</li><li>To'g'ri doza</li><li>To'g'ri yo'l (per os, v/i, m/i…)</li><li>To'g'ri vaqt</li></ol>
<p>Qo'shimcha: to'g'ri hujjatlashtirish va allergiyani tekshirish. <b>High-alert</b> dorilar (insulin, geparin, kaliy xlorid konsentrati, opioidlar) ikki xodim tomonidan mustaqil tekshiriladi.</p>`),
        ]},
        { id: "SAF2", title: "Yiqilish profilaktikasi va shoshilinch javob", lessons: [
          L("Yiqilish xavfi", 6, `<p>Xavf omillari: 65+ yosh, sedativ dorilar, gipotenziya, oldingi yiqilish, kognitiv buzilish. Choralar: karavot past holatda, tormoz qulflangan, chaqiruv tugmasi qo'l yetadigan joyda, sirpanmaydigan poyabzal, tunda yorug'lik, xavf belgisi (bilaguzuk).</p>`),
          L("Shoshilinch holat: 'Code Blue'", 6, `<p>Bemor javob bermasa: xavfsizlikni ta'minlang → javobni tekshiring → <b>yordam chaqiring (Code Blue) va defibrillyator keltiring</b> → nafas va pulsni ≤10 soniyada tekshiring → yo'q bo'lsa darhol CPR 30:2.</p>`),
        ]},
        { id: "SAF3", title: "Tibbiy xatolar va incident reporting", lessons: [
          L("Xatolar madaniyati", 7, `<p>Xatolarning aksariyati tizim nuqsonidan kelib chiqadi (Swiss cheese modeli). <b>Just culture</b> — xato haqida xabar bergan xodim jazolanmaydi; maqsad — tizimni tuzatish.</p>
<p>Incident report: nima, qachon, qayerda, oqibati, ko'rilgan chora. <b>Near miss</b> (bemorga yetib bormagan xato) ham albatta yoziladi.</p>`),
        ]},
      ],
    },
    {
      id: "IPC", title: "Infection Prevention & Control", subtitle: "Infeksiya nazorati", domain: "safety",
      core: true, icon: "🧼", color: "#16a34a", validMonths: 12,
      exam: { count: 10, time: 15, pass: 80, attempts: 3, neg: 0, retakeDays: 2 },
      modules: [
        { id: "IPC1", title: "Qo'l gigiyenasi va PPE", lessons: [
          L("WHO: qo'l gigiyenasining 5 lahzasi", 7, `<ol><li>Bemorga tegishdan <b>oldin</b></li><li>Aseptik muolajadan <b>oldin</b></li><li>Biologik suyuqlik bilan kontaktdan <b>keyin</b></li><li>Bemorga tegishdan <b>keyin</b></li><li>Bemor atrofidagi buyumlarga tegishdan <b>keyin</b></li></ol>
<p>Spirtli antiseptik: 20–30 soniya. Sovun va suv: 40–60 soniya — qo'l ko'rinarli ifloslanganda va <i>C. difficile</i> holatlarida majburiy.</p>`),
          L("PPE kiyish va yechish tartibi", 7, `<p><b>Kiyish:</b> xalat → niqob/respirator → ko'zoynak/shit → qo'lqop.</p>
<p><b>Yechish:</b> qo'lqop → ko'zoynak/shit → xalat → niqob → <b>qo'l gigiyenasi</b>. Eng ifloslangan qism birinchi yechiladi.</p>`),
        ]},
        { id: "IPC2", title: "Sterilizatsiya, dezinfeksiya, chiqindilar", lessons: [

<script>/* js/core.js */
/* MedAcademy core: store (adapterlar), auth, RBAC, curriculum, exam engine, score, sertifikat, analitika. */
(function () {
  const S = window.SEED;
  const COLLECTIONS = ["employees", "attempts", "certificates", "plans", "progress", "skill_assess", "initial",
    "notifications", "audit", "settings", "questions_custom", "exam_overrides", "resets"];

  /* ---------------- util ---------------- */
  const U = {
    uid: (p) => (p || "") + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4),
    now: () => new Date().toISOString(),
    addDays: (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x.toISOString(); },
    addMonths: (d, n) => { const x = new Date(d); x.setMonth(x.getMonth() + n); return x.toISOString(); },
    fmtDate: (d) => d ? new Date(d).toLocaleDateString("uz-UZ", { year: "numeric", month: "2-digit", day: "2-digit" }) : "—",
    shuffle: (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
    avg: (a) => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null,
    esc: (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])),
    daysBetween: (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000),
    norm: (s) => String(s || "").toLowerCase().replace(/[‘’ʻʼ`]/g, "'").replace(/\s+/g, " ").trim(),
  };

  /* ---------------- adapters ---------------- */
  const LocalAdapter = {
    mode: "demo", KEY: "medacademy_demo_v1",
    load() { try { const s = localStorage.getItem(this.KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } },
    persist(db) { try { localStorage.setItem(this.KEY, JSON.stringify(db)); } catch (e) {} },
    async save(col, obj) { this.persist(DB); },
    async remove(col, id) { this.persist(DB); },
    reset() { try { localStorage.removeItem(this.KEY); } catch (e) {} },
  };

  const SupaAdapter = {
    mode: "live", client: null,
    init(cfg) {
      if (!cfg || !cfg.supabaseUrl || !cfg.supabaseAnonKey || !window.supabase) return false;
      this.client = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
      return true;
    },
    async loadAll(uid) {
      const db = emptyDB();
      const { data: profs, error: e1 } = await this.client.from("profiles").select("*");
      if (e1) throw e1;
      const { data: docs, error: e2 } = await this.client.from("docs").select("collection,id,data");
      if (e2) throw e2;
      // urinish va sertifikatlar endi serverdagi alohida jadvallardan olinadi (docs'dagi eski nusxalar e'tiborga olinmaydi)
      (docs || []).forEach((d) => { if (db[d.collection] && !SERVER_OWNED.includes(d.collection)) db[d.collection].push(d.data); });
      const [att, cer, cfg, rst, meta] = await Promise.all([
        this.client.from("exam_attempts").select("*"),
        this.client.from("certificates").select("*"),
        this.client.from("exam_configs").select("*"),
        this.client.from("attempt_resets").select("*"),
        this.client.rpc("question_meta"),
      ]);
      [att, cer, cfg, rst, meta].forEach((r) => { if (r.error) throw r.error; });
      db.attempts = (att.data || []).map(mapAttempt);
      db.certificates = (cer.data || []).map(mapCert);
      db.exam_overrides = (cfg.data || []).map((c) => ({ id: c.course_id, count: c.question_count, time: c.time_min, pass: Number(c.pass_score),
        attempts: c.max_attempts, neg: Number(c.negative_mark), retakeDays: c.retake_days }));
      db.resets = rst.data || [];
      Content.setMeta(meta.data || []);
      // profiles → employees (rol va holat faqat profiles'dan olinadi)
      const byId = Object.fromEntries(db.employees.map((e) => [e.id, e]));
      (profs || []).forEach((p) => {
        const e = byId[p.id] || { id: p.id, onboarded: false, points: 0, createdAt: p.created_at };
        Object.assign(e, { id: p.id, email: p.email, role: p.role, status: p.status,
          department: p.department || e.department || "", fullName: p.full_name });
        if (!e.firstName && p.full_name) { const [f, ...l] = p.full_name.split(" "); e.firstName = f; e.lastName = l.join(" "); }
        if (!byId[p.id]) db.employees.push(e);
      });
      return db;
    },
    async save(col, obj) {
      if (SERVER_OWNED.includes(col)) return; // faqat server (RPC) yozadi
      if (col === "exam_overrides") {
        const { error } = await this.client.from("exam_configs").update({ question_count: obj.count, time_min: obj.time, pass_score: obj.pass,
          max_attempts: obj.attempts, negative_mark: obj.neg, retake_days: obj.retakeDays, updated_at: new Date().toISOString() }).eq("course_id", obj.id);
        if (error) UI.toast("Saqlashda xato: " + error.message, "err");
        return;
      }
      const owner = obj.empId || (col === "employees" ? obj.id : null);
      const row = { collection: col, id: obj.id, data: obj };
      if (owner) row.owner = owner;
      const { error } = await this.client.from("docs").upsert(row);
      if (error) { console.error(error); UI.toast("Saqlashda xato: " + error.message, "err"); }
      if (col === "employees") {
        const p = { full_name: ((obj.firstName || "") + " " + (obj.lastName || "")).trim() };
        if (obj.department) p.department = obj.department;
        await this.client.from("profiles").update(p).eq("id", obj.id);
      }
    },
    async remove(col, id) { await this.client.from("docs").delete().eq("collection", col).eq("id", id); },
    async rpc(fn, args) {
      const { data, error } = await this.client.rpc(fn, args || {});
      if (error) throw new Error(error.message);
      return data;
    },
    async setProfile(id, fields) {
      const { error } = await this.client.from("profiles").update(fields).eq("id", id);
      if (error) { UI.toast("Xato: " + error.message, "err"); return false; }
      return true;
    },
  };

  const SERVER_OWNED = ["attempts", "certificates"];
  const mapAttempt = (a) => ({ id: a.id, empId: a.user_id, courseId: a.course_id, moduleId: a.module_id || null, kind: a.kind, qids: a.qids || [],
    order: a.option_order || {}, dom: a.domain_map, answers: a.answers || {}, results: a.results, score: a.score == null ? null : Number(a.score),
    passed: a.passed, preview: a.is_preview, cfg: a.config || {}, startedAt: a.started_at, deadline: a.deadline, finishedAt: a.finished_at, retakeAfter: a.retake_after, live: true });
  const mapCertOut = (c) => Object.assign({}, c, { score: c.score == null ? null : Number(c.score) });
  const mapCert = (c) => ({ id: c.id, empId: c.user_id, courseId: c.course_id, courseTitle: c.course_title, name: c.name, position: c.position,
    department: c.department, score: c.score == null ? null : Number(c.score), attemptId: c.attempt_id, issuedAt: c.issued_at, expiresAt: c.expires_at, revoked: c.revoked });
  function emptyDB() { const d = {}; COLLECTIONS.forEach((c) => (d[c] = [])); return d; }

  let DB = emptyDB();
  let ADAPTER = LocalAdapter;

  const Store = {
    get db() { return DB; },
    get mode() { return ADAPTER.mode; },
    all(col) { return DB[col] || []; },
    find(col, id) { return (DB[col] || []).find((x) => x.id === id); },
    where(col, fn) { return (DB[col] || []).filter(fn); },
    async put(col, obj) {
      const arr = DB[col]; const i = arr.findIndex((x) => x.id === obj.id);
      if (i >= 0) arr[i] = obj; else arr.push(obj);
      await ADAPTER.save(col, obj);
      return obj;
    },
    async del(col, id) { DB[col] = DB[col].filter((x) => x.id !== id); await ADAPTER.remove(col, id); },
    useDemo() { ADAPTER = LocalAdapter; DB = LocalAdapter.load() || Demo.build(); LocalAdapter.persist(DB); },
    resetDemo() { LocalAdapter.reset(); DB = Demo.build(); LocalAdapter.persist(DB); },
    async useLive(uid) { ADAPTER = SupaAdapter; DB = await SupaAdapter.loadAll(uid); },
    adapter: () => ADAPTER,
  };

  /* ---------------- settings & content ---------------- */
  const Content = {
    settings() {
      const s = Store.find("settings", "global");
      return Object.assign({}, S.DEFAULT_SETTINGS, s || {});
    },
    courses() { return S.COURSES; },
    course(id) { return S.COURSES.find((c) => c.id === id); },
    examCfg(courseId) { const c = this.course(courseId); const o = Store.find("exam_overrides", courseId); return Object.assign({}, c.exam, o || {}); },
    _meta: [], _cache: {}, _admin: null,
    setMeta(list) { this._meta = list; },
    cache(list) { (list || []).forEach((q) => { this._cache[q.id] = Object.assign({}, this._cache[q.id] || {}, q); }); },
    bank(includeDraft) {
      if (Store.mode === "live") return includeDraft && this._admin ? this._admin : this._meta;
      return S.QUESTIONS.concat(Store.all("questions_custom"));
    },
    questions(courseId, moduleId, includeDraft) {
      return this.bank(includeDraft).filter((q) => q.course === courseId && (!moduleId || q.module === moduleId) && (includeDraft || q.status === "approved"));
    },
    question(id) {
      return this._cache[id] || S.QUESTIONS.find((q) => q.id === id) || Store.find("questions_custom", id) || (this._admin || []).find((q) => q.id === id) || this._meta.find((q) => q.id === id);
    },
    /* Mavjud tahlil (review) uchun to'liq savol bormi */
    hasFull(id) { const q = this.question(id); return !!(q && q.q && q.a !== undefined); },
    position(id) { return S.POSITIONS.find((p) => p.id === id); },
    skill(id) { return S.SKILLS.find((s) => s.id === id); },
    visibleModules(course, emp) {
      const pos = this.position(emp && emp.positionId);
      return course.modules.filter((m) => !m.roles || (pos && m.roles.includes(pos.academy)) || (emp && ["super_admin", "education_manager", "instructor"].includes(emp.role)));
    },
    lessons(course, emp) { return this.visibleModules(course, emp).flatMap((m) => m.lessons.map((l, i) => Object.assign({ id: m.id + "_L" + (i + 1), moduleId: m.id }, l))); },
    skillsFor(emp) {
      const pos = this.position(emp.positionId); if (!pos) return [];
      return S.SKILLS.filter((s) => s.academies === "*" || s.academies.includes(pos.academy)).filter((s) => !s.specialty || s.specialty === emp.specialty);
    },
  };

  /* ---------------- RBAC ---------------- */
  const ROLES = {
    super_admin: "Super Admin", hr: "HR", education_manager: "Education Manager",
    department_head: "Bo'lim boshlig'i", instructor: "Instructor", employee: "Xodim",
  };
  const PERMS = {
    "employees.view_all": ["super_admin", "hr", "education_manager", "instructor"],
    "employees.view_dept": ["department_head"],
    "employees.edit": ["super_admin", "hr"],
    "roles.assign": ["super_admin", "hr"],
    "courses.manage": ["super_admin", "education_manager", "instructor"],
    "questions.approve": ["super_admin", "education_manager"],
    "exams.configure": ["super_admin", "education_manager"],
    "skills.assess": ["super_admin", "education_manager", "department_head", "instructor"],
    "settings.edit": ["super_admin", "education_manager"],
    "reports.view": ["super_admin", "hr", "education_manager", "department_head"],
    "audit.view": ["super_admin"],
    "ai.use": ["super_admin", "education_manager", "department_head", "instructor", "hr"],
  };
  const Auth = {
    current: null,
    can(perm, emp) { emp = emp || this.current; return !!emp && (PERMS[perm] || []).includes(emp.role); },
    canSee(target, emp) {
      emp = emp || this.current; if (!emp || !target) return false;
      if (emp.id === target.id) return true;
      if (this.can("employees.view_all", emp)) return true;
      if (this.can("employees.view_dept", emp)) return target.department === emp.department;
      return false;
    },
    visibleEmployees() { return Store.all("employees").filter((e) => this.canSee(e) && e.status !== "rejected"); },
    isStaffAdmin(emp) { emp = emp || this.current; return emp && emp.role !== "employee"; },
  };

  async function audit(action, details) {
    const a = { id: U.uid("A"), uid: Auth.current ? Auth.current.id : null, empId: Auth.current ? Auth.current.id : null, action, details: details || {}, at: U.now() };
    await Store.put("audit", a);
  }

  /* ---------------- Curriculum engine ---------------- */
  const Curriculum = {
    targetCourses(emp) {
      const pos = Content.position(emp.positionId); const out = [];
      S.COURSES.forEach((c) => {
        if (c.core) out.push({ c, reason: "core" });
        else if (pos && c.academy && c.academy.includes(pos.academy)) out.push({ c, reason: "academy" });
        else if (pos && c.specialty && c.specialty.includes(emp.specialty) && ["doctor", "resident"].includes(pos.family)) out.push({ c, reason: "specialty" });
      });
      return out;
    },
    weakDomains(emp) {
      const ini = Store.find("initial", emp.id); if (!ini) return [];
      const th = Content.settings().recommendBelow;
      return Object.entries(ini.domains).filter(([, v]) => v < th).map(([k]) => k);
    },
    async assign(emp) {
      const s = Content.settings(); const weak = this.weakDomains(emp); const created = [];
      for (const { c, reason } of this.targetCourses(emp)) {
        const id = emp.id + "_" + c.id;
        const ex = Store.find("plans", id);
        const priority = weak.includes(c.domain);
        if (ex) { if (ex.priority !== priority) { ex.priority = priority; await Store.put("plans", ex); } continue; }
        const p = { id, empId: emp.id, courseId: c.id, reason, priority, mandatory: reason !== "recommended",
          assignedAt: U.now(), dueDate: U.addDays(emp.hireDate || U.now(), s.dueDays + (reason === "core" ? 0 : 30)) };
        if (new Date(p.dueDate) < new Date()) p.dueDate = U.addDays(U.now(), s.dueDays);
        await Store.put("plans", p); created.push(p);
      }
      // zaif sohalar bo'yicha qo'shimcha tavsiya (masalan, shifokorga Clinical Decision Making)
      const pos = Content.position(emp.positionId);
      if (weak.includes("medical") && pos && ["doctor", "resident"].includes(pos.family)) {
        for (const cid of ["DOC_EM", "RESIDENT_START"]) {
          const id = emp.id + "_" + cid;
          if (!Store.find("plans", id)) { const p = { id, empId: emp.id, courseId: cid, reason: "recommended", priority: true, mandatory: false, assignedAt: U.now(), dueDate: U.addDays(U.now(), 60) }; await Store.put("plans", p); created.push(p); }
        }
      }
      return created;
    },
    plans(empId) { return Store.where("plans", (p) => p.empId === empId).sort((a, b) => (b.priority - a.priority) || (a.reason === "remedial" ? -1 : 0)); },
    lessonDone(empId, lessonId) { return !!Store.find("progress", empId + "_" + lessonId); },
    async markLesson(emp, course, lesson) {
      const id = emp.id + "_" + lesson.id;
      if (!Store.find("progress", id)) { await Store.put("progress", { id, empId: emp.id, courseId: course.id, lessonId: lesson.id, at: U.now() }); emp.points = (emp.points || 0) + 2; await Store.put("employees", emp); }
    },
    courseState(emp, courseId) {
      const c = Content.course(courseId); const lessons = Content.lessons(c, emp);
      const done = lessons.filter((l) => this.lessonDone(emp.id, l.id)).length;
      const mods = Content.visibleModules(c, emp);
      const modQuiz = mods.filter((m) => Exam.best(emp.id, courseId, m.id) != null).length;
      const best = Exam.best(emp.id, courseId, null);
      const cert = Cert.active(emp.id, courseId);
      const lastFinal = Exam.attempts(emp.id, courseId, null).slice(-1)[0];
      const plan = Store.find("plans", emp.id + "_" + courseId);
      const total = lessons.length + mods.length;
      const progress = cert ? 100 : Math.round(((done + modQuiz) / Math.max(1, total)) * 90 + (best != null ? 10 : 0));
      let status = "not_started";
      if (cert) status = "completed"; else if (lastFinal && !lastFinal.passed) status = "failed"; else if (done || modQuiz) status = "in_progress";
      const overdue = status !== "completed" && plan && plan.dueDate && new Date(plan.dueDate) < new Date();
      return { c, lessons, done, mods, modQuiz, best, cert, progress: Math.min(100, progress), status, overdue, plan, lastFinal,
        finalUnlocked: done >= lessons.length && modQuiz >= mods.length };
    },
  };

  /* ---------------- Exam engine ---------------- */
  const Exam = {
    attempts(empId, courseId, moduleId, kind) {
      return Store.where("attempts", (a) => a.empId === empId && (courseId == null || a.courseId === courseId) &&
        (moduleId === undefined || (a.moduleId || null) === moduleId) && (!kind || a.kind === kind) && a.finishedAt && !a.preview)
        .sort((a, b) => a.finishedAt.localeCompare(b.finishedAt));
    },
    best(empId, courseId, moduleId) { const a = this.attempts(empId, courseId, moduleId); return a.length ? Math.max(...a.map((x) => x.score)) : null; },
    eligibility(emp, courseId) {
      const cfg = Content.examCfg(courseId); const plan = Store.find("plans", emp.id + "_" + courseId);
      const finals = this.attempts(emp.id, courseId, null, "final");
      const srv = Store.where("resets", (r) => r.user_id === emp.id && r.course_id === courseId)[0];
      const resetAt = (srv && srv.reset_at) || (plan && plan.attemptsResetAt);
      const used = finals.filter((a) => !resetAt || a.finishedAt > resetAt).length;
      const last = finals.slice(-1)[0];
      if (Cert.active(emp.id, courseId)) return { ok: true, used, left: cfg.attempts - used, note: "Sertifikat mavjud — qayta topshirish ixtiyoriy" };
      if (used >= cfg.attempts) return { ok: false, used, left: 0, reason: "Urinishlar tugadi. Instructor yoki Education Manager urinishlarni tiklashi kerak." };
      const retake = (last && last.retakeAfter) || (plan && plan.retakeAfter);
      if (last && !last.passed && retake && new Date(retake) > new Date() && !(resetAt && resetAt > last.finishedAt))
        return { ok: false, used, left: cfg.attempts - used, reason: "Qayta topshirish sanasi: " + U.fmtDate(retake) + ". Avval Remedial Training'ni o'ting." };
      return { ok: true, used, left: cfg.attempts - used };
    },
    async build(emp, courseId, moduleId, kind, preview) {
      if (Store.mode === "live") {
        const r = await SupaAdapter.rpc("start_exam", { p_course: courseId, p_kind: kind, p_module: moduleId || null, p_domains: null, p_preview: !!preview });
        return Exam.fromServer(r);
      }
      const cfg = Content.examCfg(courseId);
      let bank = Content.questions(courseId, moduleId);
      let count = kind === "module" ? Math.min(4, bank.length) : Math.min(cfg.count, bank.length);
      // modullar bo'yicha proporsional tanlash
      const byMod = {}; U.shuffle(bank).forEach((q) => (byMod[q.module] = byMod[q.module] || []).push(q));
      const picked = []; const keys = U.shuffle(Object.keys(byMod));
      while (picked.length < count) { let added = false; for (const k of keys) { if (picked.length >= count) break; const q = byMod[k].shift(); if (q) { picked.push(q); added = true; } } if (!added) break; }
      const order = {};
      picked.forEach((q) => { if (q.o && ["single", "multiple", "case"].includes(q.type)) order[q.id] = U.shuffle(q.o.map((_, i) => i)); if (q.type === "match") order[q.id] = U.shuffle(q.o.map((_, i) => i)); });
      return { id: U.uid("T"), empId: emp.id, courseId, moduleId: moduleId || null, kind, qids: picked.map((q) => q.id), order,
        answers: {}, startedAt: U.now(), deadline: kind === "module" ? null : U.addMinutesISO(cfg.time), cfg };
    },
    gradeOne(q, resp, neg) {
      let ok = false, pts = 0;
      if (resp == null || resp === "" || (Array.isArray(resp) && !resp.length)) return { ok: false, pts: 0, blank: true };
      switch (q.type) {
        case "single": case "case": ok = resp === q.a; break;
        case "tf": ok = resp === q.a; break;
        case "multiple": { const a = [...q.a].sort().join(","), r = [...resp].sort().join(","); ok = a === r; break; }
        case "match": { const n = q.o.length; let c = 0; q.o.forEach((p, i) => { if (resp[i] === p[1]) c++; }); pts = c / n; ok = c === n; return { ok, pts }; }
        case "short": { const r = U.norm(resp); ok = q.a.some((k) => r.includes(U.norm(k))); break; }
      }
      pts = ok ? 1 : -(neg || 0);
      return { ok, pts };
    },
    /* Server javobini klient urinish obyektiga aylantirish; savollar keshga olinadi (javobsiz) */
    fromServer(r) {
      Content.cache(r.questions || []);
      const att = mapAttempt({ id: r.id, user_id: r.empId, course_id: r.courseId, module_id: r.moduleId, kind: r.kind, qids: r.qids, option_order: r.order,
        domain_map: r.dom, answers: r.answers, results: r.results, score: r.score, passed: r.passed, is_preview: r.preview, config: r.cfg,
        started_at: r.startedAt, deadline: r.deadline, finished_at: r.finishedAt, retake_after: r.retakeAfter });
      const i = DB.attempts.findIndex((x) => x.id === att.id); if (i >= 0) DB.attempts[i] = att; else DB.attempts.push(att);
      return att;
    },
    async saveProgress(att) { if (Store.mode === "live" && att.kind === "final") { try { await SupaAdapter.rpc("save_answers", { p_attempt: att.id, p_answers: att.answers }); } catch (e) { console.warn(e); } } },
    /* Live: baholash serverda. Demo: lokal. Natijadan keyingi qadamlar (reja, ball, bildirishnoma) ikkalasida bir xil. */
    async grade(att) {
      if (Store.mode === "live") {
        const r = await SupaAdapter.rpc("submit_exam", { p_attempt: att.id, p_answers: att.answers });
        Content.cache(r.questions || []);
        const done = Exam.fromServer(r.attempt);
        const cert = r.certificate ? mapCertOut(r.certificate) : null;
        if (cert) DB.certificates.push(cert);
        return { att: done, cert, domains: r.domains };
      }
      const neg = att.kind === "final" ? att.cfg.neg : 0; let total = 0; const results = {};
      att.qids.forEach((id) => { const q = Content.question(id); const r = this.gradeOne(q, att.answers[id], neg); results[id] = Object.assign(r, { topic: q.topic, course: q.course, module: q.module }); total += r.pts; });
      att.results = results;
      att.score = Math.max(0, Math.round((total / att.qids.length) * 1000) / 10);
      att.passed = att.score >= att.cfg.pass;
      att.finishedAt = U.now();
      if (att.kind === "final" && !att.passed) att.retakeAfter = U.addDays(U.now(), att.cfg.retakeDays);
      delete att.deadline;
      await Store.put("attempts", att);
      return { att, cert: null };
    },
    async submit(att0) {
      const g = await this.grade(att0); const att = g.att;
      const emp = Store.find("employees", att.empId);
      let cert = g.cert;
      if (att.preview) return { att, cert };
      if (att.kind === "final") {
        const plan = Store.find("plans", emp.id + "_" + att.courseId);
        if (att.passed) {
          cert = cert ? await Cert.announce(emp, cert) : await Cert.issue(emp, att);
          emp.points = (emp.points || 0) + 50 + Math.round(att.score / 10);
          if (plan) { plan.status = "completed"; plan.completedAt = U.now(); plan.remedial = false; await Store.put("plans", plan); }
        } else {
          const weak = this.weakTopicsOf(att);
          if (plan) {
            plan.remedial = true; plan.remedialTopics = weak; plan.retakeAfter = U.addDays(U.now(), att.cfg.retakeDays); plan.status = "remedial";
            plan.remedialDone = false; await Store.put("plans", plan);
          }
          await Notify.push(emp.id, "failed", "Imtihon: FAILED — " + Content.course(att.courseId).title,
            "Natija " + att.score + "%. Remedial Training tayinlandi: " + (weak.join(", ") || "barcha mavzular") + ". Qayta topshirish: " + U.fmtDate(U.addDays(U.now(), att.cfg.retakeDays)));
        }
      } else if (att.kind === "module" && att.score >= 60) { emp.points = (emp.points || 0) + 10; }
      await Store.put("employees", emp);
      await audit("exam.submit", { course: att.courseId, module: att.moduleId, kind: att.kind, score: att.score, passed: att.passed });
      return { att, cert };
    },
    weakTopicsOf(att) {
      const t = {}; att.qids.forEach((id) => { const r = att.results[id] || {}; const q = Content.question(id) || {}; const k = r.topic || q.topic || "—"; t[k] = t[k] || [0, 0]; t[k][1]++; if (r.ok) t[k][0]++; });
      return Object.entries(t).filter(([, [c, n]]) => c / n < 0.7).map(([k]) => k);
    },
  };
  U.addMinutesISO = (m) => new Date(Date.now() + m * 60000).toISOString();

  /* ---------------- Certificates ---------------- */
  const Cert = {

  /* ---------------- Score & level ---------------- */
  const Score = {
    domains(emp) {
      const out = {}; const ini = Store.find("initial", emp.id);
      const plans = Curriculum.plans(emp.id);
      Object.keys(S.DOMAINS).forEach((d) => {
        if (d === "practical") {
          const sk = Content.skillsFor(emp); const res = sk.map((s) => Skills.latest(emp.id, s.id)).filter(Boolean);
          out[d] = res.length ? Math.round((res.filter((r) => r.result === "PASS").length / res.length) * 100) : null; return;
        }
        const vals = plans.filter((p) => { const c = Content.course(p.courseId); return c && c.domain === d; })
          .map((p) => Exam.best(emp.id, p.courseId, null)).filter((v) => v != null);
        out[d] = vals.length ? Math.round(U.avg(vals)) : (ini && ini.domains[d] != null ? ini.domains[d] : null);
      });
      return out;
    },
    overall(emp) {
      const w = Content.settings().weights; const d = this.domains(emp); let s = 0, ws = 0;
      Object.entries(w).forEach(([k, v]) => { if (d[k] != null) { s += d[k] * v; ws += v; } });
      return ws ? Math.round((s / ws) * 10) / 10 : null;
    },
    level(score) {
      const lv = Content.settings().levels.slice().sort((a, b) => b.min - a.min);
      if (score == null) return { id: "none", name: "Baholanmagan", icon: "⚪" };
      return lv.find((l) => score >= l.min) || lv[lv.length - 1];
    },
    topics(empId) {
      const t = {};
      Exam.attempts(empId, null).forEach((a) => a.qids.forEach((id) => { const q = Content.question(id) || {}; const r = a.results && a.results[id]; if (!r) return; const k = r.topic || q.topic; if (!k) return; t[k] = t[k] || { c: 0, n: 0, course: r.course || q.course }; t[k].n++; if (r.ok) t[k].c++; }));
      return Object.entries(t).map(([topic, v]) => ({ topic, course: v.course, pct: Math.round((v.c / v.n) * 100), n: v.n })).sort((a, b) => a.pct - b.pct);

  };

      const rows = Object.entries(t).map(([topic, v]) => ({ topic, ...v, pct: Math.round((v.c / v.n) * 100) }));
      const weak = rows.filter((r) => r.pct < 70).sort((a, b) => a.pct - b.pct);

        mk("doctor", "Jasur", "Aliyev", "employee", "experienced_doctor", "Kardiologiya", "Kardiologiya", 1500, 9, { education: "Andijon DTI, kardiologiya rezidenturasi", demoLabel: "Doctor" }),
        mk("resident", "Malika", "Karimova", "employee", "new_resident", "Kardiologiya", "Kardiologiya", 20, 0.5, { education: "Namangan DU tibbiyot fakulteti", demoLabel: "Resident" }),
        mk("nurse", "Dilnoza", "Yusupova", "employee", "nurse", "Terapiya", "—", 700, 5, { education: "Namangan tibbiyot texnikumi", demoLabel: "Nurse" }),
        mk("reception", "Sevara", "Rahimova", "employee", "receptionist", "Registratura", "—", 10, 1, { education: "Oliy ma'lumot (iqtisod)", demoLabel: "Receptionist", onboarded: false }),
        mk("sanitary", "Gulnora", "Tursunova", "employee", "sanitary", "Jarrohlik", "—", 400, 3, { demoLabel: "Sanitary Staff" }),
        mk("assistant", "Bobur", "Ergashev", "employee", "doc_assistant", "Kardiologiya", "—", 250, 2, { demoLabel: "Doctor Assistant" }),
        mk("dept_head", "Rustam", "Xolmatov", "department_head", "senior_doctor", "Kardiologiya", "Kardiologiya", 3000, 22, { demoLabel: "Bo'lim boshlig'i (Kardiologiya)" }),
        mk("instructor", "Nodira", "Saidova", "instructor", "head_nurse", "Terapiya", "—", 2000, 15, { demoLabel: "Instructor" }),
      ];
      const first = ["Aziz", "Shoira", "Bekzod", "Kamola", "Javohir", "Nigora", "Otabek", "Madina", "Sardor", "Zulfiya", "Akmal", "Feruza", "Ulug'bek", "Laylo", "Islom", "Gavhar", "Sherzod", "Munisa", "Doniyor", "Zarina", "Jamshid", "Mohira"];
      const last = ["Qodirov", "Mirzayeva", "Nazarov", "Abdullayeva", "Sobirov", "Ismoilova", "Hasanov", "Toshpo'latova", "Raximov", "Usmonova", "Yo'ldoshev", "Normatova", "Ortiqov", "Sultonova", "Boboyev", "Jo'rayeva", "Karimov", "Haydarova", "Mahmudov", "Qosimova", "Ergashev", "Zokirova"];
      const plan = [["doctor", "Kardiologiya", "Kardiologiya"], ["specialist", "Nevrologiya", "Nevrologiya"], ["junior_doctor", "Pediatriya", "Pediatriya"], ["doctor", "Jarrohlik", "Jarrohlik"], ["senior_doctor", "Ginekologiya", "Ginekologiya"],
        ["resident", "Kardiologiya", "Kardiologiya"], ["resident", "Nevrologiya", "Nevrologiya"], ["new_resident", "Pediatriya", "Pediatriya"], ["nurse", "Kardiologiya"], ["senior_nurse", "Jarrohlik"], ["junior_nurse", "Pediatriya"],
        ["new_nurse", "Reanimatsiya"], ["nurse", "Nevrologiya"], ["receptionist", "Registratura"], ["receptionist", "Registratura"], ["sanitary", "Kardiologiya"], ["sanitary", "Terapiya"], ["doc_assistant", "Nevrologiya"],
        ["doctor", "Terapiya", "Terapiya"], ["intern", "Terapiya", "Terapiya"], ["nurse", "Ginekologiya"], ["experienced_doctor", "Radiologiya", "Radiologiya"]];
      const bg = plan.map((p, i) => mk("emp" + (i + 1), first[i], last[i], "employee", p[0], p[1], p[2], 60 + Math.floor(R() * 2000), Math.round(R() * 15), {}));
      db.employees = demoUsers.concat(bg);
      db.settings = [Object.assign({ id: "global" }, S.DEFAULT_SETTINGS)];
      const prevDB = DB; DB = db; // vaqtincha
      const sync = (fn) => { const orig = ADAPTER; ADAPTER = { save() {}, remove() {}, mode: "demo" }; try { fn(); } finally { ADAPTER = orig; } };
      sync(() => {
        const skill = (e) => ({ doctor: 0.85, resident: 0.62, nurse: 0.82, reception: 0.7, sanitary: 0.75, assistant: 0.68, dept_head: 0.92, instructor: 0.9 }[e.id] || (0.55 + R() * 0.42));
        db.employees.forEach((e) => {
          if (e.id === "reception") return; // yangi xodim — onboarding'dan o'tishi kerak
          const k = skill(e);
          const dom = {}; Object.keys(S.DOMAINS).filter((d) => d !== "practical").forEach((d) => (dom[d] = Math.round(Math.min(100, Math.max(20, k * 100 + (R() - 0.5) * 30)))));
          if (e.id === "resident") Object.assign(dom, { medical: 62, communication: 82, safety: 55, public_health: 70, sales: 45 });
          db.initial.push({ id: e.id, empId: e.id, domains: dom, at: U.addDays(e.hireDate, 1) });
          // plans (sinxron)
          Curriculum.targetCourses(e).forEach(({ c, reason }) => db.plans.push({ id: e.id + "_" + c.id, empId: e.id, courseId: c.id, reason, mandatory: true,
            priority: dom[c.domain] != null && dom[c.domain] < 70, assignedAt: e.hireDate, dueDate: U.addDays(e.hireDate, reason === "core" ? 30 : 60) }));
          if (e.id === "resident") return; // rezident — endi boshlayapti (individual yo'l namunasi)
          const pls = db.plans.filter((p) => p.empId === e.id);
          pls.forEach((p) => {
            const c = Content.course(p.courseId); if (R() > 0.15 + k * 0.8) return; // ba'zi kurslar boshlanmagan
            const lessons = Content.lessons(c, e); const doneAll = R() < 0.85;
            lessons.forEach((l, i) => { if (doneAll || i < lessons.length / 2) db.progress.push({ id: e.id + "_" + l.id, empId: e.id, courseId: c.id, lessonId: l.id, at: U.addDays(U.now(), -Math.floor(R() * 200)) }); });
            if (!doneAll) return;
            Content.visibleModules(c, e).forEach((m) => db.attempts.push(this.fakeAttempt(e, c, m.id, "module", k)));
            let tries = 0, passed = false;
            while (tries < 2 && !passed) { const a = this.fakeAttempt(e, c, null, "final", k); db.attempts.push(a); tries++; passed = a.passed;
              if (passed) { const daysAgo = Math.floor(R() * 600); a.finishedAt = U.addDays(U.now(), -daysAgo);
                db.certificates.push({ id: Cert.code(), empId: e.id, courseId: c.id, courseTitle: c.title, score: a.score, name: e.firstName + " " + e.lastName,
                  position: (Content.position(e.positionId) || {}).name, attemptId: a.id, issuedAt: a.finishedAt, expiresAt: U.addMonths(a.finishedAt, c.validMonths || 24) });
                p.status = "completed"; p.completedAt = a.finishedAt; e.points += 50 + Math.round(a.score / 10); }
              else { p.remedial = true; p.status = "remedial"; p.retakeAfter = U.addDays(U.now(), -1); p.remedialTopics = Exam.weakTopicsOf(a); }
            }
          });
          Content.skillsFor(e).forEach((s) => { if (R() < 0.7) db.skill_assess.push({ id: U.uid("SA"), empId: e.id, skillId: s.id, result: R() < k + 0.1 ? "PASS" : "FAIL", comment: "", assessorId: "instructor", assessorName: "Nodira Saidova", at: U.addDays(U.now(), -Math.floor(R() * 300)) }); });
          e.points += db.progress.filter((p) => p.empId === e.id).length * 2;
        });
        // Dr. Aliyev: AI tahlil namunasi uchun kardiologiya zaif mavzulari
        const doc = db.employees.find((e) => e.id === "doctor");
        ["CARDIO_BASIC", "DOC_EM"].forEach((cid) => { for (let i = 0; i < 2; i++) db.attempts.push(this.fakeAttempt(doc, Content.course(cid), null, "final", 0.88, ["Heart Failure", "EKG", "Drug selection", "Lab interpretation"])); });
        db.notifications.push({ id: U.uid("N"), empId: "reception", type: "welcome", title: "Xush kelibsiz!", body: "Onboarding va Initial assessment'ni topshiring — tizim siz uchun individual o'quv dasturi tuzadi.", read: false, at: U.now() });
      });
      DB = prevDB;
      return db;
    },
    fakeAttempt(e, c, moduleId, kind, k, weakTopics) {
      const R = () => this.rnd();
      const bank = Content.questions(c.id, moduleId); const n = kind === "module" ? Math.min(4, bank.length) : Math.min(c.exam.count, bank.length);
      const qs = bank.slice().sort(() => R() - 0.5).slice(0, n); const results = {}; let ok = 0;
      qs.forEach((q) => { let p = k + (R() - 0.5) * 0.25; if (weakTopics && weakTopics.includes(q.topic)) p -= 0.55; const r = R() < p; results[q.id] = { ok: r, pts: r ? 1 : 0 }; if (r) ok++; });
      const score = Math.round((ok / n) * 1000) / 10;
      const at = U.addDays(U.now(), -Math.floor(R() * 300));
      return { id: U.uid("T"), empId: e.id, courseId: c.id, moduleId, kind, qids: qs.map((q) => q.id), answers: {}, results, score, passed: score >= c.exam.pass, startedAt: at, finishedAt: at, cfg: c.exam };
    },
  };

  window.MA = { U, Store, Content, Auth, ROLES, PERMS, Curriculum, Exam, Cert, Score, Skills, Notify, Analytics, AI, Initial, Game, Demo, SupaAdapter, audit };
})();

</script>
<script>/* js/views.js */
/* MedAcademy views — barcha sahifalar */
(function () {

  const UI = window.UI = {

    modal(html) { const bg = document.createElement("div"); bg.className = "modal-bg"; bg.innerHTML = `<div class="modal">${html}</div>`; bg.onclick = (ev) => { if (ev.target === bg) bg.remove(); }; document.body.appendChild(bg); return bg; },
    closeModal() { document.querySelectorAll(".modal-bg").forEach((m) => m.remove()); },
    bar(p, cls) { return `<div class="bar ${cls || ""}"><i style="width:${Math.max(0, Math.min(100, p || 0))}%"></i></div>`; },
    lvl(score) { const l = Score.level(score); return `<span class="lvl">${l.icon} ${l.name}</span>`; },
    pct(v) { return v == null ? "—" : v + "%"; },
    stat(icon, v, l, sub) { const txt = typeof v === "string" && !/^[\d.,%\/—\s]+$/.test(v); return `<div class="card stat"><div class="ic">${icon}</div><div class="v" style="${txt ? "font-size:18px;padding-top:6px" : ""}">${v}</div><div class="l">${l}</div>${sub ? `<div class="tiny">${sub}</div>` : ""}</div>`; },
    avatar(emp) { return `<div class="avatar">${e((emp.firstName || "?")[0] + (emp.lastName || "")[0] || "")}</div>`; },
    name(emp) { return e((emp.firstName || "") + " " + (emp.lastName || "")); },
    statusBadge(st) {
      return { completed: `<span class="badge b-green">Tugallangan</span>`, in_progress: `<span class="badge b-blue">Jarayonda</span>`, failed: `<span class="badge b-red">FAILED · Remedial</span>`, not_started: `<span class="badge">Boshlanmagan</span>` }[st] || "";
    },
    reasonBadge(r) { return { core: `<span class="badge b-blue">Majburiy</span>`, academy: `<span class="badge b-violet">Akademiya</span>`, specialty: `<span class="badge b-violet">Mutaxassislik</span>`, recommended: `<span class="badge b-amber">Tavsiya</span>` }[r] || ""; },
  };

  const V = window.V = {};

  /* ======================= LANDING / AUTH ======================= */
  V.landing = function () {

    const blocks = [["🩺", "Medical Training"], ["🧪", "Clinical Skills"], ["🌍", "Public Health"], ["💬", "Communication"], ["🤝", "Sales & Service"], ["🛡️", "Patient Safety"], ["🎓", "Certification"]];
    return `<div class="land">
      <header><div class="brand" style="padding:0"><div class="logo">M</div><div><b>MedAcademy</b><span>${e(Content.settings().org)}</span></div></div>
      <div class="grow"></div><a class="btn ghost" href="#verify">Sertifikatni tekshirish</a></header>
      <section class="hero">
        <div>
          <span class="k">MEDICAL PROFESSIONAL DEVELOPMENT PLATFORM</span>

          <div class="tag">Train. Assess. Improve.</div>
          <p class="muted" style="font-size:16px;max-width:560px">Shifokor, rezident, hamshira, registrator, sanitarka va shifokor yordamchilari uchun lavozimga mos individual o'quv yo'li, klinik case'larga asoslangan imtihonlar, amaliy ko'nikmalarni baholash, QR-sertifikatlar va rahbariyat uchun real vaqt monitoringi.</p>

    }
    return `<div class="tabs">${tabs.map(([k, t]) => `<button class="${k === tab ? "on" : ""}" onclick="document.getElementById('authbox').innerHTML=V.authForm('${k}')">${t}</button>`).join("")}</div>${body}`;
  };

  V.pending = function (emp) {
    return `<div class="land" style="display:grid;place-items:center;padding:20px"><div class="card" style="max-width:480px;text-align:center">
      <div style="font-size:40px">⏳</div><h2>Akkaunt tasdiqlanishi kutilmoqda</h2>
      <p class="muted">${UI.name(emp)}, ro'yxatdan o'tdingiz. HR yoki administrator akkauntingizni tasdiqlagach, o'quv dasturingiz ochiladi.</p>
      <button class="btn" onclick="A.logout()">Chiqish</button> <button class="btn primary" onclick="location.reload()">Yangilash</button></div></div>`;
  };

  V.verify = function (code) {
    const res = code ? (window.APP.verifyResult || null) : null;
    return `<div class="land"><header><a class="brand" href="#" style="padding:0"><div class="logo">M</div><div><b>MedAcademy</b><span>Sertifikatni tekshirish</span></div></a></header>
      <div style="max-width:560px;margin:30px auto;padding:0 16px"><div class="card"><h2>Sertifikatni tekshirish</h2>
      <form onsubmit="A.verify(event)" class="row"><input name="code" class="grow" placeholder="IMP-2026-XXXXXX" value="${e(code || "")}" style="flex:1;min-width:200px"><button class="btn primary">Tekshirish</button></form>
      <div id="vres" style="margin-top:14px">${res === null ? "" : V.verifyResult(res)}</div></div></div></div>`;
  };
  V.verifyResult = function (c) {
    if (!c) return `<div class="note" style="border-color:var(--red);background:var(--red-50)">❌ Bunday sertifikat topilmadi.</div>`;

    return `<div class="note" style="border-color:${ok ? "var(--green)" : "var(--amber)"};background:${ok ? "var(--green-50)" : "var(--amber-50)"}">${ok ? "✅" : "⚠️"} <b>${e(st)}</b></div>

  V.dashboard = function () {

  /* ======================= EXAM RUNNER ======================= */
  V.exam = function () {
    const st = window.APP.exam; if (!st) return `<div class="card empty">Faol imtihon yo'q. <a href="#courses">Kurslar</a></div>`;
    const att = st.att; const i = st.i; const id = att.qids[i]; const q = Content.question(id);
    const title = att.kind === "initial" ? "Initial assessment" : (Content.course(att.courseId).title + (att.kind === "module" ? " · modul testi" : " · yakuniy imtihon"));
    const resp = att.answers[id];
    let body = "";
    const ord = att.order[id] || (q.o ? q.o.map((_, k) => k) : []);
    if (["single", "case"].includes(q.type)) body = ord.map((k, n) => `<div class="opt ${resp === k ? "sel" : ""}" onclick="A.answer(${k})"><span class="mk">${String.fromCharCode(65 + n)}</span><span>${e(q.o[k])}</span></div>`).join("");
    if (q.type === "multiple") body = `<p class="tiny">Bir nechta to'g'ri javob bo'lishi mumkin</p>` + ord.map((k, n) => `<div class="opt ${(resp || []).includes(k) ? "sel" : ""}" onclick="A.answerMulti(${k})"><span class="mk">${(resp || []).includes(k) ? "✓" : String.fromCharCode(65 + n)}</span><span>${e(q.o[k])}</span></div>`).join("");
    if (q.type === "tf") body = [[true, "To'g'ri"], [false, "Noto'g'ri"]].map(([v, t]) => `<div class="opt ${resp === v ? "sel" : ""}" onclick="A.answer(${v})"><span class="mk">${v ? "T" : "F"}</span><span>${t}</span></div>`).join("");
    if (q.type === "match") { const rights = q.rights || (att.order[id] || q.o.map((_, k) => k)).map((k) => q.o[k][1]); body = q.o.map((p, k) => `<div class="row" style="margin:8px 0"><div style="flex:1;font-weight:600">${e(p[0])}</div><select style="flex:1" onchange="A.answerMatch(${k},this.value)"><option value="">— tanlang —</option>${rights.map((r) => `<option ${resp && resp[k] === r ? "selected" : ""}>${e(r)}</option>`).join("")}</select></div>`).join(""); }
    if (q.type === "short") body = `<input placeholder="Javobingiz" value="${e(resp || "")}" oninput="A.answerText(this.value)" autofocus>`;
    const answered = att.qids.filter((x) => att.answers[x] != null && att.answers[x] !== "" && !(Array.isArray(att.answers[x]) && !att.answers[x].length)).length;
    return `<div class="row between" style="margin-bottom:12px"><div><div class="tiny">${e(title)}</div><h2 style="margin:0">Savol ${i + 1} / ${att.qids.length}</h2></div>${att.deadline ? `<div class="card" style="padding:8px 14px">⏱ <span class="timer" id="timer">--:--</span></div>` : ""}</div>
      <div class="grid" style="grid-template-columns:minmax(0,1fr) 240px;align-items:start" id="egrid">
      <div class="card qcard"><div class="row" style="gap:6px;margin-bottom:8px"><span class="badge">${{ single: "Single choice", multiple: "Multiple choice", tf: "True / False", match: "Matching", case: "Clinical case", short: "Short answer" }[q.type]}</span><span class="badge b-blue">${e(q.topic)}</span></div>
        ${q.type === "case" ? `<div class="vignette">🩺 <b>Klinik vaziyat</b></div>` : ""}<h3 style="font-size:17px;font-weight:600">${e(q.q)}</h3>${body}
        <div class="row" style="margin-top:16px"><button class="btn" ${i === 0 ? "disabled" : ""} onclick="A.qgo(${i - 1})">← Oldingi</button><div class="grow"></div>
        ${i < att.qids.length - 1 ? `<button class="btn primary" onclick="A.qgo(${i + 1})">Keyingi →</button>` : `<button class="btn green" onclick="A.finishExam()">Yakunlash</button>`}</div></div>
      <div class="card"><div class="tiny" style="margin-bottom:8px">Javob berildi: ${answered}/${att.qids.length}</div><div class="qnav">${att.qids.map((x, k) => `<button class="${att.answers[x] != null && att.answers[x] !== "" ? "ans" : ""} ${k === i ? "cur" : ""}" onclick="A.qgo(${k})">${k + 1}</button>`).join("")}</div>
        <button class="btn green sm" style="width:100%;justify-content:center;margin-top:12px" onclick="A.finishExam()">Imtihonni yakunlash</button>${att.kind !== "initial" ? `<button class="btn ghost sm" style="width:100%;justify-content:center;margin-top:6px" onclick="A.abortExam()">Bekor qilish</button>` : ""}</div></div>`;

  V.review = function (a) {
    return a.qids.map((id, n) => {
      const q = Content.question(id); const r = (a.results || {})[id] || {}; const resp = (a.answers || {})[id];
      if (!q || q.a === undefined) return `<div class="card" style="margin-bottom:10px"><b class="small">${n + 1}.</b> <span class="tiny">Savol tahlili mavjud emas</span></div>`;
      let yours = "—", right = "";
      const opt = (k) => q.o && q.o[k] != null ? q.o[k] : k;
      if (["single", "case"].includes(q.type)) { yours = resp != null ? opt(resp) : "—"; right = opt(q.a); }
      if (q.type === "multiple") { yours = (resp || []).map(opt).join("; ") || "—"; right = q.a.map(opt).join("; "); }
      if (q.type === "tf") { yours = resp == null ? "—" : resp ? "To'g'ri" : "Noto'g'ri"; right = q.a ? "To'g'ri" : "Noto'g'ri"; }
      if (q.type === "match") { yours = resp ? q.o.map((p, k) => p[0] + " → " + (resp[k] || "—")).join("; ") : "—"; right = q.o.map((p) => p[0] + " → " + p[1]).join("; "); }
      if (q.type === "short") { yours = resp || "—"; right = q.a[0]; }
      return `<div class="card" style="margin-bottom:10px;border-left:4px solid ${r.ok ? "var(--green)" : "var(--red)"}"><div class="row between"><b class="small">${n + 1}. ${e(q.q)}</b><span class="badge ${r.ok ? "b-green" : "b-red"}">${r.ok ? "Correct" : r.blank ? "Javobsiz" : "Incorrect"}</span></div>
        <div class="small" style="margin-top:6px">Sizning javobingiz: <b>${e(yours)}</b>${r.ok ? "" : `<br>To'g'ri javob: <b style="color:var(--green)">${e(right)}</b>`}</div>
        <div class="expl">💡 <b>Explanation:</b> ${e(q.e)}${q.ev ? `<br>📚 <b>Evidence:</b> ${e(q.ev)}` : ""}${q.r ? `<br>📖 <b>Recommended reading:</b> ${e(q.r)}` : `<br>📖 <b>Recommended reading:</b> ${e(Content.course(q.course).title)} → ${e((Content.course(q.course).modules.find((m) => m.id === q.module) || {}).title || "")}`}</div></div>`;
    }).join("");
  };
